	<g class="st2">
		<text transform="matrix(1 0 0 1 64.92 549)"><tspan x="0" y="0" style="font-family:'MyriadPro-Regular'; font-size:12px;">In all other cases, start up your old Mac normally.</tspan><tspan x="0" y="14.4" style="font-family:'MyriadPro-Regular'; font-size:12px;">On your new Mac:</tspan><tspan x="0" y="28.8" style="font-family:'MyriadPro-Regular'; font-size:12px;">Open Migration Assistant, which is in the Utilities folder of your Applications folder.</tspan><tspan x="0" y="43.2" style="font-family:'MyriadPro-Regular'; font-size:12px;">Click Continue.</tspan><tspan x="0" y="57.6" style="font-family:'MyriadPro-Regular'; font-size:12px;">When asked how you want to transfer your information, select the option to transfer from a Mac, Time Machine backup, or startup disk.</tspan><tspan x="0" y="72" style="font-family:'MyriadPro-Regular'; font-size:12px;">Click Continue.</tspan><tspan x="0" y="86.4" style="font-family:'MyriadPro-Regular'; font-size:12px;"> </tspan><tspan x="0" y="100.8" style="font-family:'MyriadPro-Regular'; font-size:12px;">On your old Mac:</tspan><tspan x="0" y="115.2" style="font-family:'MyriadPro-Regular'; font-size:12px;">If you started in target disk mode or are migrating from a Time Machine backup, skip these steps.</tspan><tspan x="0" y="129.6" style="font-family:'MyriadPro-Regular'; font-size:12px;">Open Migration Assistant.</tspan><tspan x="0" y="144" style="font-family:'MyriadPro-Regular'; font-size:12px;">Click Continue.</tspan><tspan x="0" y="158.4" style="font-family:'MyriadPro-Regular'; font-size:12px;">When asked how you want to transfer your information, select the option to transfer to another Mac.</tspan><tspan x="0" y="172.8" style="font-family:'MyriadPro-Regular'; font-size:12px;">Click Continue. </tspan><tspan x="0" y="187.2" style="font-family:'MyriadPro-Regular'; font-size:12px;">On your new Mac:</tspan><tspan x="0" y="201.6" style="font-family:'MyriadPro-Regular'; font-size:12px;">When asked to select a Mac, Time Machine backup, or other startup disk, click the appropriate icon.</tspan><tspan x="0" y="216" style="font-family:'MyriadPro-Regular'; font-size:12px;">Click Continue. You might see a security code.</tspan><tspan x="0" y="230.4" style="font-family:'MyriadPro-Regular'; font-size:12px;"> </tspan><tspan x="0" y="244.8" style="font-family:'MyriadPro-Regular'; font-size:12px;">On your old Mac:</tspan><tspan x="0" y="259.2" style="font-family:'MyriadPro-Regular'; font-size:12px;">If you started in target disk mode or are migrating from a Time Machine backup, skip these steps.</tspan><tspan x="0" y="273.6" style="font-family:'MyriadPro-Regular'; font-size:12px;">If you see a security code, make sure that it&apos;s the same code as on your new Mac.</tspan><tspan x="0" y="288" style="font-family:'MyriadPro-Regular'; font-size:12px;">Click Continue.</tspan><tspan x="0" y="302.4" style="font-family:'MyriadPro-Regular'; font-size:12px;">On your new Mac:</tspan><tspan x="0" y="316.8" style="font-family:'MyriadPro-Regular'; font-size:12px;">If you&apos;re migrating from a Time Machine backup, you might be asked to enter a password for the backup or Time Capsule. You should then see a list of backups organized by date and time. Choose the backup that you want to use, then click Continue.</tspan><tspan x="0" y="331.2" style="font-family:'MyriadPro-Regular'; font-size:12px;">Select the information to transfer, then click Continue to start the transfer. If you have a lot of content, the transfer might take several hours to finish.</tspan></text>
