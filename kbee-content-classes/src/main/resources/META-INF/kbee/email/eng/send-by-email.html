<html>
<div style="float:left; display:block; width:100%; text-align:center; font-size:17px; line-height: 1.25em;">

<div style="margin:auto; width: 100%;  max-width: 1200px; float: none; background: white; border-radius: 10px;">

	<div style="float:left; width:100%; border: 1px solid #d8dcdf;">

	<div style="background: #fbfbfb; float: left; width: 100%; border-radius: 10px; margin-bottom: 30px; padding: 30px 0;  border-radius: 10px 10px 0 0; border-bottom: 1px solid  #d8dcdf;">	

		<div style="float: left;  width: 100%;">
			<a style="float: none; margin: auto;   display: block; margin-left: 0;" href="https://kbee.io" target="_blank"> 
			
				<#if content.domain.logo??>
					<img style="max-width:220px" src="${content.domain.logo.publicurl}">
				<#else>
					<img src="http://kbee.io/images/kbee-vert.png">
				</#if>
	
			
			</a>
		</div>
		<div style="float: left; margin: auto; width: 100%; padding: 15px 0 0 0;">
			<a	style="float: left; padding: 15px 0; text-align: center; width: 100%;" title="KBEE"> 				
				<div style="color:black;  width:100%; float: left; margin-bottom:5px;">			
					<span  style="font-weight: bold;">KBEE</span>
				</div>
			 	<div style="color:black;  width:100%; float: left; margin-bottom:0px;">
			 		<span>${domain-name}</span>
			 	</div>
			</a>
		</div>
	</div>
	<div style="color:black;  float: none; margin: auto; width: 100%; max-width:980px; padding-left:30px; padding-right:30px; box-sizing: border-box;">
					<span style="margin-bottom:5px; width:100%; float:left;"><b>Contenido</b></span>		
					<span style="margin-bottom:20px; width:100%; float:left;">${content.title}</span>
					
					<span style="margin-bottom:5px; width:100%; float:left;"><b>Comentario</b></span>		
					<span style="margin-bottom:20px; width:100%; float:left;">${comment}</span>
					
	</div>

	<div style="color:black; float: left; width: 100%; margin-top: 40px; margin-bottom: 60px;">
					<a title="abrir tarea" href= "${public-url}" style="text-decoration: none; border-radius: 10px; width: 60%; height: 34px; font-size: 16px; box-shadow: none; color: white; border: 1px solid #0d5072; background: #0d5072; padding: 15px 40px;"	target="_blank">Abrir</a>
	</div>
	
	<div style="color:black;  float: left; width: 100%; margin-top: 0px; margin-bottom: 60px;">
		<a style="color: #0d5072;" href="${library-url}" target="_blank">Biblioteca</a>
	</div>

	
</div>
</div>
</div>
</html>
