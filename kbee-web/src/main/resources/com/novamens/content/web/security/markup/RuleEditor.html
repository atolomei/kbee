<wicket:panel>
	
	<div class="row col-lg-10 col-md-9 col-xs-12">
		<form wicket:id="form" class="form-container" role="form">
			<div wicket:id="rule-description" class="row">
				<div class="col-xs-12 form-group">	
					<div class="col-lg-12 alert alert-info" role="alert"><span wicket:id="text"></span></div>
				</div>
			</div>
			<div class="row">
				<div class="col-lg-8 col-md-8 col-xs-6 form-group" wicket:id="name"/>
				<div class="col-lg-2 col-md-2 col-xs-3 form-group" wicket:id="type"/>
				<div class="col-lg-2 col-md-2 col-xs-3 form-group" wicket:id="id"/>
			</div>
			<div class="row">
				<div class="col-xs-12 form-group" wicket:id="notes"/>
			</div>
			<div class="row">
				<div class="col-xs-12 form-group rule-condition"  wicket:id="condition-editor"/>
				<div class="col-xs-12 form-group rule-condition" wicket:id="condition"/>
			</div>
			<div class="row">
				<div class="col-xs-12 form-group" wicket:id="acl-editor"/>
			</div>
		</form>
	</div>

	<div class="button-container col-md-3 col-lg-2 col-xs-12" wicket:id="buttons"/>
	
</wicket:panel>
