


<wicket:panel>
	<div class="list-panel" style="width:100%; float:left; padding: 0; margin:0;">
		
		<div style="width:100%; float:left;">
		
			<div wicket:id="filter-container" class="inline-filter-container">
							<span><input  placeholder="filter list" class="field" wicket:id="filter-input"  type="text" /></span>
							<!-- i title="type to filter the list" class="far fa-skating" style=
							"margin-right: 6px;    margin-top: 0px;    border-radius: 4px;    float: right;    padding: 10px-
						    color: #0d5072;
						    font-size: 20px;
						    opacity: 1;
						    right: 2px;
						    top: 0;
						    margin-top: -40px;
						    z-index: 99999;
						    height: 38px"></i-->
			</div>
	
			<div wicket:id="results" class="results">
						<ul style="width:100%; float:left;  max-height: 606px;    overflow: auto; margin-bottom: 5px; margin-top: 5px; margin-bottom: 15px;">
							<li wicket:id="result" class="result">
								<a wicket:id="link" class="title">
										<span wicket:id="title"></span>
								</a>
								
							</li>
						</ul>
			</div>
		</div>	
	</div>
</wicket:panel>
