
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">

<body>
	<wicket:extend>
		<div wicket:id="lbox"  style="position: absolute; width:100%; height:100%; line-height:1.5em; font-size:15px;">
				<div  class="login-container" style="position: absolute; padding: 0; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; border: 1px solid  #d8dcdf; padding: 40px; border-radius: 4px; max-width: 500px;">
							<div style="text-align: center; float: left; width:100%; margin-bottom:0px;">
								<div wicket:id="logo-container">
									<img wicket:id="logo"></img>
								</div>
								<span wicket:id="title" style="font-size:17px; font-weight:normal;"></span>
							</div>
							
						 	<form  wicket:id="form" name="f" action="/j_spring_security_check" method="post" style="text-align:center;">
									
									<div class="col-xs-12 col-md-12 col-lg-12 form-group">
									    	<span wicket:message key="intro" />
									</div>
									
									<div id="username" class=" col-xs-12 col-md-12 col-lg-12 form-group">
										<span style="margin-right: 6px;"><wicket:message key="new-pwd-title" /></span>
										<span style="font-weight: bold; padding: 1px 6px; background: #FFF6C5; color:#111111;" wicket:id="username">
										</span>
									</div>
									
									<fieldset style="border: none; text-align: center; float:left;">
											
											<div class=" col-xs-12 col-md-12 col-lg-12 form-group">
												<wicket:message key="pwd-characters " />
											</div>
													
											<div class="col-xs-12 col-md-12 col-lg-12 form-group" id="password">
													<div wicket:id="password" tabindex="2" />
											</div>
											
											<div id="col-xs-12 col-md-12 col-lg-12 password-verification" class="form-group">
													<div wicket:id="password-verification" tabindex="3" />
											</div>
											
											<div class="alert alert-danger col-xs-12" style="text-align:center;" wicket:id="feedback"></div>
											
											<div id="submit" class="col-xs-12 col-md-12 col-lg-12 form-group" style="margin-top:12px;">
													<input wicket:id="submit" name="submit" value="Save" type="submit" class="btn btn-primary btn-lg" tabindex="4">
													</input>
											</div>
									</fieldset>
								</form>
							
								<div wicket:id="feedback" class="alert alert-danger col-xs-12" style="text-align: center;"></div>
							
								<div  style="text-align: center; margin-top:12px;"  class="col-xs-12 form-group">
									<a href="/login" class="btn-link"><wicket:message key="backtologin"/></a>
						 		</div>						  	
				</div>
		</div>
	
	</wicket:extend>

</body>

</html>
