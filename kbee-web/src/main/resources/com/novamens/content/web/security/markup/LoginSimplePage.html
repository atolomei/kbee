<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<body>
	<wicket:extend>
		<div wicket:id="lbox" class="kbeelogin">
				<div class="login-container">
							<div style="text-align: center; float: left; width:100%; margin-bottom:42px;">
								<div class="logo-container" wicket:id="logo-container">
									<img class="logo" wicket:id="logo"></img>
								</div>
							</div>
						 	<form name="f" action="/j_spring_security_check" method="post">
									<div class="col-xs-12 form-group">
										<input class="form-control" type="text" name="j_username" placeholder="Username" style="text-align: center;" />
									</div>
									<div class="col-xs-12 form-group">
										<input class="form-control" type="password" name="j_password" placeholder="Password" style="text-align: center;" />
									</div>
									
									<div style="text-align: center; margin-top:18px;" class="col-xs-12 form-group">
										<input class="btn btn-primary btn-lg login loginmodal-submit" type="submit" name="login"  value="Sign on" />
									</div>
									
								  	<div class="alert alert-danger col-xs-12" style="text-align:center;" wicket:id="error"></div>
								  	
									<div  style="text-align: center; margin-top:12px;"  class="col-xs-12 form-group">
										<a href="/forgotpassword"><wicket:message key="forgot" /></a>
						  			</div>
							</form>
							
							<div wicket:id="footer" class="kbee-content-footer" />
				</div>
		</div>
	
	</wicket:extend>

</body>

</html>
