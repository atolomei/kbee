<wicket:panel>
	
	<div class="col-lg-12 col-xs-12" style="padding:0;">
		
		<div  wicket:id="feedback-panel">
			<div class="col-lg-12 panel alert alert-info" wicket:id="feedback"/>
		</div>
		
		<div wicket:id="actions" class="row">	
			<div class="task-form col-lg-12 panel">
				<form wicket:id="form" id="actionform" method="post" action="#" class="form-container col-lg-12">
					<div wicket:id="task-actions"/>											
				</form>									
			</div>
		</div>
		
		<div class="row">
			<div class="col-lg-12 col-xs-12 col-md-12" wicket:id="selection" />
		</div>
		
	</div>
</wicket:panel>
