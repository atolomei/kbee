<wicket:panel>
	
	<div style="margin-left:0; float:left; width:100%;"   wicket:id="container">
		<ul class="col-lg-12">
			<li style="width:100%; float:left;" wicket:id="relationship-list">
				<wicket:container wicket:id="relationship-item" />
			</li>
		</ul>
	</div>
</wicket:panel>

<wicket:fragment wicket:id="relationship-table-fragment">
	<ul class="col-lg-12 col-md-12 col-xs-12">
		<li wicket:id="related">
			<div wicket:id="related-view">[]</div>
		</li>
	</ul>
</wicket:fragment>

<wicket:fragment wicket:id="related-embedded-view-fragment">
	<div class="alert alert-info" style="width:100%;">
		<span wicket:id="text">[]</span>
	</div>
</wicket:fragment>
