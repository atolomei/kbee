
<wicket:panel>
			
			<div class="console-page-header page-header">
				<div style="float: left;">
					<h1> <wicket:message key="newsite"/> </h1>
		        	<div wicket:id="breadcrumb" />
				</div>
			</div>

		<section class="browser">
			<div class="container" style="margin:auto;">
					<div class="col-xs-12 col-md-12 col-lg-12" style="margin-top:72px; margin-bottom: 92px;">
						<div class="row">
							<form wicket:id="form" class="col-md-12 col-lg-12 col-xs-12 " role="form">
								<fieldset style="margin-bottom:12px;">
									<div class="row">
										<div class="col-xs-12 col-md-12 col-lg-12 form-group" wicket:id="title"/>
										<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="sitetype" />
										<div class="col-xs-12 col-md-12 col-lg-12 form-group" wicket:id="url"/>
									</div>
									<div class="row">
										<div class="col-xs-12 col-md-12 col-lg-12 form-group" wicket:id="subtitle"/>
									</div>
									<div class="row">
										<div class="col-xs-12 col-md-12 col-lg-12 form-group" wicket:id="description"/>
									</div>
								</fieldset>
							</form>
						</div>
						
						<div class="row">
							<div class="col-md-12 col-lg-12 col-xs-12" wicket:id="buttons"/>
						</div>
					</div>
			</div>
		</section>
		

</wicket:panel>
