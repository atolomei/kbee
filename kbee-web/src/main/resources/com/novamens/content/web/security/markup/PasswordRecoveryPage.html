<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<body>

	<wicket:extend>
		
	<div class="auxpage kbee">	
		<div class="header-container">
			<div class="header">	
					<div class="logo">
						<a href="/workspace" style="float: left;">
							<div class="isologo" style="float: left;">
								<img wicket:id="logo"></img>
							</div>
						</a>
					</div>
			</div>
		</div>

		<div class="kbee" wicket:id="canvas" style="margin:  auto; width: 620px; font-size:1.15em;">
					
				<form id="formulario" wicket:id="form" class="login" name="f" action="/j_spring_security_check" method="post" 	style="float: left;   width: 100%;   margin-top: 4em;">
												
					<h2 style="font-size: 1.25em; text-align: center; text-transform: none; color: #cc0000; margin-bottom: 1em;">RESET PASSWORD</h2>	
							
					<div class="field" style="margin-bottom: 0em;  text-align: center;">
				    	<p>								
				    	You use an <strong>RPDD</strong> username and password to sign in to secure pages on <strong>RPDD</strong>. 
						For your protection, create a password that contains many characters, 
						including numbers. <br/><br/>
						Store your password securely, do not share it, and change it periodically.
						</p>
					</div>
		
					<div id="username" class="field" style="margin-bottom: 2em;  text-align: center;">
							<span style="margin-right: 6px;"><wicket:message key="new-pwd-title" /></span><span style="font-weight: bold; padding: 1px 6px; background: #FFF6C5; color:#111111;" wicket:id="username"></span>
					</div>
								
					<fieldset style="border: none; text-align: center;">
						
						<div id="password" class="field">
							<div style="width:100%; margin-bottom:10px; float:left"><label class="label" for="password"><wicket:message key="new-pwd" /></label></div>
							<div style="width:100%; float:left"><input wicket:id="password" name="password" class="value" style="width:16em;" type="password"  tabindex="2"></input></div>
						</div>

						<div id="password-verification" class="field expanded" style="margin-top:1em;">
							<div style="width:100%; margin-bottom:10px; float:left"><label class="label" for="password-verification"><wicket:message key="new-pwd-verification" /></label></div>
							<div style="width:100%; float:left"><input wicket:id="password-verification" name="password-verification" class="value" type="password"  style="width:16em;" tabindex="3"></input></div>
						</div>

						<div class="alert alert-danger col-xs-12" style="text-align:center;" wicket:id="feedback"></div>
						
						
						<div id="submit" class="field" style="margin-top: 3em;">
						 	<div class="label">
								<input wicket:id="submit" name="submit" value="Save" type="submit" class="button" 
								 tabindex="4"></input>
							</div>
						</div>
						
					<div class="login" style="margin-top: 48px; float:left; width:40%; margin-left:30%; margin-rigt:30%;">
							<div class="label" style="text-align: center;">
								<a href="/login" style="color: #0d5072; font-weight: normal;"><wicket:message key="backtologin"/></a>
							</div>
					</div>
						
						</fieldset>
				</form>
				
				<div class="panel" style="text-align: center; margin: 0; float: left;">
					<span wicket:id="feedback" class="error" style="font-size: 0.9em;  line-height: 1.4em;"></span>
				</div>
			</div>
		</div>
	</wicket:extend>
</body>
</html>
