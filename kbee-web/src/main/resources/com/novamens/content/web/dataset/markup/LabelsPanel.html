<wicket:panel>

	<div class="container-fluid">
	   <div class="row">
	   		<div class="col-lg-9 col-md-9 col-xs-12">
	   			   <div class="row">
						   	<div class="col-lg-12 col-xs-12 col-md-12">
									<span class="col-lg-12 col-xs-12 col-md-12 alert alert-info" role="alert"> 
										<wicket:message key="onlyroot" />
									</span>
							</div>
	   				</div>
	   
	   			   <div class="row" style="margin: 0;">	   
						<ul wicket:id="label-list" class="media-list col-lg-12 col-md-12 cool-xs-12" style="margin-bottom: 4em;">
							<li class="media bck" style="overflow: visible; width:100%; margin-top:0; padding: 4px 0;" wicket:id="label-element">
								<wicket:container wicket:id="label-view"/>
							</li>
						</ul>
	   			    </div>
	   										
					<div wicket:id="remove-dialog" class="modal" tabindex="-1" role="dialog"/>
					<div class="col-lg-12 col-xs-12 col-md-12" wicket:id="new-label-editor" />
			</div>
			
			<div class="buttons-container col-lg-3 col-md-3 col-xs-12">
					<a wicket:id="add-label" class="btn btn-sm btn-primary" style="float:right;"><wicket:message key="add" /></a>
			</div>
		</div>
		
	</div>
				
	<wicket:fragment wicket:id="label-view-fragment">
		<div wicket:id="edit-container" class="col-lg-12 col-md-12 col-xs-12" style="float:left; width:100%;">
				<span wicket:id="icon" style="font-size: 22px; padding: 18px 6px 18px 12px" />
				<span class="media-heading" wicket:id="label" style="margin-left: 6px; vertical-align:super;"></span>
				<div wicket:id="editor" class="col-lg-12 col-md-12 col-xs-12" style="float:left; margin-top:8px;"/>
				<div class="menu" wicket:id="dropdown" style="float:right; position: relative; margin-top:6px;">
						<a class="dropdown-toggle" data-toggle="dropdown" wicket:id="menulink"  style="cursor:pointer;">
							<span class="glyphicon btn-mini glyphicon-option-horizontal"></span>
						</a>
						<ul wicket:id="menu" class="dropdown-menu dropdown-menu-right" style="top:30px; right:12px; position: absolute;"/>
				</div>
		</div>
	</wicket:fragment>

</wicket:panel>
