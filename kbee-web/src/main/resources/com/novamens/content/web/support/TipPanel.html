<wicket:panel>
	<div class="tip">
		
		<div wicket:id="thumbnail-container" class="thumbnail-container">
			<img wicket:id="img"/>
		</div>
		
		<div wicket:id="text-container"  class="text-container with-image">
				<h2 wicket:id="title"></h2>
				<div wicket:id="text"></div>
				<div class="buttons-container">
						<a wicket:id="close" class="btn-link"> <wicket:message key="close" /></a>
						<a wicket:id="next" class="btn-link atright"> <wicket:message key="next" /></a>				
				</div>
		</div>
	</div>
</wicket:panel>
