<wicket:panel>
	<div class="content-header">
		<h1 class="title" wicket:id="xcontent-title" style="width:100%; float:left; cursor:pointer;">
			<span wicket:id="lock-icon" class="fas fa-lock" style="color: #efc075;    font-size: 18px;  margin-right: 5px;"></span>
			<span wicket:id="title-text" ></span>
		</h1>
		
		<div wicket:id="title-container" class="col-lg-12 col-md-12 col-xs-12" style="padding: 24px; background: #E4E6E7; border: 1px solid #E4E6E7; border-radius:4px; margin-bottom: 12px;"> 
			<div wicket:id="ztitle-editor"/>
			<div style="width:100%; display: inline-block; padding-top:20px;">
				<a wicket:id="cancel-link" class="btn btn-xs btn-default">
					<span><wicket:message key="cancel"/></span>
				</a>
				<a wicket:id="save-link" class="btn btn-xs btn-primary">
					<span><wicket:message key="save"/></span>
				</a>
				
				<div style="float:right">
				<a class="btn-link" wicket:id="rule-link">
					<span> <wicket:message key="enable-rule" /></span>
				</a>
				<a class="btn-link atright" style="float:right;" wicket:id="view-rule-link" target="_blank">
					<span> <wicket:message key="view-rule" /></span>
				</a>
				</div>
			</div>
		</div>
				
		<div class="subtitle" wicket:id="summary" style="float:left;"/>
		<div wicket:id="labels"  style="float:left; clear:left;" />
	</div>
</wicket:panel>
