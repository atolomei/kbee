<wicket:panel>


	<div style="float:right;">
		<div style="padding-right:16px; padding-left:0px; float:left;">
			<div style="text-transform: uppercase; font-weight: bold;  font-size:14px;"><wicket:message key="content.status"/></div>
			<div style="text-align:center;"  wicket:id="status"></div>	
		</div>
		
		
		<div style="padding-right:0px; padding-left:16px; float:left;">
			<div style="text-transform: uppercase;font-weight: bold;  font-size:14px;"><wicket:message key="content.version"/></div>
			<div wicket:id="version-container" style="text-align: center;">
				<span  wicket:id="version"></span>
				<span style="margin-left: 0px;    font-size: 13px;      color: #6CC79F;    text-transform: uppercase;" wicket:id="head"></span>
			</div>	
			
		</div>
	</div>
</wicket:panel>
