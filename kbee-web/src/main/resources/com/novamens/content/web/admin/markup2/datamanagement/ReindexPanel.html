<wicket:panel>



	<div class="row">
		<form id="form" method="post" class="col-lg-5 col-md-8 col-xs-12"
			action="#" wicket:id="form">

			<div class="form-group">
				<label class="control-label">Expression</label>
				<textarea class="form-control" wicket:id="statement" rows="8"
					cols="20"></textarea>
			</div>
			<div>
				<a wicket:id="cleanindex-button" href="#"
					class="btn btn-sm btn-default">Clean Index</a> <a
					wicket:id="reindex-button" href="#" class="btn btn-sm btn-primary">Reindex</a>
			</div>
			<div wicket:id="feedback"></div>
		</form>
	</div>

	<div class="row" style="margin-top: 4em;">
		<div class="col-lg-12 col-xs-12 col-md-12">
			<h2>History</h2>
			<div class="form-group">
				<span wicket:id="history"></span>
			</div>
		</div>
	</div>


</wicket:panel>
