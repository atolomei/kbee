<wicket:panel>
	
<div class="row">
	<div class="col-lg-12 col-xs-12 col-md-12">
		
		<h2 style="width:100%; float:left;"><wicket:message key="contents"/></h2>
		<table class="table table-striped table-bordered table-hover">
			<thead>
				<tr class="headers">
					<th wicket:id="property"><wicket:container wicket:id="label"/></th>
					<th class="col-lg-2"><span> <wicket:message key="grid.status"/> </span></th>
					<th style="text-align: center;" class="col-lg-1"><span> <wicket:message key="grid.action"/> </span></th>
				</tr>
			</thead>
			<tbody>
		 		<tr wicket:id="selection">
					<td wicket:id="property"><wicket:container wicket:id="value"/><a class="btn-link" target="_blank" wicket:id="link"><wicket:container wicket:id="value"/></a></td>
					<td class="col-lg-2" wicket:id="status"></td>
					<td style="text-align: center;" class="col-lg-1"><a wicket:id="remove-link" title="Remove"><span  class="far fa-times"/></a></td>
				</tr>
			</tbody>
		</table>
	</div>
</div>
	
</wicket:panel>
