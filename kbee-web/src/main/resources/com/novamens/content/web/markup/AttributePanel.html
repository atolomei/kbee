<wicket:panel>
		
		<span><h3 class="title" wicket:id="attribute">[]</h3></span>
		
		<fieldset>
		<ul style="float: left; width: 100%">
			<li class="item" wicket:id="valuesview">
				<div class="control">
					<div class="panel" style="width: 60%; float: left;">
						<div>
							<label>
								<span wicket:id="value"></span>
							</label>
						</div>
					</div>
					<div class="toolbar">	
						<a class="button" wicket:id="up-link"> <wicket:message key= "up"/></a>
						<a class="button" wicket:id="down-link"> <wicket:message key= "down"/></a>
						<a class="button" wicket:id="remove-link"> <wicket:message key= "remove"/></a>
					</div>	
				</div> 
			</li>
			<li>
				<div class="control" style="float:left;">
					<div>
						<label for="value">
							<input id="value" wicket:id="value" style="float: left; margin-left: 0px; padding: 6px 6px; border-radius: 4px; border: 1px solid  #d8dcdf; background-position: 99% center; background-repeat: no-repeat;	background-size: 21px;" class="field len300"/>
						</label>
					</div>	
				</div>
			</li>
 		</ul>
		</fieldset>
</wicket:panel>
