<wicket:panel>
	
	
	<div class="launcher-editor-container">
		
		<h2 wicket:id="launcherName" style="margin-bottom:15px; float:left;"></h2>
		
		<div style="float:right;" wicket:id="buttons"/>
		<button wicket:id="delete-button" type="submit" style="float:right; margin-right: 10px;" class="btn btn-default btn-sm"><wicket:message key="delete"/></button>
		
		
		<form wicket:id="form" role="form" class="form-container col-lg-12 col-xs-12 col-md-12">
			
			<div class="row">
				
				<div class="row">
						
						<div class="form-group col-xs-12 col-md-12 col-lg-12">
								<div wicket:id="procedure" style="width:100%;" />
								<!-- div class="col-xs-12 col-md-12 col-lg-12" wicket:id="procedure-description" /-->
								<a wicket:id="procedure-link"   style="float:right; font-size:13px; margin-bottom: -20px;" class="btn btn-link"> <wicket:message key="open-procedure"/> </a>
								
							</div>
				</div>
				
				<div class="row">
					<div class="col-xs-12 col-md-12 col-lg-12 form-group" wicket:id="label"/>
					<div class="col-xs-12 col-md-12 col-lg-12 form-group" wicket:id="launcherGroup"/>
					<div class="col-xs-12 col-md-12 col-lg-12 form-group" wicket:id="enabled"/>
					<div class="col-xs-12 col-md-12 col-lg-12 form-group" wicket:id="enabledContext"/>
				</div>
			</div>
					
			
				<div class="row">
					<div class="col-xs-12 col-md-12 col-lg-12" style="padding:0; margin:0;" wicket:id="acl-editor"/>
				</div>
			
		</form>
		
	</div>
	
</wicket:panel>



<wicket:fragment wicket:id="procedure-description-fragment">
	
	<div class="content-header">
		<div style ="float: left; width: 82px;height: 82px; border-radius: 50%;overflow: visible; -webkit-border-radius: 150px;	background: none;     position: relative;">
				
				<div class="user-photo-container">
					<a href="#">
						<img class="avatar" wicket:id="procedure-image"/>
					</a>
				</div>
		</div>
		<div style="padding-left: 100px;">
			<a href="#">	
				<h1 wicket:id="title" style="float:left;"/>
				<div style="float:left;width:100%;"><span wicket:id="description">Software Developer</span></div>
			</a>
		</div>
	</div>	
	
	
</wicket:fragment>
