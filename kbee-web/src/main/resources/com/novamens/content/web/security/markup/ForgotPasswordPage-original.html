<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<body>

	<wicket:extend>
	
			<div class="kbee kbee-login-header-container">
			<div class="header">
					<div class="logo">
							<div class="isologo">
								<h1 class="null" style="float: left;" alt="kbee login" >
									<a href="/login">
										<img wicket:id="logo"></img>
									</a>
								</h1> 	
							</div>
					</div>
				</div>
			</div>

			<div wicket:id="canvas" style="margin:  auto; width: 1024px;">
												
				<div style="line-height: 1.35em; float: left; margin-top: 64px; margin-left: 150px; margin-right: 150px; text-align: center;  font-size: 19px;">
					<h2 style="font-size: 19px; margin-bottom: 12px; text-transform: none;"> <wicket:message key="forgotpassword.title"/></h2>
					<p style="font-size: 19px; line-height: 1.35em;"><wicket:message key="forgotpassword.instructions" /></p>
				</div>
			
				<form id="formulario" class="login" method="post" action="#" wicket:id="form" style="margin-top: 0px;">
					
					<fieldset style="border: none;">
						
						<div id="username" class="field">
							<label class="label" for="username"><wicket:message key="forgotpassword.label.user"/></label>
							<input class="value" style="background: white;border: 1px solid #666666;" wicket:id="username" tabindex="1"></input>
						</div>

						<div id="password" class="field">
							<label class="label" for="email"><wicket:message key="forgotpassword.label.email"/></label>
							<input class="value" style="background: white;border: 1px solid #666666;" type="text" wicket:id="email" tabindex="2"></input>
						</div>

				
						<div class="panel">
							<span wicket:id="feedback" style="font-size: 18px;"></span>
						</div>

						<div id="submit" class="field" style="margin-top: 32px;">
						 	<div class="label">
								<input wicket:id="submit" value="Enviar" type="submit" class="button" tabindex="3"></input>
							</div>
						</div>
						
						</fieldset>
				</form>
				
				<div class="login" style="margin-top: 36px;">
							<div class="label" style="text-align: center;">
								<a href="/login" style="color: black; font-weight: bold;"><wicket:message key="forgotpassword.backtologin"/></a>
							</div>
				</div>
			
			</div>
	
		<div wicket:id="footer" class="kbee-content-footer" />
		
	</wicket:extend>
</body>
</html>
