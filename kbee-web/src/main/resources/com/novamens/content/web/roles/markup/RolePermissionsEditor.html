<wicket:panel>
	
		<form wicket:id="form" class="form-container standard-canvas" role="form">
			<div class="row">
				<div class="col-md-2 col-lg-2 col-xs-12  button-container" style="margin-bottom:0;" wicket:id="buttons"/>
				<h2 class="col-lg-10 col-xs-12 col-md-10"> <span wicket:id="title" /></h2>

				
									
				<div class="panel" style="width:100%; float:left;">

 					<div class="col-md-12 col-lg-12 col-xs-12" style="margin-top:10px;">
						<div class="alert alert-info" style="margin-bottom:10px;">
							<span  wicket:id="description"></span>	 
						</div>
					</div>


						<div class="col-lg-12 col-xs-12 col-md-12">
							<div class="row">
									<div class="col-xs-12 form-group" wicket:id="permissions-editor" style="margin-bottom:0;"/>
							</div>
							<small wicket:id="read-write-delete"> <wicket:message key="read-write-delete" /></small>
						</div>
				</div>	
			</div>
		</form>
	
	
</wicket:panel>




<wicket:fragment wicket:id="content-permissions-fragment">
	
	<div class="acl-editor permissions">
		<label class="control-label" for="tabs"> <wicket:message key="permissions" /></label>
		<div class="panel panel-default" style="width:100%; float:left;">
			<div id="tabs" wicket:id="tabs"  style="padding-top:15px;" class="tabs col-lg-12"/>
		</div>
	</div>
</wicket:fragment>
