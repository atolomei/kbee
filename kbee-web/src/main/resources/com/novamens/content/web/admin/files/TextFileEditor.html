<wicket:panel>

	<form wicket:id="form" class="col-md-12 col-lg-10 col-xs-12" role="form" style="margin: 0;">
		
		<div class="row">
			<h2 class="col-lg-12 col-xs-12 col-md-12">
				<span wicket:id="filename"></span>
			</h2>
		</div>
		
		<fieldset style="float:left; width:100%; margin-bottom: 12px;">
			<div class="row">
				<div class="col-xs-12 col-md-12 col-lg-12 form-group"
					wicket:id="text" />
			</div>
			<div class="button-container col-md-12 col-lg-12 col-xs-12"
				wicket:id="buttons" />
		</fieldset>
		
	</form>

</wicket:panel>
