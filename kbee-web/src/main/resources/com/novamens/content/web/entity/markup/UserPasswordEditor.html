<wicket:panel>
	<div class="row standard-canvas">
	
		<form wicket:id="form" class="form-container col-md-9 col-lg-8 col-xs-12" role="form">
			<h2 style="padding:0;" class="col-md-12 col-lg-10 col-xs-12"><wicket:message key="password" /></h2>			
			<div wicket:id="pasword-disabled" class="alert alert-info">
					<span><wicket:message key="password-edition-disabled" /></span>
			</div>
			
			<div class="row">
			<div class="col-lg-12 col-xs-12 col-md-12">
				<p> <span wicket:id="last-time"></span>	</p>
			</div>
			</div>

			<div class="row">
			<div class="col-xs-12">
					<a style="margin-bottom: 15px; margin-top:5px; margin-bottom:30px;" wicket:id="changepassword-link" class="btn-link"><wicket:message key="changepassword" /> </a>
			</div>
			</div>
			
			<div class="row" wicket:id="passwords">
						<div class="col-xs-12 col-lg-6 col-md-6" wicket:id="password1" />
						<div class="col-xs-12 col-lg-6 col-md-6" wicket:id="password2" />
						<!-- a class="btn-link" wicket:id="view-text"><wicket:message key="text-hidden" /></a -->
			</div>	
			</form>

			<div class="button-container col-md-3 col-lg-3 col-xs-12" wicket:id="buttons"/>
	</div>
</wicket:panel>
