<wicket:panel>
	<div class="container-fluid">
		<div class="row" style="margin-bottom: 2em;">
			<div class="col-lg-4 col-md-4 col-xs-12" style="margin-bottom: 2em;">
				<form id="form" method="post" action="#" wicket:id="form" class="form-container">
					<div class="form-group col-md-12 col-xs-12" wicket:id="command" />
					<div class="form-group col-md-12 col-xs-12" wicket:id="parameters" />
					<div class="button-container">
						<div class="col-lg-12 col-xs-12 col-md-12">
							<button wicket:id="start-button" type="reset"
								class="btn btn-primary btn-sm">
								<wicket:message key="execute" />
							</button>
						</div>
					</div>
				</form>
			</div>
			<div wicket:id="status" class="col-lg-8 col-md-8 col-xs-12"	style="float: right; padding-left: 45px;" />
		</div>

	</div>
</wicket:panel>
