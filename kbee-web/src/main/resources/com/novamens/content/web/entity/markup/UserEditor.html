<wicket:panel>
	<div class="row standard-canvas">
	
		<form wicket:id="form" class="form-container col-md-10 col-lg-10 col-xs-12" role="form">
			
			<h2 style="padding:0;" class="col-md-12 col-lg-10 col-xs-12"> <wicket:message key="account" /></h2>
			
			<div wicket:id="account-disabled" class="alert alert-info">
					<span> <wicket:message key="account-disabled" /> </span>
			</div>
			<div class="row">
	 
				<div class="col-xs-12 col-lg-6 col-md-12 form-group" wicket:id="userName"/>
				<div class="col-xs-12 col-lg-6 col-md-12 form-group" wicket:id="domain"/>
			</div>
			
			<div class="row panel">
				<div class="col-xs-12 col-lg-6 col-md-12 form-group" wicket:id="locale"/>
				<div class="col-xs-12 col-lg-6 col-md-12 form-group" wicket:id="timezone"/>

				<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="startpage"/>
				<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="id"/>

				<!--  div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="isclient"/ -->
				<!-- div class="col-xs-12 col-lg-6 col-md-6 form-group" wicket:id="uitheme"/-->

				<div class="col-xs-12">
					<a style="margin-bottom: 15px; margin-top:5px; margin-bottom:30px;" wicket:id="changepassword-link" class="btn-md btn btn-default"> <wicket:message key="changepassword" /> </a>
				</div>

				<div class="row" wicket:id="passwords">
					<div style="margin: 0 30px 30px 30px; width:calc(100% - 60px); background:#f2f2f2; border-radius:6px; padding: 15px 0 15px 0; float:left;     border: 1px solid  #d8dcdf;">
						<div class="col-xs-12 col-lg-6 col-md-6" wicket:id="password1" />
						<div class="col-xs-12 col-lg-6 col-md-6" wicket:id="password2" />
					</div>		
				</div>	

			 	<div class="col-xs-12 col-lg-12 col-md-12 form-group">	
					<div class="row"> 
		 				<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="enabled"/>
		 				<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="usereditaccount"/>
		 				<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="userchangepassword"/>
						<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="usersendemail"/>
						<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="emailNotifications"/>
						<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="emailPendingNotifications"/>
						<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="emailRuleNotifications"/>
						<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="tipoftheday"/>					
					</div>
				</div>
 			</div>
		</form>
		<div class="button-container col-md-2 col-lg-2 col-xs-12" wicket:id="buttons"/>
	</div>
</wicket:panel>
