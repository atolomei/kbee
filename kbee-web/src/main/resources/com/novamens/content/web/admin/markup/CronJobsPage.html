
<?xml version="1.0" encoding="UTF-8"?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">

<body>
	
	<wicket:extend>
	
	<div class="auxpage kbee">
		
		<div class="header-container">
			<div class="header">	
					<div class="logo">
						<a href="/workspace" style="float: left;">
							<div class="isologo" style="float: left;">
								<img wicket:id="logo"></img>
							</div>
							<!-- span class="domain-name" wicket:id="domain"></span-->
						</a>
					</div>
			</div>
		</div>
	
	  <div wicket:id="canvas" class="mil24left">
		<div class="breadcrumb" wicket:id="breadcrumb" />
			<div class="content-panel">
				<div class="content-area">
					<div class="title">
						<h1><wicket:message key="system.status.title" /></h1>
					</div>
					<div class="text">
						<div style="float: left; width:49%; margin-right: 1%;">
							<div class="block">
								<h2><wicket:message key="system.status.section.application"/></h2>
								<ul>
									<li wicket:id="application-status"><span wicket:id="label" class="label"></span> <span class="value" 	wicket:id="value"></span></li>
								</ul>
							</div>

							<div class="block">
								<h2><wicket:message key="system.status.section.platform"/></h2>
								<ul>
									<li wicket:id="platform-status"><span wicket:id="label" class="label"></span> <span class="value" 	wicket:id="value"></span></li>
								</ul>
							</div>
						</div>

						<div style="float: left; width:49%;">
							<div class="block">
								<h2><wicket:message key="system.status.section.server"/></h2>
								<ul>
									<li wicket:id="system-status"><span wicket:id="label" class="label"></span> <span class="value" wicket:id="value"></span></li>
								</ul>
							</div>
						</div>
					</div>
					
					<div class="text" style="margin: 54px 0 32px 0; float: left;">
						<a href="/admin" class="button-nobck">Back </a>
					</div>
				</div>
			</div>
		</div>
		
		<div wicket:id="footer" class="kbee-content-footer" />
		
	</div>
	
	</wicket:extend>
</body>

</html>
