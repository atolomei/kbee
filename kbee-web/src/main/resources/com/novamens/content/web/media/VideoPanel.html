<wicket:panel>

 	<div wicket:id="media-panel" class="media-panel"  style="width: 100%; float:left;">
		<div class="video-viewer" style="width:100%; float:left;">
				<div wicket:id="player-container">
					<div id="myElement">Loading the player...</div>
					<div wicket:id="player" />
				</div>
		</div>
	 	<div class="video-description" style="width:100%; float:left; color: #cccccc; margin-top: 12px; font-size: 15px;">
				<div  wicket:id="metadata-container" style="float: left; width:100%;">
 						<div style="text-align: center;">
							<div wicket:id="description"></div>
						</div>
				</div>
		</div>
	</div>
</wicket:panel>
