<wicket:panel>
	<div class="row standard-canvas">
		<form wicket:id="form" class="form-container col-md-8 col-lg-8 col-xs-12" role="form">
				<div wicket:id="isapi" class="form-group alert alert-info" role="alert"> <wicket:message key="isapi" /></div>
				<div class="row panel">
					<div class="col-lg-12 col-xs-12 col-md-12">
						<div class="row">
							<h2 class="col-lg-12 col-xs-12 col-md-12"><wicket:message key="structure"/></h2>
							<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="name"/> 
							<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="type"/>
							<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="multiplicity"/>
							<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="alias"/>
						</div>	
					</div>
				</div>	

				<div class="row panel">
					<div class="col-lg-12 col-xs-12 col-md-12">
						<div class="row">
							<h2 class="col-lg-12 col-xs-12 col-md-12">IQL Predicate</h2>
									<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="predicate"/>
									<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="isRuleCondition"/>
						</div>	
					</div>
				</div>	

				<div class="row panel">
					<div class="col-lg-12 col-xs-12 col-md-12">
						<div class="row">
							<h2 class="col-lg-12 col-xs-12 col-md-12">Include in new Content Templates</h2>
									<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="isDefaultStructure"/>
						</div>	
					</div>
				</div>	

				<div class="row panel">
					<div class="col-lg-12 col-xs-12 col-md-12">
						<div class="row">
							<h2 class="col-lg-12 col-xs-12 col-md-12">Search Filter and Advanced Search forms</h2>
							<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="isFilterable"/>
							<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="isSearchable"/>
						</div>
					</div>
				</div>
				
				<div class="row panel" wicket:id="validator-panel">
					<div class="col-lg-12 col-xs-12 col-md-12">
						<div class="row">
							<h2 class="col-lg-12 col-xs-12 col-md-12">Validator</h2>
							<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="validatorType"/>
							<div wicket:id="validator"/>
						</div>
					</div>
				</div>
				
		</form>
		<div class="button-container col-md-4 col-xs-12 col-lg-4" wicket:id="buttons"/>
	</div>
</wicket:panel>

<wicket:fragment wicket:id="range-validator-fragment">
	<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="from"/>
	<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="to"/>
</wicket:fragment>
