<wicket:panel>

<div class="standard-canvas">
		<div class="row">
			<h2  class="col-md-12 col-lg-10 col-xs-12"><span wicket:id="title"></span></h2>
			<div class="button-container col-md-4 col-xs-12 col-lg-2" wicket:id="buttons"/>
		</div>


	
		
	<form wicket:id="form"  class="form-container" style="padding:15px 0 0 0; margin:0;" role="form">
			
			<section wicket:id="section" style="border:1px solid #d8dcdf; border-radius:4px; padding:15px; margin-bottom:1px;">
				<div class="row">
					<div class="col-lg-12">
						<h3 style="float:left;"><span wicket:id="section-name"></span></h3>
						<div style="float: right; cursor: pointer;  margin-top: 0px; position: relative;   padding-bottom: 0px;">
							<a id="dmenu" data-toggle="dropdown" wicket:id="menulink"><i class="far fa-ellipsis-h" aria-hidden="true"></i></a>
							<ul wicket:id="menu" class="dropdown-menu dropdown-menu-right" aria-labelledby="dmenu" />
						</div>
					</div>
				</div>
				
				<div class="row" wicket:id="editor"/>
			</section>
	</form>
		
		
	<div class="row">
		<div class="col-lg-12 col-xs-12 col-md-12  mt20 mb40">
			<a style="float:right" class="btn btn-default btn-sm" wicket:id="new-section"><span>Add Section</span></a>
		</div>
	</div>
</div>	
		


</wicket:panel>
