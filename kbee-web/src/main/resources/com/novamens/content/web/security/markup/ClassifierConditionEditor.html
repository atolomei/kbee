<wicket:panel>
	<label wicket:id="classifier" class="control-label" for="member"></label>
	<ul class="list-group col-lg-12 col-md-12 col-xs-12">
		<li class="list-group-item" wicket:id="members">
			<span class="list-group-item-heading" wicket:id="member"></span>
			<a><i class="far fa-times" style="float:right;cursor:pointer;" title="remove" alt="remove" wicket:id="remove-link"></i></a>
		</li>
		<li class="list-group-item selector" wicket:id="selector-panel">
			<div class="form-vertical">
				<div class="form-group" wicket:id="member" />
			</div>
		</li>
		<li class="list-group-item" wicket:id="empty-panel">
			<div style="display: block; height: 20px;"/>
		</li>
	</ul>
</wicket:panel>
