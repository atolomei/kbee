<wicket:panel>
	
	
		<div class="col-lg-12 col-xs-12 col-md-12" style="margin:15px 0;">
			<div wicket:id ="breadcrumb"></div>
		</div>
	
		<div class="col-lg-12 col-md-12 col-xs-12" >
			<h2><wicket:message key="site-editor"/></h2>
			<form wicket:id="form" style="margin-bottom:0;" class="form-container" role="form">
				<div class="row">
					<div class="panel" style="width:100%; float:left;">
						<!-- h2 class=" col-md-12 col-lg-12 col-xs-12"><wicket:message key="general" /></h2-->
						<div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="title"/>
						<div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="uri"/>
						<!-- div class="col-xs-12 form-group" wicket:id="classifier"/-->
						<div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="state"/>
						
						<div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="alias"/>
						<div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="description"/>
						<div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="id"/>
					</div>
				</div>
			</form>
		</div>
		
		<div class="button-container col-md-12 col-lg-12 col-xs-12" wicket:id="buttons"/>
	
	
		
</wicket:panel>
