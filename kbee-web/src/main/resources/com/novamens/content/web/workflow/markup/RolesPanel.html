<wicket:panel>

	<table style="width:100%;" class="task-info">
		<tbody>
			<tr class="form-group" wicket:id="roles">
				<td class="label" wicket:id="role">Task</td>
				<td>
					<ul>
						<li wicket:id="user">
							<span wicket:id="name">[name]</span>
						</li>	
						<li wicket:id="provided-user">
							<span wicket:id="name">[name]</span>
							<span class="ago" wicket:id="legend">[]</span>
						</li>
						<li wicket:id="provided-group">
							<a wicket:id="link" target="_blank"><span wicket:id="name">[name]</span></a>
							<span class="ago" wicket:id="legend">[]</span>
						</li>
					</ul>
				</td>
			</tr>
		</tbody>
	</table>

</wicket:panel>
