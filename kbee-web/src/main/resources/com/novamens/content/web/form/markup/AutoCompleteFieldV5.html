

<wicket:panel>

<div class="suggester-field">
	<div class="control-label" wicket:id="label-container">
		<label for="label" wicket:id="label"></label>
			<i wicket:id="mandatory" class="mandatory fas fa-asterisk" title="field is required" >
		</i>
	</div>

	<div class="col-lg-10" wicket:id="horizontal-layout">
		<wicket:container class="suggester-control" wicket:id="control"/>
	</div>
	
	<wicket:container class="suggester-control" wicket:id="control"/>
</div>
	
</wicket:panel>



<wicket:fragment wicket:id="control-fragment">
	
	<div class="input-group suggester-container" wicket:id="th">
		<input type="text" class="form-control typeahead" wicket:id="input"/>
		<div class="input-group-btn">
			<button wicket:id="searcher" type="button" class="btn btn-default" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">&nbsp;<i class="far fa-search"></i></button>
		</div>
	</div>	
	<wicket:container wicket:id="feedback">
		<div style="float:left; width:100%; padding:4px 0 6px 0; position:relative;" class="suggester col-xs-12">		
			<a>
				<span wicket:id="icon" class="far fa-times form-control-feedback"></span>
			</a>
			<span class="alert-danger" wicket:id="error"></span>
		</div>			
	</wicket:container>
	<div wicket:id="history" class="help-block"/>
	
</wicket:fragment>

<wicket:fragment wicket:id="history-fragment">
	<wicket:container wicket:id="history">
		<span wicket:id="separator" class="separator" />
		<a class="text-info" wicket:id="link">
			<span wicket:id="name" class="name"/>
		</a>
	</wicket:container>
</wicket:fragment>
