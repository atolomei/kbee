<wicket:head>

<style>
	.kbee .close {
		font-size: 11px !important;
		color: #0d5072;
		border: 1px solid #0d5072;
		border-radius: 4px;
		padding: 1px 2px;
		float: left;
		margin-top: 6px;
		margin-right: 6px;
		font-weight: normal;
		text-shadow: none;
		filter: none;
		opacity: 1;
	}
</style>

</wicket:head>
<wicket:panel>

	<div class="container-fluid" style="padding:0;">
		<div class="row">
					<div class="panel col-lg-6 col-md-8 col-xs-12">
						<h2> <wicket:message key="howitworkstitle" /></h2>
							<div style="float:left;">
									<wicket:message key="howitworks" />
							</div>
				</div>
		</div>

		<div class="row">
			<form id="classifyform" method="post" action="#" wicket:id="form" class="form-container col-lg-12">
				<div class="row" wicket:id="feedback-panel">
						<div class="col-lg-12 panel alert alert-info" wicket:id="feedback"/>
				</div>
				<div class="row">
						<h2 class="col-lg-12 col-xs-12 col-md-12"><wicket:message key="classifiers" /></h2>
						<ul class="form-group" style="width:100%;">
							<li class="component col-lg-4 col-md-4 col-xs-12 grid3"  wicket:id="classification">
								<div wicket:id="members"/>
							</li>
						</ul>
				</div>
				<div class="row">					
					<div class="panel">
						<h2 class="col-lg-12 col-xs-12 col-md-12"> <wicket:message key="actions" /> </h2>
						<div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="buttons"/>
					</div>
				</div>
				
				 
					
				<div wicket:id="selection"></div>
				
			</form>
		</div>
	</div>
	
</wicket:panel>
