<wicket:panel>

		<nav wicket:id="add-container" class="navbar">
			<div id="navbar" class="col-lg-12 col-xs-12 col-md-12 toleft toright">
				<a class="btn btn-default btn-sm" wicket:id="add" style="margin-left: 0px; margin-right: 6px; float:left;">
					<div style="float:left;	position: relative; left:50%; transform:translateX(-50%);">
						<span style="float:left;" wicket:id="edit"></span>
					</div>
				</a>
			</div>
		</nav>
		
		<div wicket:id="container-text" class="row" style="margin:0 -15px;">
			<div class="col-lg-9 col-md-11 col-xs-12 text-block" style="margin:0; max-width: 980px;  margin-top: 24px;" wicket:id="xcontent-text"></div>
		</div>							

		<div wicket:id="container-editor" class="row">
			
			<div class="col-lg-12 col-md-12 col-xs-12"  style="padding:24px; margin-bottom:24px; background: #e4e6e7;">
					<div class="row">
						<div class="col-lg-12 form-group text-block" wicket:id="ztext-editor" style="margin-bottom:0;"/>
					</div>
					<div class="row">
						<div class="col-lg-12 form-group text-block" style="padding-top:24px; margin-bottom:0;">
							<a  wicket:id="cancel-link" class="btn btn-xs btn-default">
								<span><wicket:message key="cancel"/></span>
							</a>
							<a wicket:id="save-link" class="btn btn-xs btn-primary">
								<span> <wicket:message key="save" /></span>
							</a>
						</div>
					</div>
			</div>
		</div>
		
</wicket:panel>
