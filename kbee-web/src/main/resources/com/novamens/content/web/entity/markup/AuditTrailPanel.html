<wicket:head>
	<style>
		.audittrial td { text-align: center; };
	</style>
</wicket:head>

<wicket:panel>

	 	<div class="audittrail" wicket:id="audittrail-container" style="background: white; overflow-x: hidden; overflow-y: hidden; width: auto; float: none; border: none; min-height: 400px;">
			<table style="width:100%;" wicket:id="events"/>
		</div>
		
		<a class="close-window-button" wicket:id="close">
			<span class="close-button"><wicket:message key="close" /></span>
		</a>
</wicket:panel>
