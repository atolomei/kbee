<wicket:panel>
	<wicket:extend>
		<form wicket:id="form" class="task-form">
			<section id="left-panel" wicket:id="left-panel" class="left-panel   col-md-8 col-lg-9 col-xs-12">
				<div class="col-lg-12 toleft toright" >
					<div wicket:id="title-panel" class="col-lg-12 col-md-12 col-xs-12" style="padding:0; float:left;"/>
				
				</div>
				<div style="float:left; width:100%;">
					<div wicket:id="tabs" class="tabs"/>
				</div>
			</section>
			<section class="col-lg-3 col-md-4 col-xs-12 right-panel" wicket:id="right-panel">
				<div wicket:id="workflow-info" class="workflow-context"/>
			</section>
		</form>
		<div wicket:id="error-dialog" class="modal window" tabindex="-1" role="dialog"/>
	</wicket:extend>

</wicket:panel>
