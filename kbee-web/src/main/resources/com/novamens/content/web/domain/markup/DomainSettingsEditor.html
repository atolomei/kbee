<wicket:panel>
	<div class="row standard-canvas">
		<form wicket:id="form"  class="col-md-9 col-lg-8 col-xs-12 form-container" role="form">
			<fieldset>
				<legend> <wicket:message key="organization" /> </legend>
				<div class="row panel">
					<div class="col-md-12 col-lg-12 col-xs-12 form-group" wicket:id="organization"/>
					<div class="col-md-12 col-lg-12 col-xs-12 form-group" wicket:id="type"/>
					
					<div class="col-md-12 col-lg-12 col-xs-12 form-group" wicket:id="timezone"/>
					<div class="col-md-12 col-lg-12 col-xs-12 form-group" wicket:id="locale"/>
					
					<div class="col-md-12 col-lg-12 col-xs-12 form-group" wicket:id="defaultpassword"/>
					
					<div class="col-md-12 col-lg-12 col-xs-12 form-group" wicket:id="website"/>
					<div class="col-md-12 col-lg-12 col-xs-12 form-group" wicket:id="description"/>
					
					<div wicket:id="logoc" class="col-md-12 col-lg-12 col-xs-12 form-group">	
						<div class="form-group" wicket:id="logo"/>
						<div wicket:id="image-container" style="border: 1px solid  #d8dcdf; float:left; margin:-27px 0 0 0; width:100%; background: #fcfcfc; border-radius:0 0 4px 4px;">
								<img wicket:id="imglogo" style="padding:20px; max-height:200px;"/>
						</div>
					</div>
				</div>

				<div class="row panel" wicket:id="eidcontainer">
					<div class="col-lg-12 col-xs-12 col-md-12">
						<legend> <wicket:message key="api-storage"/></legend>
					</div>
					<div class="col-md-12 col-lg-12 col-xs-12 form-group" wicket:id="storageType"/>
					<div class="col-md-12 col-lg-12 col-xs-12 form-group" wicket:id="externalId"/>
					<div class="col-md-12 col-lg-12 col-xs-12 form-group" wicket:id="encryptFiles"/>
				</div>
				
				<div class="row panel" wicket:id="portals-container">
					<div class="col-lg-12 col-xs-12 col-md-12">
						<legend> <wicket:message key="portals"/></legend>
					</div>
					<div class="col-md-12 col-lg-12 col-xs-12 form-group" wicket:id="portalLibrary"/>
				</div>
			</fieldset>
			

			<!-- fieldset>
				<div class="row">
					<div class="col-md-12 col-lg-12 col-xs-12">
						<div class="row">
							<legend  class="col-md-12 col-lg-12 col-xs-12"><wicket:message key="other"/> </legend>
							<div class="col-md-6 col-lg-6 col-xs-12 form-group" wicket:id="consolesPersistLabels"/>
							<div class="col-md-6 col-lg-6 col-xs-12 form-group" wicket:id="globaltipoftheday"/>
							<div class="col-md-6 col-lg-6 col-xs-12 form-group" wicket:id="portal"/>
						</div>
					</div>
				</div>
			</fieldset-->
			
		</form>
		<div class="button-container col-md-3 col-lg-3 col-xs-12" wicket:id="buttons"/>
	</div>
	
	<div wicket:id="help-modal" class="modal window" z-index=999999 tabindex="-6" role="dialog"/>
		
</wicket:panel>
