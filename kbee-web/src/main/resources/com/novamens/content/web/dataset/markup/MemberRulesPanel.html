<wicket:panel>

<div class="row standard-canvas">
	<div class="col-lg-12 col-md-12 col-xs-12">	
		<h2 style="padding:0;" class="col-md-12 col-lg-12 col-xs-12">Rules</h2>
		<div class="alert alert-info" role="alert"><wicket:message key="readonly" /></div>
		<div class="row" style="margin:0;">
			<ul class="list-group col-lg-12 col-md-12 col-xs-12">
				<li class="list-group-item" wicket:id="rules">
					<a wicket:id="rule-link" target="_blank"><span class="list-group-item-heading" wicket:id="rule-label"></span></a>
				</li>
			</ul>
		</div>
		<div wicket:id="emptypanel" class="row">
			<div class="col-lg-12 col-xs-12">
				<p><wicket:message key="norules" /></p>
			</div>
		</div>
	</div>
</div>
	
</wicket:panel>
