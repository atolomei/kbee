
<wicket:panel>
	<div wicket:id="main-area" class="gallery-body" style="float: left; overflow: hidden;">
				<div wicket:id="resource-list-container" style="float: left; width: 100%; margin:0; overflow: hidden;">	
 					<ul id="resources" class="resources">
 						<li wicket:id="file" class="file">
								<div class="thumbnail-large" wicket:id="thumbnail">
									<div class="link">
										<a href="#" wicket:id="file-link" class="thumbnail-link" style="float: left; min-width: 180px; max-width: 100%; height:35vh; background:#333333;">
											<img wicket:id="file-thumbnail" 	style="height: auto;    width: auto;    max-height: 35vh;  max-width: 100%; transform: translate(-50%, -50%);    left: 50%;    position: relative;    top: 50%;" />
										</a>
									</div>
								</div>
							</li>
						</ul>			
				</div>
		</div>
</wicket:panel>
