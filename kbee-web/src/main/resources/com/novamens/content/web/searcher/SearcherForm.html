<wicket:panel>


	<form wicket:id="searchform" class="search navbar-form navbar-left">
			<div class="col-lg-12 col-xs-12 col-md-12" style="width: 100%; margin: auto; float: none; padding:0; max-width:760px;">
				<div class="input-group search-field">
					<div wicket:id="text" class="searcher"/>
					<div class="input-group-btn">
						<button wicket:id="search" type="button" class="btn btn-default dropdown-toggle"><span class="far fa-search"></span></button>
					</div>
				</div>
				<a wicket:id="advanced" style="max-width: 760px;  float: right;  margin: 6px 52px;   color: white;   font-size: 13px;   text-decoration: underline;"> <span wicket:id="slabel" /></a>
			</div>
	</form>
</wicket:panel>
