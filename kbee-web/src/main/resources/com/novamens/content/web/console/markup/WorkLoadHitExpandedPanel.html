
<wicket:head>
	<style type="text/css">
		.kbee .browser .expanded .col .row {margin-left: -15px; margin-right: -15px;}
	</style>
</wicket:head>


<wicket:panel>

	<div class="row">
		<div class="panel col-lg-12" style="background: inherit">
			<div class="user-photo-container">
					<img wicket:id="photo" />
			</div>
			<div class="work-note">
					<div class="label-container">
						<a class= "btn-link" wicket:id="name-link" target="_blank">
							<span class="cell-label" wicket:id="name"></span>
						</a>
					</div>
					<div class="metadata">
						<span style="float:left;" wicket:id="username"></span>
						<span style="clear:left; float:left;" wicket:id="email">email</span>
					</div>
			</div>
		</div>
	</div>
	
	 
	
	<div wicket:id="due-dates" class="row">
		<div class=" col-lg-12 col-md-12 col-xs-12 panel" style="background: inherit; margin-left: 60px;">
			<div class="row">
				<h2 class=" col-lg-12 col-md-12 col-xs-12"><wicket:message key="due-dates" /></h2>
			</div>
			
			<div class="row">
				<div class=" col-lg-12 col-md-12 col-xs-12">
					<table style="width:100%;" class="task-info">
						<tbody>
							<tr class="form-group">
								<td wicket:id="total-label" class="label"></td>
								<td wicket:id="total-value" class="value"></td>
							</tr>
					
							<tr class="form-group">
								<td wicket:id="today-label" class="label"></td>
								<td wicket:id="today-value" class="value"></td>
							</tr>
							
							
							<tr class="form-group">
								<td wicket:id="pastdue-label" class="label"></td>
								<td wicket:id="pastdue-value" class="value"></td>
							</tr>
							
							<tr class="form-group">
								<td wicket:id="today1-label" class="label"></td>
								<td wicket:id="today1-value" class="value"></td>
							</tr>
		
							<tr class="form-group">
								<td wicket:id="today2-label" class="label"></td>
								<td wicket:id="today2-value" class="value"></td>
							</tr>
							
							<tr class="form-group">
								<td wicket:id="today3-label" class="label"></td>
								<td wicket:id="today3-value" class="value"></td>
							</tr>
							
							<tr class="form-group">
								<td wicket:id="today4ormore-label" class="label"></td>
								<td wicket:id="today4ormore-value" class="value"></td>
							</tr>
							
							<tr class="form-group">
								<td wicket:id="duenone-label" class="label"></td>
								<td wicket:id="duenone-value" class="value"></td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</div>
	
	
	
	<div wicket:id="task-types" class="row">
		<div class=" col-lg-12 col-md-12 col-xs-12 panel" style="background: inherit; margin-left: 60px;">
			<div class="row">
				<h2 class=" col-lg-12 col-md-12 col-xs-12"><wicket:message key="task-types" /></h2>
			</div>
			
			<div class="row">
				<div class=" col-lg-12 col-md-12 col-xs-12">
					<table style="width:100%;" class="task-info">
						<tbody>
							<tr wicket:id="task-types-list" class="form-group">
								<td wicket:id="label" class="label"></td>
								<td wicket:id="value" class="value"></td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>				
		</div>
	</div>
			
							
	
	 
	
	
</wicket:panel>
