<wicket:panel>

	<div class="console-page-header page-header">
		<div class="page-header-content">
			<h1>JVM Panel</h1>
			<div wicket:id="breadcrumb" />
		</div>
	</div>

	<div class="content">
		<div class="application-main stacked">
			<div class="tab-panel">
				
					 <div class="col-lg-12 col-xs-12 col-md-12" style="margin:15px 0 0 0;">
						 <span class="label">TOTAL:</span>
						 <span class="value" wicket:id="total"></span>
						 <a class="btn-default btn-sm btn" style="float:right" wicket:id="download">Download</a>
					</div>
				
				
				
					<div class="col-lg-12 col-xs-12 col-md-12">
						<span wicket:id="dump"></span>
					</div>
				
			</div>
		</div>
	</div>


</wicket:panel>
