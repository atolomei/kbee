<wicket:panel>

<div class="row standard-canvas">

	<div class="col-lg-8 col-md-8 col-xs-12">
	
		<h2  class="col-md-12 col-lg-10 col-xs-12" style="padding:0;">Alerts and Email</h2>
		<div wicket:id="disclaimer-basic" class="form-group alert alert-info" role="alert"><wicket:message key="disclaimer-basic" /></div>
		<div wicket:id="disclaimer-premium" class="form-group alert alert-info" role="alert"><wicket:message key="disclaimer-premium" /></div>
		
		
		<div class="row">
			<form wicket:id="form"  class="col-md-12 col-lg-12 col-xs-12 form-container" autocomplete="on" role="form">
				<fieldset>
					<div class="row">
						<div class="col-md-12 col-lg-12 col-xs-12 form-group" wicket:id="eMailServiceStatus"/>					
						<div class="col-md-12 col-lg-12 col-xs-12 form-group" wicket:id="eMailServiceNoReply"/>
					</div>	
				</fieldset>
			</form>
		</div>
		
	</div>			
	<div class="button-container col-md-4 col-lg-4 col-xs-12" wicket:id="buttons"/>
</div>
		
</wicket:panel>
