<wicket:panel>
	
	
 <div class="content-editor">
   <div class="working-area">
	  <div wicket:id="canvas" class="editor  entity">
				<div class="content-area">
					<div class="text">
								<div class="title-container" style="float:left; margin-bottom:2em; width:100%;">
									<h2 class="title">DataSet Batch Creation</h2>
								</div>
								
								<div style="width: 36%; float: left;" class="block">
									<form id="form" method="post" action="#" wicket:id="form" style="margin-top: 0px; float:left; width:100%;">
										<div class="field-block expanded first">
											<div class="title-block">
												<h3>Dataset</h3>
											</div>		
											<select wicket:id="datasets"  class="field-editor"></select>
										</div>

										<div class="field-block expanded">
											<div class="title-block">
												<h3 style="width:auto; float:left;">Elements</h3><span style="color: #777777; font-size: 0.95em; margin-left: 4px;" class="description">(One per line)</span>
											</div>
																						
											<textarea wicket:id="elements" rows="20" cols="54" style="line-height: 1.7em;"></textarea>
										</div>
										
										<div style="float: left; width: 100%;  margin-bottom: 32px;">
							 				<a wicket:id="submit-button"  href="#" class="form-submit-button">Submit</a>
							 				<a wicket:id="close-button"  href="#"   class="form-submit-button" style="margin-left: 8px;">Close</a>
										</div>
										<div wicket:id="feedback"></div>   
									</form>
								</div>
								
									<div wicket:id="status" style="width: 56%; float: right;" class="block">
										<h3>Status</h3>
										<div class="field-block first">
											<ul style="width:100%; float:left;">	
												<li wicket:id="status-container">
													<span class="label">Status.</span>   	<span class="value" wicket:id="status">Executing</span>
												</li>
												<li wicket:id="date-start-container">
													<span class="label">Started.</span>  	<span class="value" wicket:id="date-start">12 Oct 2012 (12 minutes ago)</span>
												</li>
												<li wicket:id="progress-container">
													<span class="label">Progress.</span><span class="value" wicket:id="progress">20%</span>
												</li>
												<li wicket:id="etc-container">
													<span class="label">Estimated time to complete.</span><span class="value" wicket:id="etc">23 secs</span>
												</li>
											</ul>
										</div>
										
										<div class="field-block expanded" wicket:id="command-result" style="float:left;">
											<ul style="width:100%; float:left;">	
												<li wicket:id="date-end-container" style="margin-top:24px;"><span class="label">Terminated.</span> <span class="value" wicket:id="date-end"></span></li>
												<li wicket:id="duration-container">
													<span class="label">Duration.</span> <span class="value" wicket:id="duration"></span></li>
												<li wicket:id="resultcomments-container"><span class="label">Comments.</span><span class="value" wicket:id="resultcomments"></span></li>
												<li wicket:id="result-container"><span class="label">Result.</span><span class="value" wicket:id="result"></span></li>
												<li wicket:id="result-details-container"><span class="label"  style="float:left; width:100%; margin-top:0;">Result details.</span><span class="text-value" wicket:id="result-details"></span></li>
											</ul>
										</div>
										<div style="float:left;">
											<a wicket:id="stop-link" class="highlight-button" style="float:left; margin-top:2em;"href="#" >Stop</a>
										</div>
								</div>
						</div>
				</div>
			</div>
		</div>
	</div>


</wicket:panel>
