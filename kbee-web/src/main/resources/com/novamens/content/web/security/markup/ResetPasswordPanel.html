<wicket:panel>
  <div class="modal-dialog">
	
	<div class="modal-dialog-body">
	
		<form wicket:id="reset-password-form" id="reset-password-form" method="post" action="#" >
			<div class="fields-container">
				<div class="field-block first">
			    	<div class="title-block">
			    		<label for="password" accesskey="t" tabindex="2" class="label">
				    			<wicket:message key="resetpassword.password"/>
				    	</label>
				    	<span class="label-description">
				    		<wicket:message key="resetpassword.password.explanation"/>
				    	</span>
		    		</div>
					<input wicket:id="password" type="password" class="field">
				</div>

				<div class="field-block">
					<div class="title-block">
						<label for="retype" accesskey="m" tabindex="7" style="font-weight:bold; width: 100%; float: left; margin-bottom: 3px;"><wicket:message key="resetpassword.retype"/></label>
					</div>
						<input wicket:id="retype-password" type="password" class="field">
				</div>
				<div style="width:100%; float: left;" wicket:id="feedback"></div>
			</div>

			<div class="buttons-container">
					<div style="float: left; width: 100%;">
							<div>
								<a wicket:id="ok-link" href="javascript:;" style="float: left;" class="form-submit-button">
									<wicket:message key="resetpassword.button.submit"/>
								</a>
							</div>
							<a class="form-submit-button atright" wicket:id="cancel-link" href="javascript:;">
								<wicket:message key="resetpassword.button.cancel"/>
							</a>
					</div>
			</div>
		</form>
	</div>	
  </div>	
		
</wicket:panel>
