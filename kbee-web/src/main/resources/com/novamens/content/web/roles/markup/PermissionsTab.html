<wicket:head>
	<style>
	.not-set 		{border-radius: 5px;    border: 1px solid  #d8dcdf;    width: 48px;    float: left;    margin: 0px calc(50% - 24px);	}
	.permission	 	{text-align:center;}
	.kbee  span.btn-link {color: #191a1b; font-style: normal; text-decoration: none;}
	.kbee  span.btn-link em {font-style: normal;}
	
	</style>
</wicket:head>

<wicket:panel>
	<div style="padding:0;" class="table-responsive col-lg-12 col-md-12 col-xs-12" >
		<table wicket:id="rows" class="table table-striped table-bordered table-hover" style="margin-bottom: 10px; margin-top:0px;"/>
	</div>
	
	<div class="col-lg-12 col-md-12 col-xs-12">
	   <a wicket:id="template-link" target="_blank" style="float:left; margin-top:10px;" class="btn-link" href="#"> <span wicket:id="template">Open Content Template {0}</span></a>
	 </div>
	
</wicket:panel>

<wicket:fragment wicket:id="permissionFragment">
	<span style="text-aligin:center;">
		<a wicket:id="permission-link">
			<span wicket:id="value"></span>
		</a>
	</span>
</wicket:fragment>

<wicket:fragment wicket:id="deletelinkFragment">
	<a wicket:id="delete-link">
		<span class="far fa-times"></span>
	</a>
</wicket:fragment>
