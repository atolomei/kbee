<wicket:panel>
	
	<div class="cell-container title-cell">
		<div class="user-photo-container">
				<img wicket:id="photo" />
		</div>
		
		<div class="work-note">
				<div class="label-container">
					<span class="cell-label" wicket:id="name"></span>
				</div>
				<div class="metadata">
					<span wicket:id="user"></span><span class="ago" style="margin:0 4px;">-</span><span wicket:id="date"></span>
				</div>
				<div class="text">
					<span wicket:id="text"></span>
				</div>
		</div>
	</div>
</wicket:panel>
