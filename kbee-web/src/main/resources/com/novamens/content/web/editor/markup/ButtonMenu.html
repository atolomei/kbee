

<wicket:head>
	<meta charset="utf-8" />
	<style type="text/css">

#nav, #nav ul {
	padding: 0;
	margin: 0;
	list-style: none;
}

#nav a {
	display: block;
	width: 10em;
}

#nav li {
	float: left;
	width: 10em;
}


#nav li ul {
	position: absolute;
	width: 10em;
	left: -999em;
}

#nav li:hover ul {
	left: auto;
}


#tools ul {
	position: absolute;
	width: 14em;
	left: -999em;
	background: white;
	border: 1px solid #cccccc;
	box-shadow: 3px 3px 3px #999999;
	
}



	 	 	
</style>
