
<wicket:head>
	 
	<style type="text/css">
		.panel-feedback-panel	{ float: left; max-width: 500px; width: 100%; margin: 0; background:#ffdfb9; padding: 18px 10px 9px 18px; font-size: 1em; line-height: 22px; color:#000000; 
									border-radius: 0 0 6px 6px; width: 80%; margin-bottom: 8px; margin-top:0px; box-shadow: 7px 10px 18px 0px #E0E0E0 !important; margin-right: 20%;
									-moz-box-shadow: 7px 10px 18px 0px #E0E0E0 !important; min-width: 180px;
									-webkit-box-shadow: 7px 10px 18px 0px #E0E0E0 !important;
									border: 1px solid #cccccc;
			}
		.panel-feedback-panel a { padding: 2px 8px 2px 8px; float: right; border-radius: 4px; color:#222222; border: 1px solid #cccccc; }
		.panel-feedback-panel a:hover {background: #111111; color: white; border: 1px solid #cccccc; }
		
	</style>
</wicket:head>

<wicket:panel>
		<div wicket:id="panel-feedback" class="panel-feedback-panel">
			<div style="width: 100%; float: left;">
				<span style="margin-bottom:0;"wicket:id="msg"></span>
				<span style="color:#111111; float: right; margin-top: 0px; width: 100%; font-size: 14px; font-weight: normal;"><a class="button-nobck" style="float: right;" wicket:id="close">Close</a></span>
			</div>
		</div>
</wicket:panel>
