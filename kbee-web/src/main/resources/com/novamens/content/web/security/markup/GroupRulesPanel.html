<wicket:panel>

	<div class="row">
		<div class="col-lg-6 col-md-8 col-xs-12">
			<span class="col-lg-12 col-xs-12 alert alert-info" role="alert"><wicket:message key="readonly" /></span>
		</div>
	</div>
	

	<div class="row">
	   <div class="col-lg-6 col-md-8 col-xs-12 form-group">
			<ul class="list-group" style="width:100%">
				<li class="list-group-item" wicket:id="rules">
					<a wicket:id = "rule-link" class="btn-link">
						<span class="list-group-item-heading" wicket:id="rule"></span>
					</a>
				</li>
			</ul>
		</div>
	</div>
		
	
</wicket:panel>
