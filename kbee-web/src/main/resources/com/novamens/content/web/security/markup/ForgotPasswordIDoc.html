<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">

<body>

<wicket:extend>
	
<div class="viewport">

    <div class="page signin">
        <header>
            <a class="logo" href="http://www.realpage.com">
                <img wicket:id= "logo-realpage" alt="logo" />
            </a>
            <div class="select-menu large align-right" ng-class="selectMenu.state">
                <p class="link" ng-click="selectMenu.toggle($event)">
                    Support
                </p>
                <ul>
                    <li><a href="http://www.realpage.com" target="_blank">OneSite FAQ's</a></li>
                    <li><a href="http://www.realpage.com" target="_blank">RealPageID</a></li>
                    <li><a href="http://www.realpage.com" target="_blank">Support Form</a></li>
                    <li><a href="http://www.realpage.com" target="_blank">Support Services</a></li>
                </ul>
            </div>
        </header>

        <div class="content">
            <div class="login-form" style="margin-left: 23%; width: 54%; margin-right:0; padding:0;">
                <h2 style="padding-top: 3em;"> <wicket:message key="forgotpassword.title"/></h2>

				<div style="float: left; margin-top: 6px;">
					<div class="text">
						<p><wicket:message key="forgotpassword.instructions" /></p>
					</div>
				
					<form id="formulario" class="login" method="post" action="#" wicket:id="form" style="margin-top: 12px;">
						
						<fieldset style="border: none;">
							
					       <div class="form-input large">
	                    			<input type="text" wicket:id="username"  name="j_username" class="input-text" placeholder="User Name" tabindex="1"></input>
	                    			<!-- span class="placeholder"><wicket:message key="forgotpassword.label.user"/></span-->
	                		</div>
							
							<div id="password" class="form-input large">
								<input class="input-text" type="text" wicket:id="email" placeholder="Email Address" tabindex="2"></input>
                    			<!-- span class="placeholder"><wicket:message key="forgotpassword.label.email"/></span-->
							</div>
	
							<div class="panel">
								<span wicket:id="feedback" style="font-size: 18px;"></span>
							</div>

							<div class="login" style="margin-top: 12px;">
								<div class="label">
									<a class="forgot-pass" href="/login"><wicket:message key="forgotpassword.backtologin"/></a>
								</div>
							</div>
	
							<div id="submit" class="field" style="float: right;">
							 	<div class="label">
									<input wicket:id="submit" value="Enviar" type="submit" class="button" tabindex="3"></input>
								</div>
							</div>
							
							</fieldset>
					</form>
					
				</div>
            </div>
        </div>

        <footer>
            <p class="copyright">&copy;<span wicket:id="year" /> RealPage, Inc. All trademarks are the properties of their respective owners.</p>
        </footer>
    </div>

</div>
		
	</wicket:extend>
</body>
</html>
