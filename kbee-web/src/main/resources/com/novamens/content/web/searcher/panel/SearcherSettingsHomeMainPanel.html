<wicket:panel>


	<div wicket:id="image-container" class="media-left">
		<a class="resource" wicket:id="image-link" data-toggle="tooltip" data-placement="right">
			<img wicket:id="image" class="media-object" />
			<img class="player" style="position: absolute;"  wicket:id="player" />
			<span wicket:id="glyphicon" />
		</a>
	</div>
	
	<div class="media-body" wicket:id="body">
								
		<a class="btn-link" style="text-decoration:none; color: #191a1b;" wicket:id="title-link">
			<h4 class="media-heading" wicket:id="resource-title"></h4>
		</a>
		
		<div>
			<div wicket:id="resource-description" style="white-space: initial; float:left;line-height: 1.7em; width:96%;max-width:1200px;"></div>
			<div wicket:id="url"  style="white-space:initial; float:left; width:100%; line-height:1.5em;"></div>
		</div>
		
		<div>									
			<div wicket:id="resource-lastmodified-by" style="width:96%; max-width:1200px;" class="metadata">Edited by Alejandro Tolomei on 26 Sept. 2017 at 12:15</div>
			<div wicket:id="resource-uploaded"   	 style="width:96%; max-width:1200px;" class="metadata"></div>
		</div>
	</div>
		
</wicket:panel>
