<wicket:panel>
	<div class="row">
		<form wicket:id="form" id="actionsform" method="post" action="#" class="panel col-lg-12">
			<h2> <wicket:message key="action" /></h2>		
			<button wicket:id="button-abort" class="btn btn-sm btn-default"><wicket:message key="abort"/></button>
			<button wicket:id="button" class="btn btn-sm btn-primary"><span wicket:id="execute-label" /></button>
		</form>
	</div>
	<div class="panel col-lg-12 alert alert-info" wicket:id="feedback"/>
	
	<div class="row">
		<div class="col-lg-12 panel">
			<div wicket:id="selection" />
		</div>
	</div>
</wicket:panel>
