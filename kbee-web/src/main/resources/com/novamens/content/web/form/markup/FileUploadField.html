<wicket:panel>

	<div class="field fileupload-field">
	  	
	  	<div class="control-label col-lg-2">
			<label wicket:id="label" for="label"></label>
		</div>
		
		<div class="col-lg-10" wicket:id="horizontal-layout">
			<wicket:container wicket:id="control"/>
		</div>
		<wicket:container wicket:id="control"/>
	</div>
	
</wicket:panel>

<wicket:fragment wicket:id="control-fragment">
	<div class="file-input">
		<div class="input-group">
			<div wicket:id="input" tabindex="500" class="form-control file-caption kv-fileinput-caption">
				<div wicket:id="file" class="file-caption-name"><span style="padding-left:3px;" id="file-name" wicket:id="file-name">[photo.jpg]</span></div>
			</div>
			<div  class="input-group-btn">
				<button wicket:id="pickfiles" id="pickfiles" type="button" class="btn btn-default" style="height: 40px; border-bottom-right-radius: 4px;border-top-right-radius: 4px; opacity: 0.55;"><i class="fad fa-cloud-upload-alt" aria-hidden="true"></i></button>
			</div>
		</div>
		<div id="upload-progress" class="kv-upload-progress hide" style="margin-top:5px;">
			<div class="progress">
				<div id="progress-bar" class="progress-bar progress-bar-success progress-bar-striped active" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" style="width:0%;">
					0%
				</div>
			</div>
		</div>
	</div>
</wicket:fragment>
