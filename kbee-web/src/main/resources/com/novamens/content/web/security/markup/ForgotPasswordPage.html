<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<body>
	<wicket:extend>
		<div wicket:id="canvas">		
			<div class="forgot-canvas">
					<div style="line-height: 1.6em; float: left; text-align: center;  font-size: 1em; margin-bottom: 24px;">
						<div class="logo-container" wicket:id="logo-container">
							<img class="logo" wicket:id="logo"></img>
						</div>
						<span style="float:left; width: 100%; font-size: 1.2em; text-transform: uppercase; color: #666666; margin-top: 20px; margin-bottom: 24px; font-weight:500;"> <wicket:message key="forgotpassword.title"/></span>
						<p wicket:id="forgotpassword-instructions" style="margin-bottom: 0; line-height: 1.75em; color:#333333;"></p>
					</div>
					
					<div style="float:left; width:100%; font-size: 1em;">
						
						<form id="formulario"  method="post" action="#" wicket:id="form" >
					
								<fieldset style="border: none; margin-bottom:5px;">
										<div style="text-align: center; margin:25px 0; "  class="col-xs-12">
												<a href="/forgotusername" target="_blank"><wicket:message key="forgotusername"/></a>
						  				</div>
						  				
										<div style="text-align:center;" class="col-xs-12 form-group">
											<label style="font-weight:bold;" class="label" for="username"><wicket:message key="forgotpassword.label.user"/></label>
											<input style="text-align: center;" class="form-control"  wicket:id="username" placeholder="username" tabindex="1"></input>
										</div>
										
										<div style="text-align:center;" id="password" class="col-xs-12 form-group">
											<label style="font-weight:bold;" class="label" for="email"><wicket:message key="forgotpassword.label.email"/></label>
											<input style="text-align: center;" class="form-control" type="text" wicket:id="email" placeholder="email address" tabindex="2"></input>
										</div>
										<div style="text-align:center;" wicket:id="feedback" class="col-xs-12 form-group" />
										<div  style="text-align: center;" class="col-xs-12 form-group">
											<input wicket:id="submit" class="btn btn-primary btn-lg login loginmodal-submit" type="submit" name="login"  value="Send" />
										</div>
								</fieldset>
						</form>
													
						<div style="text-align: center;" class="col-xs-12 form-group">
								<a href="/login"><wicket:message key="forgotpassword.backtologin"/></a>
						</div>						  	
					</div>
			</div>
		</div>
		
	</wicket:extend>
</body>
</html>
