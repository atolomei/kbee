<wicket:panel>
	<form wicket:id="searchform" style="float:left;" class="search suggester-container">
		<div class="input-group">
			<input wicket:id="text" id="searcher" type="text" data-action="grow" class="form-control"/>
			<div class="input-group-btn">
				<button wicket:id="search" type="button" class="btn btn-default dropdown-toggle"><i class="far fa-search"></i></button>
			</div>
		</div>
	</form>
	<a wicket:id="clear-all" href="#" class="btn btn-link" style="float: left; border-color:transparent; margin: 10px 0; font-size: 12px;" > <wicket:message key="clear-all"/></a>
	<wicket:container wicket:id="advancedsearch" />
</wicket:panel>
