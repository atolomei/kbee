<wicket:panel>
		<div class="row standard-canvas">
			<form wicket:id="form" class="form-container col-md-12 col-lg-10 col-xs-12" role="form">
				<h2 style="padding:0;" class="col-md-12 col-lg-12 col-xs-12"> <wicket:message key="column-in-grids"/></h2>
				<div wicket:id="info-alert" class="form-group alert alert-info" role="alert"> <span wicket:id = "info" /></div>
				<div class="row panel">
						<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="visibility"/>
						<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="isDefaultGridColumn"/>
						<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="ordered"/>
				</div>
			</form>

			<div class="button-container col-md-12 col-xs-12 col-lg-2" wicket:id="buttons"/>
		
	</div>
		
</wicket:panel>
