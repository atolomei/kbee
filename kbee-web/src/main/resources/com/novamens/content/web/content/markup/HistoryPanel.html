<wicket:panel>

	<div style="margin-top: 0px;" wicket:id="history-container" >
		<nav wicket:id="navigation" class="col-lg-12 col-md-12 col-xs-12" />
		<div wicket:id="table-container" class="table-responsive table-header-bck" style="clear:left; height: inherit; overflow: auto; max-height: 680px; overflow: auto;">
			<table style="float: left;" wicket:id="history" class="table table-bordered  table-hover"/>
		</div>
	</div>
</wicket:panel>



<wicket:fragment wicket:id="date-fragment">

		<div style="float:left; width:100%; line-height:1.7em;">

			<a wicket:id="title-link" class="btn-link" target="_blank" style="clear:left; float:left;">
				<span wicket:id="title"/>
			</a>
			<div style="float:left; clear:left;" wicket:id="subtitle"/>
			<div wicket:id="vigent" style="float:left;color:#cc0000;  clear:left;"> <wicket:message key="vigent" /></div>
			
			
			
		</div>
</wicket:fragment>


<wicket:fragment wicket:id="title-fragment">
	<a style="text-align: right; padding:0 20px; float:left; text-align:center;" wicket:id="title-link" class="btn-link" target="_blank"> 
		<span wicket:id="version" style="padding-left: 4px; padding-right: 4px;"/>
	</a>
</wicket:fragment>


<wicket:fragment wicket:id="user-fragment">
	<div style="float:left; width:100%;">
		<span wicket:id="username" style="line-height: 1.7em;  float:left; clear:left; line-height: 1.7em;"/>
		<span wicket:id="date" style="line-height: 1.7em;  float:left; clear:left;  line-height: 1.7em;"/>
	 </div>
</wicket:fragment>
