<wicket:panel>

	<div class="row">
		<div class="row col-md-8 col-lg-6 col-xs-12">
			<form wicket:id="form" class="form-container" role="form">
				<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="status"/>
			</form>
		</div>
	</div>

	<div wicket:id="commands-container" style="margin-bottom: 64px; float:left; width:100%;">
		<av icket:id="navigation" />
		<div wicket:id="table-container" class="row panel" style="clear:left; height: inherit; overflow: auto;">
			<div class="table-responsive col-lg-12 col-md-12 col-xs-12">
				<table wicket:id="commands" class="table table-striped table-bordered table-hover"/>
			</div>
		</div>
	</div>	
	
</wicket:panel>
