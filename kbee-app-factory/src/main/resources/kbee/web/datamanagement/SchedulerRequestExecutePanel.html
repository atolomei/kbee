<wicket:panel>
			<form wicket:id="form" class="form-container standard-canvas" role="form">
				<fieldset style="margin:0;">
					<div class="row">
						<div class="panel" style="width: 100%; float: left; margin-bottom:0px;">
								<div class="col-md-2 col-lg-2 col-xs-12  button-container" wicket:id="buttons"/>
								<h2 class=" col-md-10 col-lg-10 col-xs-10"><wicket:message key="execute-request" /></h2>
								<div class="col-lg-8 col-md-10 col-xs-12" style="padding:0;">
									<div class="col-md-12 col-lg-12 col-xs-12 form-group"	wicket:id="sv_model" />
									<div class="col-md-12 col-lg-12 col-xs-12 form-group"	wicket:id="parameters" />
								</div>
							</div>
						</div>
						<div class="row">
							<div  class ="col-lg-10 col-md-12 col-xs-12 form-command-status" wicket:id="command-status" />
																
							<div  class ="form-group  col-lg-10 col-md-12 col-xs-12"><span wicket:id="sent"/></div> 
							
							<div  class ="form-group col-lg-10 col-md-12 col-xs-12"><a class="btn-link" href="/datamanagement/scheduler">Scheduler</a></div>
										
						</div>
					</fieldset>
					
			</form>
			
			<div wicket:id="help-modal" class="modal window" z-index=999999 tabindex="-6" role="dialog"/>

</wicket:panel>
