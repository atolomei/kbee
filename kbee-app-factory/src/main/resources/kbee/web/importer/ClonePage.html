<?xml version="1.0" encoding="UTF-8"?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="es" lang="es">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<title>Migration</title>
</head>

<body class="body">
	<wicket:extend>
		<div class="container-fluid">
			<div class="canvas" wicket:id="form-panel">
				<div class="row">
					<form wicket:id="form" class="form-container col-md-9 col-lg-7 col-xs-12" role="form">
					
						<div class="row">
							<div class="col-xs-12 col-lg-4 col-md-4 form-group" wicket:id="location"/>
						</div>
						
						<div wicket:id="local">
							<div class="row">
								<div class="col-xs-12 col-lg-4 col-md-4 form-group" wicket:id="domain"/>
							</div>
						</div>
						
						<div wicket:id="remote">
							<div class="row">
								<div class="col-xs-12 col-lg-4 col-md-4 form-group" wicket:id="remote"/>
							</div>
							<div class="row">
								<div class="col-xs-12 col-lg-4 col-md-4 form-group" wicket:id="user"/>
							</div>
							<div class="row">
								<div class="col-xs-12 col-lg-4 col-md-4 form-group" wicket:id="password"/>
							</div>
						</div>
						
						<div class="row">
							<div class="col-xs-12 col-lg-4 col-md-4 form-group" wicket:id="groups"/>
						</div>
						<!-- 
						<div class="row">
							<div class="col-xs-12 col-lg-4 col-md-4 form-group" wicket:id="users"/>
						</div>
						-->
						<div class="row">
							<div class="col-xs-12 col-lg-4 col-md-4 form-group" wicket:id="datasets"/>
						</div>
						<div class="row">
							<div class="col-xs-12 col-lg-4 col-md-4 form-group" wicket:id="classifiers"/>
						</div>
						<div class="row">
							<div class="col-xs-12 col-lg-4 col-md-4 form-group" wicket:id="attributes"/>
						</div>
						<div class="row">
							<div class="col-xs-12 col-lg-4 col-md-4 form-group" wicket:id="resourcetags"/>
						</div>
						<div class="row">
							<div class="col-xs-12 col-lg-4 col-md-4 form-group" wicket:id="launchergroups"/>
						</div>
						<div class="row">
							<div class="col-xs-12 col-lg-4 col-md-4 form-group" wicket:id="libraries"/>
						</div>
						<div class="row">
							<div class="col-xs-12 col-lg-4 col-md-4 form-group" wicket:id="values"/>
						</div>
						<div class="row">
							<div class="col-xs-12 col-lg-4 col-md-4 form-group" wicket:id="templates"/>
						</div>
						<div class="row">
							<div class="col-xs-12 col-lg-4 col-md-4 form-group" wicket:id="roles"/>
						</div>
						<div class="row">
							<div class="col-xs-12 col-lg-4 col-md-4 form-group" wicket:id="emailtemplates"/>
						</div>
						<div class="row">
							<div class="col-xs-12 col-lg-4 col-md-4 form-group" wicket:id="settings"/>
						</div>
						<div class="row">
							<div class="col-xs-12 col-lg-4 col-md-4 form-group" wicket:id="facets"/>
						</div>
						<div class="row" style="margin-top: 50px;">
							<div class="col-xs-12 col-lg-4 col-md-4 form-group" wicket:id="force"/>
						</div>
						
						<!-- 
						<div class="row">
							<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="files"/>
							<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="criteria"/>
							<div class="col-xs-12 col-lg-2 col-md-2 form-group" wicket:id="maxfiles"/>
						</div>
						-->
					</form>
					<div class="button-container col-md-3 col-lg-5 col-xs-12">
						<div class="col-lg-12 col-xs-12 col-md-12">
							<button wicket:id="start-button" type="reset" class="btn btn-default btn-lg">START</button>
						</div>
						<div class="col-lg-12 col-xs-12 col-md-12">
							<button wicket:id="cancel-button" type="reset" class="btn btn-danger btn-lg">CANCEL</button>
						</div>
					</div>
				</div>
				<div class="row">
					<div wicket:id="status">
						<div wicket:id="command"/>
					</div>
				</div>
			</div>
		</div>
	</wicket:extend>
</body>

</html>
