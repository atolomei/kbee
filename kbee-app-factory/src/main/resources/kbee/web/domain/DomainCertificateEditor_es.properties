certificate-info=Un <b>Certificado de Clave Pública</b> es un tipo de documento digital firmado por una entidad \
llamada Autoridad de Certificación que asocia una Clave Pública a unos datos que representan la identidad \
de una entidad (por ejemplo una persona física, organismo o empresa) que posee la <b>Clave Privada</b> asociada a \
dicha clave pública. De esta forma, cuando se usa la clave privada asociada a dicha clave pública se puede asegurar, \
atendiendo a la autoridad de la Autoridad de Certificación, que ha sido usada por la entidad asociada.<br/> <br/> \
Este panel sólo puede ser editado y consultado por el usuario root.
