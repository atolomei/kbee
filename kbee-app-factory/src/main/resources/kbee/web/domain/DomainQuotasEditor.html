<wicket:panel>
	<div class="row standard-canvas">
		<form wicket:id="form" class="col-md-6 col-lg-6 col-xs-12 form-container" autocomplete="on" role="form">
			<fieldset>
				<div class="row">
					<div class="col-md-12 col-lg-12 col-xs-12 form-group" wicket:id="quota"/>					
					<div class="col-md-12 col-lg-12 col-xs-12 form-group" wicket:id="maxUsers"/>
					<div class="col-md-12 col-lg-12 col-xs-12 form-group" wicket:id="template"/>
				</div>	
			</fieldset>
		</form>
		<div class="button-container col-md-3 col-lg-3 col-xs-12" wicket:id="buttons"/>
	</div>	
</wicket:panel>
