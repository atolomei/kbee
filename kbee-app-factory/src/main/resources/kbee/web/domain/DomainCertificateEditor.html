<wicket:panel>

	<div class="row standard-canvas">
		<div class="col-lg-12 col-md-12 col-xs-12">
												
			<h2 class="col-md-12 col-lg-10 col-xs-12" style="padding:0;"><wicket:message key="digital-certificate"/></h2>
			<div class="button-container col-md-3 col-lg-2 col-xs-12" wicket:id="buttons"/>
			
			<div class="row">
				<form wicket:id="form"  class="col-md-12 col-lg-10 col-xs-12 form-container" autocomplete="on" role="form">


					<div wicket:id="disclaimer" style="margin:0 0 15px 0; float:left; width:100%;" />
					
					<fieldset style="float:left; width:100%;">
						<div class="row">
							<div class="col-md-12 col-lg-12 col-xs-12 form-group" wicket:id="certificate"/>
							<div class="col-md-12 col-lg-12 col-xs-12 form-group" wicket:id="privateKey"/>					
						</div>	
					</fieldset>
				</form>
			</div>
		</div>			
		
	</div>
		
</wicket:panel>
