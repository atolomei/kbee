


<wicket:panel>	
	<div class="row">
		<h2 class="col-lg-12 col-xs-12 col-md-12"> <wicket:message key="title" /></h2>
		<ul class="col-lg-12 col-xs-12 col-md-12">	
			<li style="margin-bottom:0; padding-top:4px; padding-bottom:4px;  line-height: 1.4em;" class="col-xs-12 col-lg-12 col-md-12 " wicket:id="api-info">
				<dl style="    margin-bottom: 0;    padding: 0;     font-weight: bold;    width: 420px;    float: left;" wicket:id="label"></dl>				
				<dd  style="line-height: inherit;    float: left;    width: 360px;    height: initial;    border: none;    padding: 0;    float: none;    display: inline-block"class="form-control" wicket:id="value"></dd>
			</li>
		</ul>
	</div>
</wicket:panel>
