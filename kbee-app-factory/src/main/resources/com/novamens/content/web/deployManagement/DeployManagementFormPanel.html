<wicket:panel>
    <div class="row">
        <h2 class="col-lg-12 col-xs-12 col-md-12">APPLICATION RESTART/DEPLOY</h2>
    </div>
    <div wicket:id="restartApplicationPanel" />

    <div class="row">
        <h2 class="col-lg-12 col-xs-12 col-md-12">APPLICATION ARTIFACT DOWNLOAD</h2>
    </div>
    <div wicket:id="downloadPanel" />

    <div class="row">
        <h2 class="col-lg-12 col-xs-12 col-md-12">BACKUP CREATION</h2>
    </div>
    <div class="panel panel-bck">
        <div class="row">
            <form wicket:id="backupForm" class="col-lg-12 col-xs-12 col-md-12" autocomplete="on" role="form" style="margin-bottom: 0;">
                <fieldset style="margin-bottom: 0;">
                    <div class="row">
                              <div class="col-md-12 col-lg-4 col-xs-12 form-group" wicket:id="filePrefix"/>
                    </div>
                </fieldset>
                <button wicket:id="createBackup" class="btn btn-default btn-sm">
                    <wicket:message key="createBackup"/>
                </button>
                <span wicket:id="createBackupfeedback"/>
            </form>
        </div>
    </div>

    <div class="row">
        <h2 class="col-lg-12 col-xs-12 col-md-12">BACKUP FILES</h2>
    </div>
    <div class="row">
        <div class="col-lg-12 col-xs-12 col-md-12">
            <div class="panel panel-default">
                <div class="panel-body table-responsive"
                     style="padding: 0; border-top: none;">
                    <div wicket:id="backupsContainer">
                        <table class="table table-header-bck table-bordered table-hover">
                            <thead>
                            <tr class="headers">
                                <th class="col-lg-1 col-xs-1"><span>Action</span></th>
                                <th class="col-lg-5 col-xs-6"><span>Name</span></th>
                                <th class="col-lg-2 col-xs-3"><span>Size</span></th>
                                <th class="col-lg-4 col-xs-2"><span>Modified</span></th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr wicket:id="backup">
                                <td class="col-lg-1 col-xs-1">
                                    <div>
                                        <span wicket:id="action"></span>
                                    </div>
                                </td>
                                <td class="col-lg-5 col-xs-6">
                                    <div>
                                        <a wicket:id="fileLink" class="btn-link"> <span
                                                class="title" wicket:id="name"></span>
                                        </a>
                                    </div>
                                </td>
                                <td class="col-lg-2 col-xs3">
                                    <div>
                                        <span wicket:id="size" class="value colStatus"></span>
                                    </div>
                                </td>
                                <td class="col-lg-4 col-xs-2">
                                    <div>
                                        <span wicket:id="date"></span>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</wicket:panel>

<wicket:fragment wicket:id="menu-fragment">
    <div class="btn-group">
        <a wicket:id="menulink" data-toggle="dropdown" href="#"><i class="far fa-ellipsis-h"></i></a>
        <ul wicket:id="menu" class="dropdown-menu" aria-labelledby="dmenu"/>
    </div>
</wicket:fragment>
