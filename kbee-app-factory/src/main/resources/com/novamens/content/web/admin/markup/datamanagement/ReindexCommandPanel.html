<wicket:panel>


	<div class="row" style="margin-bottom: 2em;">
		<div class="col-lg-4 col-md-12 col-xs-12" style="margin-bottom: 2em;">
			<div class="row">
				<h2 class="col-lg-12 col-xs-12 col-md-12">
					<wicket:message key="select-command" />
				</h2>
				<form id="form" method="post" action="#" wicket:id="form"
					class="col-lg-12 col-xs-12 col-md-12">
					<div class="row">
						<div class="col-lg-12 form-group" wicket:id="frequent"></div>
						<div class="col-lg-12 form-group" wicket:id="parameters"></div>
					</div>
				</form>
				<div class="col-lg-12 col-xs-12 col-md-12" wicket:id="buttons"></div>
				<a class="btn btn-sm btn-danger" style="margin-left: 15px;"
					wicket:id="stop">Stop</a> <a class="btn btn-sm btn-primary"
					style="margin-left: 15px;" wicket:id="close">Close</a> <a
					class="btn btn-sm btn-default atright" wicket:id="clear">Clear
					all</a>
			</div>
		</div>

		<div wicket:id="status" class="col-lg-8 col-md-12 col-xs-12"
			style="float: right;" />
	</div>


</wicket:panel>
