<wicket:panel>

	<div class="tab-pane">

		<div class="row">
			<h2 class="col-lg-12 col-xs-12 col-md-12">
				<wicket:message key="template-editor" />
			</h2>
		</div>
		
		<div class="panel panel-bck">
			<div class="row">
				<form wicket:id="form" class="col-lg-12 col-xs-12 col-md-12" autocomplete="on"
					role="form" style="margin-bottom: 0;">
					<fieldset style="margin-bottom: 0;">
						<div class="row">
							<div class="col-lg-12 col-xs-12 col-md-12">
								<div class="row">
									<div class="col-md-6 col-lg-3  col-xs-6  form-group" 										wicket:id="key" />
									<div class="col-md-6 col-lg-2  col-xs-6  form-group"										wicket:id="language" />
									<!-- div class="col-md-6 col-lg-8  col-xs-6  form-group"										wicket:id="to" /-->
									<div class="col-md-12 col-lg-7  col-xs-12  form-group"										wicket:id="subject" />
									
									<div class="col-md-12 col-lg-12  col-xs-12  form-group"										wicket:id="text" />
									
								</div>
							</div>
						</div>
					</fieldset>
				</form>
			</div>
			<div class="row">
				<div class="col-md-12 col-lg-12 col-xs-12" wicket:id="buttons" />
			</div>
		</div>



		<div wicket:id="panel" />
		
	</div>






</wicket:panel>
