<wicket:panel>
		<div class="panel">
			<div class="row">
				<h2 class="col-lg-12 col-xs-12 col-md-12">TOOLS</h2>
			</div>
			<div class="row">
				<div class="col-lg-12 col-xs-12 col-md-12">
							<div class="row">	
								<form wicket:id="form" class="col-lg-12 col-xs-12 col-md-12" autocomplete="on" role="form" style="margin-bottom:0;">
												<fieldset style="margin-bottom:0;">
													<div class="row">
														<div class="col-md-12 col-lg-12 col-xs-12 form-group" wicket:id="text"/>
													</div>
												</fieldset>
								</form>
							</div>
							<div class="row">
								<div class="col-md-12 col-lg-12 col-xs-12" wicket:id="buttons"/>
							</div>
				</div>
			</div>
			<div class="row">
				<div class="col-lg-12 col-xs-12 col-md-12">
					<span class="alert alert-danger" style="margin: 15px 0; float:left; font-size:13px;" wicket:id="error"></span>
				</div>
			</div>
		</div>
		
		<div style="margin-bottom:30px; float:left;" wicket:id="history" />
		<div class="row panel">
				<div class="col-lg-12 col-xs-12 col-md-12">
					<h3>Hibernate</h3>
					<a class="btn btn-default btn-sm" 	wicket:id="clean-cache"><span>Clean Cache</span></a>
				</div>
		</div>

				</div>
				
				<div class="col-lg-12 col-xs-12 col-md-12">
					<span wicket:id="download-result"> </span>
				</div>

</wicket:panel>
