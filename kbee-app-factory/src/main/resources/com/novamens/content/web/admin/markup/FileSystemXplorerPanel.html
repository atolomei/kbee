<wicket:panel>
	<div style="float: left; width: 100%;">
		<h2>Logs</h2>
	</div>

	<div class="panel panel-default col-lg-12" style="clear: left;">
		<div class="panel-body table-responsive"
			style="padding: 0; border-top: none;">
			<table class="table table-header-bck  table-bordered table-hover">
				<thead>
					<tr class="headers">
						<th class="col-lg-3 col-xs-6"><span>Dir</span></th>
						<th class="col-lg-4 col-xs-6"><span>Name</span></th>
						<th class="col-lg-2 col-xs-3"><span>Size</span></th>
						<th class="col-lg-3 col-xs-3"><span>Modified</span></th>
					</tr>
				</thead>

				<tbody>
					<tr wicket:id="log">
						<td class="col-lg-4 col-xs-6">
							<div>
								<span class="title" wicket:id="dir"></span>
							</div>
						</td>

						<td class="col-lg-3 col-xs-6">
							<div>
								<a wicket:id="loglink" class="btn-link"> <span class="title"
									wicket:id="name"></span>
								</a>
							</div>
						</td>

						<td class="col-lg-2 col-xs-3">
							<div>
								<span wicket:id="size" class="value colStatus"></span>
							</div>
						</td>
						<td class="col-lg-3 col-xs-3">
							<div>
								<span wicket:id="date"></span>
							</div>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>

</wicket:panel>
