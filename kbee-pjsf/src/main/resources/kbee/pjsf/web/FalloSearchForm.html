
<wicket:panel xmlns:wicket="http://wicket.apache.org">

    <div class="card shadow-sm">
        <div class="card-body">
            <form wicket:id="form">
            <div class="row g-3">

                <!-- Texto libre: ancho completo -->
                <div class="col-12">
                    <div wicket:id="texto"></div>
                </div>

                <!-- Carátula: ancho completo -->
                <div class="col-12">
                    <div wicket:id="caratula"></div>
                </div>

                <!-- Tribunal -->
                <div class="col-12 col-md-6">
                    <label for="tribunal" class="form-label">
                        Tribunal
                    </label>
                    <input id="tribunal"
                           name="tribunal"
                           type="text"
                           class="form-control"
                           placeholder="Nombre del tribunal" />
                </div>

                <!-- Jueces -->
                <div class="col-12 col-md-6">
                    <div wicket:id="juez"></div>
                </div>

                <div class="col-12 col-md-6">
                    <div wicket:id="desdeFecha"></div>
                </div>

                <div class="col-12 col-md-6">
                    <div wicket:id="hastaFecha"></div>
                </div>


                <!-- Cita -->
                <div class="col-12 col-md-6">
                    <div wicket:id="cita"></div>
                </div>
 
                <!-- Número SAIJ -->
                <div class="col-12 col-md-6">
                    <div wicket:id="saij"></div>
                </div>
                

                <!-- Número CUIJ -->
                <div class="col-12 col-md-6">
                    <div wicket:id="cuij"></div>
                </div>

                <!-- Número de resolución -->
                <div class="col-12 col-md-6">
                    <div wicket:id="resolucion"></div>
                </div>
                
                
                <div class="col-12 col-md-6">
                    <div wicket:id="paginaInicio"></div>
                </div>

                <div class="col-12 col-md-6">
                    <div wicket:id="paginaFin"></div>
                </div>
                
                
                <!-- Cita Jurisprudencia -->
                <div class="col-12 col-md-6">
                    <div wicket:id="citaJurisprudencia"></div>
                </div>
                
                <div class="col-12 col-md-6">
                    <div wicket:id="referenciaNormativa"></div>
                </div>

            </div>

            <!-- Acciones -->
            <div class="d-flex justify-content-end mt-4">
                <div class="advanced-search-submit">
                    <button wicket:id="submit" type="submit"
                            class="btn btn-primary">
                        Buscar
                    </button>

                    <a wicket:id="simple"
                       class="simple-search-link">
                        búsqueda simple
                    </a>
                </div>
            </div>
            </form>
        </div>
    </div>

</wicket:panel>
