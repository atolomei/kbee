<p>Una plantilla de contenido es la definición de los <b>formularios</b> y de los <b>procesos</b> de edición de cada contenido asociado con esa plantilla. En las <b>tareas</b> de esos procesos de trabajo se editan los formularios. Las <a href="/model/contentclasses">plantillas de Contenidos</a> son definibles y son parte del <a href="/model">Modelo de Información</a>.
