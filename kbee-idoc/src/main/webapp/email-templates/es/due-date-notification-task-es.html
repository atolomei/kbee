<html>


<div style="float:left; display:block; width:100%; text-align:center; font-family: Arial, Sans Serif; font-size:17px; line-height: 1.25em; min-width:420px;">
		<div style="margin:auto; width: 100%;  max-width: 1200px; float: none; background: white; border-radius: 10px;">
					<div style="float:left; width:100%; border: 1px solid #d8dcdf;">
							<div style="background: #f8f9fa; float: left; width: 100%; border-radius: 10px; margin-bottom: 30px; padding: 30px 0;  border-radius: 10px 10px 0 0; border-bottom: 1px solid  #d8dcdf;">	
								<div style="float: left;  width: 100%;">
									<a style="float: none; margin: auto;   display: block; margin-left: 0;" href="https://kbee.io" target="_blank"> 
										<#if content.domain.logo??>
											<img style="max-width:220px" src="${content.domain.logo.publicurl}">
										<#else>
											<img src="http://kbee.io/images/kbee-vert.png">
										</#if>
						
									</a>
								</div>
							</div>
							
							<div style="float: none; margin: auto; width: 100%; max-width:980px; padding-left:30px; padding-right:30px; box-sizing: border-box;">
											
											<span style="margin-bottom:15px; width:100%; float:left;">Fecha de Vencimiento de Tarea</span>
											
											<span style="margin-bottom:5px; width:100%; float:left;"><b>Contenido</b></span>		
											<span style="margin-bottom:15px; width:100%; float:left;">${content.title}</span>
											
											<span style="margin-bottom:5px; width:100%; float:left;"><b>Información</b></span>		
											<span style="margin-bottom:15px; width:100%; float:left;">${content.subtitle}</span>
						
											<span style="margin-bottom:5px; width:100%; float:left;"><b>Tarea</b></span>
											<span style="margin-bottom:15px; width:100%; float:left;">${activity.task.displayname}</span> 
											
											<span style="margin-bottom:5px; width:100%; float:left;"><b>Fecha límite</b></span>
											<span style="margin-bottom:15px; width:100%; float:left;">${activity.duedate?string["dd/MM/yyyy"]}</span>
							</div>
							
							<div style="float: left; width: 100%; margin-top: 40px; margin-bottom: 60px;">
											<a title="abrir tarea" href= ${activity.url} style="text-decoration: none; border-radius: 10px; width: 60%; height: 34px; font-size: 16px; box-shadow: none; 
											color: #195573; border: 1px solid #195573; background: white; padding: 15px 40px;"	target="_blank">Abrir Tarea</a>
							</div>
													
							<div style="float: left; width: 100%; margin-top: 0px; margin-bottom: 60px;">
								<a style="color: #195573;" href="${my-tasks-url}" target="_blank">Mis Tareas</a>
							</div>
				</div>
		</div>
</div>
</html>
