
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">

<body>
	<wicket:extend>
		<div class="auxpage kbee">
			<div class="header-container">
					<div class="header">	
						<div class="logo">
							<a href="/workspace" style="float: left;">
								<div class="isologo" style="float: left;">
									<img src="/images/kbee.png"></img>
								</div>
							</a>
						</div>
					</div>
			</div>
			
			<!--------------------------------------------------------------------------------->			

			<div class="kbee-content-main-area-container">
			
				<div id="task-panel" style="width:73%; float: left; padding: 24px 0 0 2%;">
					<div id="titulo-y-tipo" style="width:100%; float: left; margin-bottom: 32px;">

						<div id="content-title" class="title" style="width:100%; float: left; margin-bottom: 32px;">
							<h1>Oscar Niemeyer</h1>
						</div>
	 					
	 					<div id="workflow-type" style="width:100%; float: left;">
	 						<h2 class="title">Workflow type</h2>
	 						<div>Move In</div>
	 					</div>
	 				</div>
	 				
					<div id="task-resolution" style="width:100%; float: left; margin-bottom: 32px;">
		 				<div id="resolution">
		 					<div style="width:100%; float: left; margin-bottom: 32px;">
		 						<h2 class="title">Files</h2>
		 						<ul  style="width:100%; float: left;">
		 							<li style="width:100%; float: left; margin-bottom: 6px;">File 1</li>
		 							<li style="width:100%; float: left; margin-bottom: 6px;">File 2</li>
		 							<li style="width:100%; float: left; margin-bottom: 6px;">File 3</li>
		 						</ul>
		 					</div>
		 					
		 					<div style="width:100%; float: left; margin-bottom: 32px;">
		 						<h2 class="title">Message</h2>
		 						<div style="width:100%; float: left; margin-bottom: 32px;">
										Message		 						
		 						</div>	
		 					</div>
		 					
		 					<div>
		 						<h2 class="title">Task termination</h2>
		 						<div style="width:100%; float: left; margin-bottom: 32px;">
									<a class="button">Submit</a> 		 						
		 						</div>	
		 						
		 					</div>
		 				</div>
		 			</div>
				</div>

			<!--------------------------------------------------------------------------------->			
				
				<div id="context-panel" style="width:auto; min-width:22%; background:#f2f2f2; float: right;margin-bottom: 32px; min-height:700px; padding: 24px 0 0 2%;">
					<div id="context" style="width:100%; float: left; margin-bottom: 32px;"><h2 class="title">Context</h2></div>
					<div id="classification"><h2 class="title">Classification</h2></div>
				</div>
				
			</div>
			
			<!--------------------------------------------------------------------------------->			
		
		</div>
	</wicket:extend>
</body>
</html>
