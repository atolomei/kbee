<wicket:panel>
	<div class="error" style="padding:15px; float:left;">
		<div class="content">
			<div class="container-fluid">
				<div style="float:left; width:100%;">
					<div style="float:left; width:100%;">
						<h3 class="title" wicket:id="title"></h3>
						
						<div class="row">
							<div class="col-lg-12 col-md-12 col-xs-12">
								<div class="text" wicket:id="text"></div>
							</div>
						</div>
						<div class="row">
							<div class="col-lg-12 col-md-12 col-xs-12">
								<span style="margin-top:1em; margin-bottom: 1em; float:left;" wicket:id="stktrace"></span>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	
</wicket:panel>
