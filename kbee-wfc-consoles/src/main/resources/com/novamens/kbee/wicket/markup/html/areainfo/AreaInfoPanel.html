<wicket:panel>

	<div class="row">
		<div wicket:id="area" class="col-md-12 col-lg-12 col-xs-12" style="max-width:1920px;">
			<div class="row">
				<div wicket:id="data-container"
					class="col-md-10 col-lg-10 col-xs-12" style="max-width: initial;">
					<ul class="row" style="float: initial;">
						<li wicket:id="grid-element" class="fieldset col-lg-12">
							<div wicket:id="element" />
						</li>
					</ul>
				</div>
				<div wicket:id="actions-container"
					class="button-container col-xs-12 col-md-2"
					style="text-align: left;">
					<div wicket:id="actions" />
				</div>
			</div>
		</div>
	</div>


</wicket:panel>
