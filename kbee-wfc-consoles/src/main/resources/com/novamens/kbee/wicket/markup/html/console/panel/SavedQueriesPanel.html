<wicket:panel>
		<ul class="list-group col-lg-12 col-md-12 col-xs-12 compressed-list"style="padding:15px 0 0 0; max-height:800px;min-height:320px; overflow:auto;">
			<li class="list-group-item" wicket:id="query">
				<div style=	"    float: left;    display: inline-block;    position: relative;">
					<a id="dmenu" style="width:32px; height:24px;  padding: 2px 6px; position:relative; float:left;" class="dmenu"  data-toggle="dropdown"><i class="far fa-ellipsis-h" aria-hidden="true"></i></a>
					<ul wicket:id="menu" class="dropdown-menu dropdown-menu-left" aria-labelledby="dmenu" />
				</div>

				<div style="margin-left:35px; width:calc(100% - 35px);">
					<a wicket:id="link">
						<span class="membername" wicket:id="title"/>
						<span class="membercount" wicket:id="total"/>
					</a>
				</div>
			</li>
		</ul>
		<div wicket:id="actions" class="col-lg-12 col-md-12 col-xs-12 actions-block" style="padding:10px 0 0 0;">
			<a class="btn btn-link" style="float:left;" wicket:id="close"> <wicket:message key = "close" /></a>
			<a class="btn btn-link" style="float:left;" wicket:id="clear-all"> <wicket:message key = "clearall" /></a>
			<a class="btn btn-link" style="float:left;" wicket:id="add-to-main"> <wicket:message key = "add-to-main" /></a>
			<a class="btn btn-link" style="float:right;" wicket:id="remove-all"> <wicket:message key = "removeall" /></a>
		</div>
		<div style="width:100%; float:left;" wicket:id="savedquery-editor" />
	
</wicket:panel>

<wicket:fragment wicket:id="savedquery-editor-fragment">
			<div class="panel panel-bck mt20">
				<div class="row">
					<form wicket:id="form" class="col-md-12 col-lg-12 col-xs-12" role="form">
							<div class="row">
								<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="name"/>
							</div>
					</form>
				</div>				
				<div class="row">
					<div class="col-md-12 col-lg-12 col-xs-12"> 
						<a href="#" class="btn btn-default btn-xs" wicket:id="cancel"><wicket:message key = "cancel" /></a>
						<a href="#" class="btn btn-primary btn-xs" wicket:id ="save"><wicket:message key = "save" /></a>
					</div>
				</div>
			</div>
			
</wicket:fragment>
