<wicket:panel>
	<dl class="indicators">

		<wicket:container wicket:id="indicator"> 
		
		<div class="result">
			
			<dt class="indicator-container">
				<a  wicket:id="indicator-link">
					<span  style="padding-left: 10px; float:left;" wicket:id="indicator-name"/>
				</a>
			</dt>
			<dd class="value-container">
				<span  style="padding-left: 8px; float: left;" wicket:id="indicator-value"/>
			</dd>
		</div>
		</wicket:container>
	</dl>
</wicket:panel>
