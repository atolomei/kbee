<wicket:panel>

<div class="button-and-submenu"  style="display: inline-block;">
	
	<a id="actionmenu-link" wicket:id="action-link" class="button withsubmenu">
		
		<div class="icon-label-container">
			<div wicket:id="icon-container" class="icon">
				<img wicket:id="action-icon"/>
			</div>
			<div wicket:id="label-container" class="label">
				<span wicket:id="action-label"></span>
			</div>
		</div>
	</a>
	
	<div wicket:id="submenu" id="actionmenu" class="menu">
		<ul>
			<li wicket:id="items">
				<wicket:container wicket:id="item"/>
			</li>
		</ul>		
	</div>
</div>
</wicket:panel>

<wicket:fragment wicket:id="item-section-header-fragment">
	<div wicket:id="item-label">
		<span wicket:id="item-label"></span>										
	</div>
</wicket:fragment>


<wicket:fragment wicket:id="item-fragment">
	<a wicket:id="item-link">
		<span wicket:id="item-label"></span>										
	</a>
</wicket:fragment>

<wicket:fragment wicket:id="windowitem-fragment">
	<a wicket:id="item-link">
		<span wicket:id="item-label"></span>										
	</a>
	<div wicket:id="window"/>
</wicket:fragment>

<wicket:fragment wicket:id="submenu-fragment">	
	<em><span wicket:id="item-label"></span></em>	
	<div style="margin-right: 12px; margin-top: 6px; float: right;"><img wicket:id="icon-submenu"></img></div>	
	<div id="actionsubmenu" class="submenu" wicket:id="submenu" style="top:92px;">
		<ul>
			<li wicket:id="subitems">
				<wicket:container wicket:id="item"/>
			</li>
		</ul>
	</div>
</wicket:fragment>
