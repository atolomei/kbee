<wicket:panel>
	
					<div class="canvas">
								<div class="content-header">
									<div class="icon-container">
										<i class="far fa-edit" style="margin-top: 0px;"></i>
									</div>
							
									<div style="width: initial; float: left;">
										<h1> <wicket:message key="batchcreation" /></h1>
										<div wicket:id="breadcrumb"></div>
									</div>
								</div>
								
								<div class="row" style="margin-bottom: 2em;">
									<div class="col-lg-5 col-md-6 col-xs-12" style="margin-bottom: 2em;">
											<div class="row">
												<div class="panel col-lg-12">
														<h2> <wicket:message key="howitworkstitle" /></h2>
														<div style="float:left;">
																<wicket:message key="howitworks" />
														</div>
												</div>
											</div>

										<div class="row">											
										<form id="form" method="post" action="#" wicket:id="form" class="form-container col-lg-12" style="    margin-bottom: 72px;    float: left;">
											<h2> <wicket:message key="values" /></h2>
											
																						
											<div class="form-group" wicket:id="datasets" />
											
											<div class="form-group">
												<label style="width:initial;"><wicket:message key="elements" /></label>
												<span style="margin-left: 4px;" class="ago"><wicket:message key="oneperline" /></span>											
												<textarea wicket:id="elements"  class="form-control" rows="12"></textarea>
											</div>
											<div class="button-container col-lg-12" style="float:left;">
								 				<a wicket:id="close-button"  href="#"   class="btn btn-sm btn-default"> <span wicket:id="close" /></a>
								 				<a wicket:id="submit-button"  href="#"  class="btn btn-sm btn-primary"><wicket:message key="create" /></a>
								 				<a wicket:id="stop-button"  href="#" 	class="btn btn-sm btn-danger"><wicket:message key="stop" /></a>
											</div>
											<div wicket:id="feedback"></div>   
										</form>
										</div>
									</div>
									
									<div wicket:id="status"  class="col-lg-6 col-md-6 col-xs-12" style="float:right;"/>
							</div>
					</div>
	


</wicket:panel>
