<wicket:panel>
	
	<div class="standard-canvas">

		<div class="row">
			<div class="button-container col-md-3 col-xs-12 col-lg-3 mb20" wicket:id="buttons"/>
			<div class="col-xs-12 col-lg-9 col-md-9">
				<h2> <wicket:message key="viewer" /></h2>
			</div>
		</div>
		<div class="row">	
			<form wicket:id="form" class="form-container col-md-12 col-lg-12 col-xs-12" role="form">

	 				<div class="row">
						
						<div class="form-group">
								<div class="col-xs-12 col-lg-12 col-md-12 mb15" wicket:id="template"/>
								<div class="col-xs-12 col-lg-12 col-md-12">
									<a class="btn btn-default btn-md" style="margin-bottom:30px; float:left;" wicket:id="apply">
											<wicket:message key="load" />
									</a>
								</div>
							</div>
	 				</div>						

					<div class="row">
						<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="viewer"/>
	 				</div>
	 				
			</form>

		</div>
	</div>
	
	<div wicket:id="help-modal" class="modal window" z-index=999999 tabindex="-6" role="dialog"/>
</wicket:panel>
