<wicket:panel>
		<div class="row standard-canvas">
			
			<div class="col-md-9 col-lg-10 col-xs-12">
				<h2 style="padding:0;" class="col-md-12 col-lg-12 col-xs-12">DataSet Value</h2>
				<div wicket:id="alert-external" class="alert alert-info" role="alert"><span wicket:id="note-external"></span></div>
				
				<div class="row">
					<form wicket:id="form"  class="form-container"     style=" width:100%;  float: left;" role="form">
						<div class="form-group col-xs-12" wicket:id="value"/>
						<div class="form-group col-xs-12" wicket:id="parent"/>
						<div class="form-group col-xs-12" wicket:id="labelcolor"/>
						<div class="form-group col-xs-12" wicket:id="classification"/>
					</form>
				</div>					
			</div>
			<div class="button-container col-md-3 col-lg-2 col-xs-12" wicket:id="buttons" />
			
		</div>

</wicket:panel>
