<wicket:panel>
	<div class="infopanel">
		<div class="content-editor"  style="width: auto;">
			<div class="editor">
				<h3>  <wicket:message key="class" /></h3>
			</div>
			<ul style="margin-top:0px; width:100%; line-height: 1.5em;">
				<li style="display: block;">
					<span wicket:id="class"></span>
				</li>
			</ul>
			
			<div class="editor">
				<h3><wicket:message key="classifiers" /> </h3>
			</div>
			<ul style="margin-top:0px;">
				<li wicket:id="classifier" style="display: block; width:100%; float:left;">
					<span wicket:id="name"></span>
				</li>
			</ul>
		</div>
	</div>
</wicket:panel>
