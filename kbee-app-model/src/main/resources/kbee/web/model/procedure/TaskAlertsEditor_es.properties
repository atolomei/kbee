task-alerts = Alertas

property.dueDateAlerts = Días anteriores a la Fecha de Vencimiento
dueDateAlerts.help = Cantidad de días antes de la Fecha de Vencimiento separados por ';'. Ejemplo: <i>10;5;1</i>  

property.maxTimePending = Tiempo máximo en Pendiente (días)
maxTimePending.help = Tiempo expresado en días. Valores igual o menor a cero indican un tiempo ilimitado. 
Cuando el tiempo es alcanzado, los usuarios con permiso de monitoreo son notificiados

property.maxTimeRunning = Tiempo máximo Asignado a un usuario (días)
maxTimeRunning.help = Lapso expresado en días. Valores igual o menor a cero indican un tiempo ilimitado. 
Cuando el tiempo es alcanzado, los usuarios con permiso de monitoreo son notificiados

