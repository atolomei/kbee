phase-help=Las <i>Etapas</i> son los distintos estados del proceso (Ejemplo: \
<i>Edición</i>, <i>Aprobación</i>, <i>Auditoría</i>, etc.). \
Cada Tarea pertenece a una y sólo una Etapa, y una Etapa puede tener varias Tareas La Etapa de una Tarea puede ser fija o \
heredada del Contexto del Proceso de Trabajo(por ejemplo: una Tarea de Colaboración normalmente hereda la Etapa de la Tarea anterior).

