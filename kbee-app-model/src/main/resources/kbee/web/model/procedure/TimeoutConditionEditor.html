<wicket:panel>
	<div class="row">
		<form wicket:id="form"  class="col-md-8 col-lg-8 col-xs-12 form-container" role="form">
			
			<div class="row">
				<div class="col-xs-12 form-group">
					<div class="row">
						<div class="col-xs-12">
							<h2>GENERAL</h2>
						</div>
					</div>
					<div class="row">	
						<div class="form-group col-md-6 col-xs-12" wicket:id="label"/>
						<div class="form-group col-md-6 col-xs-12" wicket:id="event"/>
						<div class="form-group col-md-6 col-xs-12" wicket:id="duration"></div>
						<div class="form-group col-md-6 col-xs-12" wicket:id="enabled"/>
						
					</div>
					
				</div>
			</div>
			
			<div class="row">
				<div class="col-xs-12 form-group">
					<div class="row">
						<div class="col-xs-12">
							<h2>After Task Termination</h2>
						</div>
					</div>
				
					<div class="row">
						<div class="form-group col-md-12 col-xs-12" wicket:id="note"/>
						<div class="form-group col-md-12 col-xs-12" wicket:id="classifiersrules"/>
						<div class="form-group col-md-12 col-xs-12" wicket:id="attributesrules"/>
					</div>
				</div>
			</div>
				
			
		</form>
		
		
		<div class="button-container col-md-4 col-lg-4 col-xs-12" wicket:id="buttons"/>
	</div>
</wicket:panel>
