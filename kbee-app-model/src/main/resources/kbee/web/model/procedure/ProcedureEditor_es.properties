task-table-help-window=<div class="col-lg-12 panel"><h2>Name</h2><p>Name<i>(initial)</i> -> the initial task when the Workflow starts.</p></div> \
<div class="col-lg-12 panel"><h2>Security Trigger</h2><p>Task starting strategy. Whether the new task is sent to Pending or assigned to last user who did the same task before, or sent to user with right Role ...). Initial Task is special case, the trigger is manual</p></div>\
<div class="col-lg-12 panel"><h3>Round Robin</h3> Assign the task to the user/s that have the Workflow Role (W-Role) assigned via Security Roles. If there is more than one user the assign policy is round-robin.</div>\
<div class="col-lg-12 panel"><h3>Other</h3> There are more triggers available see here.</div>\
<div class="col-lg-12 panel"><h2>Action</h2><p>Action that terminates the Task -> routing strategy for the action</p></div> \
<div class="col-lg-12 panel"><h2>Workflow Role (W-Role)</h2><p>Workflow Role to assign to the user that executes the Task </p></div> \
<div class="col-lg-12 panel"><h2>Precondition</h2><p>IQL Condition that must be true for the Task to Start. If it is not true, the Task is sent to Pending</p></div>

