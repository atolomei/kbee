wrole-help=A <b>Workflow Role (W-Role)</b> is a role specific for the Business Process. Every Tasks has one and only one Workflow Role (W-Role). A Workflow Role (W-Role) can be seen as a tag applied to the user that executes the Task. When the Task starts, the user that executes the Task is assigned the Task's Workflow Role (W-Role). This information is used by the workflow engine for routing, next time it needs to assign a task to the workflow role it will look for the user that has the 'tag attached'.
menu.remove=Remove 
phase-help=<b>Phases</b> are the process' distinct stages (example: Submission, Review, Audit). Every task belongs to one a only one phase, but a phase can have more than one task (example: Tasks <i>'Submission'</i> and <i>'Re-Submission'</i> can belong to the same phase <i>'File Submission'</i>. \
A Task phase can be defined -assigned by the Task editor- \
or inherited from the workflow context (for example: a Peer Review normally inherits the caller's phase).
