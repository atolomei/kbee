none = Ninguno

property.triggerType = Trigger (Strategy to start the Task)
triggerType.help = The Security Trigger defines who starts the task and how

trigger.userautomaic.help = La tarea se asigna a un usuario tomado de la lista de usuarios con permisos para ejecutarla. Luego, en las siguientes asignaciones se \
	recorre en orden la misma lista  

trigger.none.help = Al no seleccionarse ninguna Estrategia de Inicio se toma la definida en la Tarea a ejecutarse

trigger.manual.help = <p>La tarea queda en la consola de pendientes para su inicio manual. La podrán tomar de esta consola los usuarios que tengan el permiso  \
	que se indentifica en la lista de control de acceso con la leyenda "Tomar " mas el nombre de la tarea.</p>
	
trigger.manual-lastuser.help = <p>La tarea se inicia en forma automática asignándose al usuario que la haya ejecutado en una iteración previa. \
	En la primera iteración queda en la consola de pendientes para su inicio manual.</p> 

trigger.userautomaic.help = <p>La tarea se inicia en forma automática asignando un usuario con en el siguiente orden de prioridades: </p> \
	<ul> \
	<li>En primera instancia se asigna en orden de ronda a alguno de los usuarios que tengan otorgado el permiso que se indentifica en la listas de controles de acceso (ACL) con el nombre de la tarea. </li>\
	<li>En segunda instancia a los usuarios con el permiso que se indentifica en la listas de controles de acceso (ACL) como "Backup" mas nombre de la tarea. </li>\
	<li>En última instancia, si no se encuentra a un usuario con el permiso necesario la tarea queda en la consola de pendientes para su inicio manual.</li>\
	</ul>
	
trigger.userautomaic-role.help	= <p>La tarea se inicia en forma automática asignando un usuario con en el siguiente orden de prioridades: </p> \
	<ul> \
	<li>En primera instancia se al usuario cumpla algun rol en el proceso y que tengan otorgado el permiso que se indentifica en la listas de controles de acceso (ACL) con el nombre de la tarea. </li>\
	<li>En segunda instancia se asigna en orden de ronda a alguno de los usuarios que tengan otorgado dicho permiso. </li>\
	<li>En tercera instancia a los usuarios con el permiso que se indentifica en la listas de controles de acceso (ACL) como "Backup" mas nombre de la tarea. </li>\
	<li>En última instancia, si no se encuentra a un usuario con el permiso necesario la tarea queda en la consola de pendientes para su inicio manual.</li> \
	</ul>

trigger.userautomaic-lastuser.help = <p>La tarea se inicia en forma automática asignando un usuario con en el siguiente orden de prioridades: </p> \
	<ul><li>En primer lugar, al último usuario que haya ejecutado la tarea en una iteración previa. </li>\
	<li>En segunda instancia se asigna en orden de ronda a alguno de los usuarios que tengan otorgado el permiso que se indentifica en la listas de controles de acceso (ACL) con el nombre de la tarea. </li>\
	<li>En tercera instancia a los usuarios con el permiso que se indentifica en la listas de controles de acceso (ACL) como "Backup" mas nombre de la tarea. </li>\
	<li>En última instancia, si no se encuentra a un usuario con el permiso necesario la tarea queda en la consola de pendientes para su inicio manual.</li></ul>

trigger.role.help = <p>La tarea se inicia en forma automática asigándose al usuario que haya adquirido previamnte en el proceso, el rol definido para la tarea. Los \
	roles se adquieren ejecutando una tarea previa del mismo rol</p>  
	 
trigger.collaborator.help = La tarea es asignada al colaborador seleccionado en la finalización de la tarea anterior

take-label = Take
backup-label = Backup