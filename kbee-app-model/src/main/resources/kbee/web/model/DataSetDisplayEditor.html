<wicket:panel>
	<div class="row standard-canvas">
		<form wicket:id="form"  role="form" class="form-container col-lg-8 col-xs-12 col-md-9">
			<div class="panel">
				<div class="row">
					<h2 class="col-xs-12 col-md-12 col-lg-12"> <wicket:message key="display"/></h2>
				</div>
				<div class="row">
					<div class="col-xs-12 col-md-12 col-lg-12">
						<fieldset style="padding-top: 15px;">
							<div class="form-group row">
								<h3 class="col-xs-12 col-md-12 col-lg-12"> <span> <wicket:message key="displayName" /></span></h3>
								<div class="col-xs-12 col-md-12 col-lg-12 form-group" wicket:id="displayNameEditable" />
								<div class="col-xs-12 col-md-12 col-lg-12 form-group" wicket:id="displayNameTemplate" />
								<div class="col-xs-12 col-md-12 col-lg-12 form-group" wicket:id="alternativeDisplayNameTemplate" />
								<h3 class="col-xs-12 col-md-12 col-lg-12"> <span> <wicket:message key="subline" /></span> </h3>
								<div class="col-xs-12 col-md-12 col-lg-12 form-group" wicket:id="sublineTemplate" />
							</div>
						</fieldset>	
					</div>		
				</div>
			</div>		
		</form>
		<div class="button-container col-md-4 col-xs-12 col-lg-4" wicket:id="buttons"/>
	</div>
</wicket:panel>
