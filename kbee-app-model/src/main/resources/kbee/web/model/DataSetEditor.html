<wicket:panel>

	<div class="row standard-canvas">
		<div class="button-container col-md-3 col-lg-2 col-xs-12" wicket:id="buttons"/>
		<div class="col-md-9 col-lg-10 col-xs-12" style="padding:0;">
			<div wicket:id="iscanonical" style="padding: 0 15px; margin-bottom:15px; float:left; width:100%;" />
			<form wicket:id="form"  class="form-container" style="width:100%; float:left;" role="form">
				<fieldset>
					<h2 class="col-md-12 col-lg-12 col-xs-12"><wicket:message key="info"/></h2>
					<div class="panel">
							<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="name"/>
							<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="alias"/>
							<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="type"/>
							<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="aggregation"/>
							<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="description"/>
							<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="readonly"/>
							<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="uniqueValues"/>
							<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="accessStrategy"/>
							<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="hierachical"/>
							<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="suggester"/>
							<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="id"/>
					</div>
	 				<div wicket:id="create-classifier-container" class="row">
						<div class="col-lg-12 form-group">
							<h2 class="col-xs-12 col-lg-12 col-md-12"> <wicket:message key="create-classifier-title" /></h2>
							<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="createClassifier" />
						</div>
					</div>		
				</fieldset>		
			</form>
		</div>
	</div>		

</wicket:panel>
