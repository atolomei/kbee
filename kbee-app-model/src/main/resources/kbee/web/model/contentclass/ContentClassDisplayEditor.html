<wicket:panel>
	<div class="row standard-canvas">
		<form wicket:id="form"  role="form" class="form-container col-lg-8 col-xs-12 col-md-9">
			<div class="panel">
				<div class="row">
					<h2 class="col-xs-12 col-md-12 col-lg-12"> <wicket:message key="display"/></h2>
				</div>
				<div class="row">
					<div class="col-xs-12 col-md-12 col-lg-12">
							<fieldset style="padding-top: 15px;">
							<div class="form-group row">
								<h3 class="col-xs-12 col-md-12 col-lg-12"> <span> <wicket:message key="title" /></span></h3>
								<div class="col-xs-12 col-md-12 col-lg-12 form-group" wicket:id="isTitleEditable" />
								<div class="col-xs-12 col-md-12 col-lg-12 form-group" wicket:id="titleRuleType" />
								
								
								<div class="col-xs-12 col-md-12 col-lg-12 form-group">
									<div  wicket:id="titleMacro" />
									<div> <a wicket:id="title-apply-default"  class="btn-link" href="#"> <wicket:message key="apply-default"/></a></div>
									
								</div>
								
								<div class="col-xs-12 col-md-12 col-lg-12 form-group" wicket:id="titleScript" />
								<a class="col-xs-12 col-md-12 col-lg-12 form-group"  wicket:id="test-macro" href="#"> <wicket:message key="test-macro" /></a>
								<div class="col-xs-12 col-md-12 col-lg-12 form-group" wicket:id="test-macro-panel" />
								
							</div>
							<div class="form-group row">
								<h3 class="col-xs-12 col-md-12 col-lg-12"> <span> <wicket:message key="subtitle" /></span> </h3>
								
								
								<div class="col-xs-12 col-md-12 col-lg-12 form-group">
									<div wicket:id="consoleSubtitleRule" />
									<div> <a wicket:id="sub-apply-default" class="btn-link" href="#"><wicket:message key="apply-default"/></a></div>
									
								</div>
								

								<div class="col-xs-12 col-md-12 col-lg-12 form-group">
									<div wicket:id="portalsSubtitleRule" />
									<div> <a wicket:id="sub-portal-apply-default" class="btn-link" href="#"><wicket:message key="apply-default"/></a></div>
								</div>
								
								
								
								
								
								
								
								
								
							</div>
							<div class="form-group row">
								<h3 class="col-xs-12 col-md-12 col-lg-12"> <span> <wicket:message key="resources" /></span> </h3>
								<div class="col-xs-12 col-md-12 col-lg-12 form-group" wicket:id="defaultViewMode" />
							</div>
						</fieldset>
					</div>
				</div>
			</div>		
		</form>
		<div class="button-container col-md-4 col-xs-12 col-lg-4" wicket:id="buttons"/>
	</div>
	<div wicket:id="help-modal" class="modal window" z-index=999999 tabindex="-6" role="dialog"/>
</wicket:panel>
