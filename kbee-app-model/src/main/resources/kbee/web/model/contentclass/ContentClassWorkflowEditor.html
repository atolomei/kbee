<wicket:panel>
	<div class="standard-canvas">	
		<div class="row">
			<h2 class="col-md-12 col-lg-10 col-xs-12"><wicket:message key ="procedures.label"/></h2>
			<div class="col-md-2 col-lg-2 col-xs-12">
				  <wicket:container wicket:id="new.button" />
			</div>
		</div>
		<div class="content-class-workflow-editor">
			<table class="table-responsive table table-header-bck  table-hover" id="tasks" style="line-height: 1.5em;">
				<thead>
					<tr class="headers">
						<th class="col-xs-3 col-md-3 col-lg-3"><span><wicket:message key="procedure.name" /></span></th>
						<th class="col-xs-3 col-md-4 col-lg-4"><span><wicket:message key="procedure.description" /></span></th>
						<th class="col-xs-1 col-md-1 col-lg-1"><span></span></th>
					</tr>
				</thead>
				<tbody>
					<tr wicket:id="procedures">
						<td class="col-xs-3 col-md-3 col-lg-3"><a wicket:id="procedure.link"><span wicket:id="procedure.name"></span></a></td>
						<td class="col-xs-3 col-md-4 col-lg-4"><span wicket:id="procedure.description"></span></td>
						<td class="col-xs-1 col-md-1 col-lg-1">
							<div class="dropdown" style="text-align: center;width: 100%;" icket:id="menu-container">
								<a id="dmenu" data-toggle="dropdown"> <i class="far fa-ellipsis-h" aria-hidden="true"></i></a>
								<ul icket:id="menu" class="dropdown-menu dropdown-menu-right" aria-labelledby="dmenu" />
							</div>
						</td>
					</tr>
				</tbody>
			</table> 
		</div>
	</div>
	<div wicket:id="confirmation.dialog" class="modal window" tabindex="-4" role="dialog"/>
</wicket:panel>
