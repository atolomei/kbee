


<wicket:panel>

	<div wicket:id="box" class="container-fluid">

		<div class="row">
			<div class="text-bg-dark d-block mt-0 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12"
				style="position: relative; height: 100vh;">

				<div class="mt-0 w-100 ps-4 pe-4" style="position: absolute; top: 42%; left: 50%; transform: translate(-50%, -50%); display: inline-block; background: inherit;">

					<div wicket:id="logo-panel" />

					<div class="form-container" >

						<form wicket:id="form" name="f" action="/j_spring_security_check" method="post"
							class="text-center text-lg-center text-md-center text-sm-center text-xl-center textl-xxl-center mt-4">

							<fieldset>
								<div class="row">
									<div class="text-center col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12 mb-3">
										<div wicket:id="username" name="j_username" placeholder="username or email" />
									</div>
								</div>

								<div class="row">
									<div class="text-center col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12 mt-2 mb-3">
										<div wicket:id="password" name="j_password" />
									</div>
								</div>

								<div class="row">
									<div class="text-center col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12">
										<input wicket:id="submit" style="display: none;" type="submit" value="" /> <input wicket:id="realUsername"
											type="hidden" />
									</div>
								</div>

								<div class="row">
									<div class="text-center col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12 mt-4 mb-0">
										<div style="text-align: center;" class="form-group">
											<input wicket:id="tmpSubmit" class="btn btn-primary fullw login loginmodal-submit" type="submit" name="login"
												value="ingresar" />
										</div>
									</div>
								</div>

								<div class="row">
									<div class="alert alert-danger mt-2 mb-2 text-center col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12"
										style="text-align: center;" wicket:id="error"></div>
								</div>

								<div class="row">
									<div style="margin-top: 10px;"
										class="text-center mb-2 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12">
										<a class="text-light"  href="/forgotpassword"><wicket:message
												key="forgot-password" /></a>
									</div>
								</div>

								<div class="row">
									<div class="text-center  mt-3 mb-0 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12 mt-4 mb-2">
										<a class="pt-1 pb-1" style="font-weight: bold;" href="/signinms"> <wicket:message key="signin-microsoft" />
										 </a>
									</div>
								</div>
 

							</fieldset>
						</form>

					</div>

				</div>
			</div>


		</div>
	</div>

</wicket:panel>
