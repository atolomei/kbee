<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">

<body>
	<wicket:extend>
		<div wicket:id="main-area-container" class="aa">
			<div class="container-fluid">
				<div class="row">
					<div class="login-background d-block mt-0 col-12" style="overflow: auto;">
						<div class="login-layout">
							<div class="login-box-wrapper">
								<div class="form-container text-center">

									<div class="bcv-title mb-2">Biblioteca Corporativa Virtual</div>

									<div class="text-center mt-3 mb-3 pt-2 pb-2">
										<img wicket:id="logo" style="max-height: 42px;" />
									</div>

									<div class="text-center mt-2 mb-2" style="border-top: 1px solid #C5F4FF; color: #eeeeee;">
										<div class="mt-2 pt-2"><span wicket:id="title"></span></div>
									</div>

									<form wicket:id="form" class="text-center mt-1">
										<fieldset style="width: 100%;">
											<div class="text-center mb-2" style="color: #eeeeee;">
												<!-- wicket:message key="new-pwd-title" / -->
												<div class="mt-1"><b><span style="font-size:1.2em;" wicket:id="username"></span></b></div>
											</div>

											<div class="text-center mb-4" style="color: #eeeeee; font-size: 0.85em; ">
												<wicket:message key="pwd-characters" />
											</div>

											<div class="mb-2"><div wicket:id="password" tabindex="2"></div></div>

											<div class="mb-2"><div wicket:id="password-verification" tabindex="3"></div></div>

											<div wicket:id="feedback" class="alert alert-danger mt-2"></div>

											<div class="form-group text-center mt-2">
												<input wicket:id="submit" type="submit" name="submit" value="Save" class="btn btn-primary login" tabindex="4" />
											</div>
										</fieldset>
									</form>

									<div wicket:id="expired" class="alert alert-danger mt-2"></div>

									<div class="text-center mt-2 mb-2">
										<a class="text-light" href="/login"><span><wicket:message key="backtologin" /></span></a>
									</div>

								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</wicket:extend>

</body>

</html>
