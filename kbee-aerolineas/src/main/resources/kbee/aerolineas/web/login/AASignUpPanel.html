
<wicket:panel>

	<div wicket:id="box" class="container-fluid">

		<div class="row">
			<div class="text-bg-dark d-block mt-0 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12"
				style="position: relative; height: 100vh;">

				<div class="mt-0 w-100 ps-4 pe-4"
					style="position: absolute; top: 42%; left: 50%; transform: translate(-50%, -50%); display: inline-block; background: inherit;">

					<div wicket:id="logo-panel" />

					<div class="form-container">

						<form wicket:id="form" name="f" action="/j_spring_security_check" method="post"
							class="text-center text-lg-center text-md-center text-sm-center text-xl-center textl-xxl-center mt-4">


							<div class="row">
								<div class="text-center col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12 mb-4">
									<span wicket:id="forgotpassword-instructions" />
								</div>
							</div>

							<fieldset>
								<div class="row">
									<div class="text-center col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12 mb-4">
										<div wicket:id="username" />
									</div>
								</div>

								<div class="row">
									<div class="text-center col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12 mb-4">
										<div wicket:id="email" />
									</div>
								</div>

								<div wicket:id="feedback" />


								<div class="row">
									<div class="text-center col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12 mt-3 mb-2">
										<div class="form-group">
											<input wicket:id="submit" class="btn btn-primary fullw login loginmodal-submit" type="submit" name="send"
												value="send" />
										</div>
									</div>
								</div>

							</fieldset>
						</form>

						<div class="row">
							<div class="text-center col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12 mt-0 mb-2">
								<a class="text-light" href="/login"><span> <wicket:message key="login" />
								</span></a>
							</div>
						</div>

					</div>

				</div>
			</div>


		</div>
	</div>


</wicket:panel>
