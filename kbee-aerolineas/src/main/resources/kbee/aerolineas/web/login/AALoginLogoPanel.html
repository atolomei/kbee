<wicket:panel>

    <div wicket:id="logo-container" class="row">
        <div class="col-12"
             style="display:flex;
                    flex-direction:column;
                    align-items:center;
                    text-align:center;">

            <a wicket:id="logo-link"
               title="Aerolineas Argentinas BCV"
               href="https://aerolineas.com.ar/"
               style="display:block;">

                <img wicket:id="logo"
                     style="display:block;
                            background:none;
                            border-radius:6px;
                            max-width:132px;" />
            </a>

            <div style="display:block;
                        width:100%;
                        margin-top:8px;
                        text-align:center;">

                <span style="font-size:0.9em;
                             text-transform:uppercase;
                             font-weight:bold;
                             opacity:0.6;">
                    <wicket:message key="biblioteca-corporativa"/>
                </span>

            </div>

        </div>
    </div>

</wicket:panel>
