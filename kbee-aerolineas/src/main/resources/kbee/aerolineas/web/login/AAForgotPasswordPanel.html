

<wicket:panel>
	<div wicket:id="box" class="container-fluid">

		<div class="row">
			<div
				class="login-background d-block mt-0 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12"
				style="overflow: auto;">
				<div class="login-layout">

					<div class="login-box-wrapper">



						<div class="form-container">

							<form wicket:id="form" name="f" action="/j_spring_security_check"
								method="post"
								class="text-center text-lg-center text-md-center text-sm-center text-xl-center text-xxl-center mt-1">

								<fieldset style="float: left; width: 100%;">
									<div class="bcv-title mb-2">Biblioteca Corporativa Virtual</div>

									<div class="row">
										<div
											class="text-center mt-3 mb-3 pt-2 pb-2 col-lg-12 col-md-12 col-xs-12 col-sm-12">
											<img wicket:id="logo" style="max-height: 42px;" />
										</div>
									</div>

									<div class="row">
										<div
											class="text-center mt-4 mb-4 col-lg-12 col-md-12 col-xs-12 col-sm-12 ">
											<div
												style="border-top: 1px solid #C5F4FF; color: #eeeeee; font-weight: normal;">
												<div class="mt-4 pt-2 w-100"><span wicket:id="forgotpassword-instructions"></span></div>
											</div>
										</div>
									</div>

									<div class="row">
										<div
											class="text-center col-lg-12 col-md-12 col-xs-12 col-sm-12 mb-4">
											<div wicket:id="username"/>
										</div>
									</div>
									
									<div wicket:id="captcha"></div>

									<div class="row">
										<div
											class="text-center col-lg-12 col-md-12 col-xs-12 col-sm-12 mt-2 mb-0">
											<div class="form-group text-center">
												<input wicket:id="submit" class="btn btn-primary login  "
													type="submit" name="login" value="Ingresar" />
											</div>
										</div>
									</div>
		
									<div wicket:id="feedback" class="mt-2"/>


								</fieldset>
							</form>
							
														
						<div class="row">
							<div class="text-center col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12 mt-2 mb-2">
								<a class="text-light" href="/login"><span> <wicket:message key="login" />
								</span></a>
							</div>
						</div>
							
						</div>
					</div>
				</div>
			</div>
		</div>

	</div>

</wicket:panel>
