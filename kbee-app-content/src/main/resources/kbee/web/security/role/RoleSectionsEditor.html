<wicket:panel>

	<form wicket:id="form" class="form-container standard-canvas" role="form">
			<div class="row">
					<div class="col-md-2 col-lg-2 col-xs-12" style="float:right; text-align: right;" wicket:id="buttons"/>
					<div class=" col-md-10 col-lg-10 col-xs-10">
						<div class="row">	
							<h2 class=" col-md-12 col-lg-12 col-xs-12"><wicket:message key="access-sections"/>  </h2>
						</div>
						
						<div wicket:id="main-sections" style="margin:0 0 15px 0; float:left; width:100%;" />
						
						
					</div>
			</div>
			
		<div class="row">
		<div class="col-xs-12 col-lg-10 col-md-10">
			<div class="row">
					<a wicket:id="add-all-workflow" class="btn-link" style="padding-right:15px; font-size: 13px; float:right;"><wicket:message key="add-all" /></a>	
					<h3 class="col-lg-10 col-xs-10 col-md-10"> <wicket:message key="workflow" /> </h3>
					<div class="col-xs-12 form-group" wicket:id="workflow"/>
				
			</div>
			<div class="row">
				
					<a wicket:id="add-all-library" class="btn-link" style="padding-right:15px; font-size: 13px; float:right;"><wicket:message key="add-all" /></a>
					<h3 class="col-lg-10 col-xs-10 col-md-10"> <wicket:message key="content" /> </h3>
					<div class="col-xs-12 form-group" wicket:id="content"/>
				
			</div>
			<div class="row">
					<h3 class="col-lg-12 col-xs-12 col-md-12"><wicket:message key="settings" /></h3>
					<div class="col-xs-12 form-group" wicket:id="settings"/>
				
			</div>
			<div class="row">
					<h3 class="col-lg-12 col-xs-12 col-md-12"><wicket:message key="admin" /></h3>
					<div class="col-xs-12 form-group" wicket:id="admin"/>
				
			</div>
			<div class="row" wicket:id="factory-container">
				
					<h3 class="col-lg-12 col-xs-12 col-md-12"><wicket:message key="factory" /></h3>
					<div class="col-xs-12 form-group" wicket:id="kbee-admin"/>
				
			</div>
				</div>
		</div>
	</form>
	
</wicket:panel>
