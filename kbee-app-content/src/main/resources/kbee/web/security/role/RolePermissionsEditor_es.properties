

workflow-permissions = La tabla lista los <a href="/model" target="_blank" class="btn-link">Proceso de Trabajo</a> de cada <a href="/model/contentclasses" target="_blank" class="btn-link">Plantilla de Contenido</a> y los permisos específicos del Proceso (por ejemplo \
<i>'Aprobar'</i> un Contenido). <br /> Es posible que estos permisos de Proceso redefinan los permisos generales en el contexto de sus Tareas (por ejemplo el permiso general de "Edición" puede ser deshabilitado para un usuario en una Tarea de "Aprobación").<br/> \

 
content-permissions = Los permisos de Contenido aplican a las Areas de Trabajo de los usuarios ( <b><a href="/monitor" target="_blank">Monitor</a></b> ) \
y a la <b><a href="/content" target="_blank">Biblioteca</a></b>,  principalmente para Leer, Editar y Borrar Contenidos y agregarles Notas de Tarea. <br/> \
Algunos de estos permisos generales pueden ser redefinidos por los permisos específicos en cada Tarea (por ejemplo un usuario que tiene permiso de Editar un contenido dado puede no tener habilitada la Edición en una Tarea de Firma).



