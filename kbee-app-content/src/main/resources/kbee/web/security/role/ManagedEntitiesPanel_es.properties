managed-dataset-values=Elementos de DataSet Administrados
managedEntities=Elementos de DataSet
alert-text=Los Roles dinámicos como éste \
pueden otorgar permisos de administración de ciertos Elementos de DataSet.<br/> \
Es decir que Usuarios con el Rol <i>{0}</i> para un cierto Elemento del DataSet <i>E</i><br /> \
podrán editar los Elementos del DataSet seleccionado abajo que tengan como el Atributo <i>{0}( E )</i>. <br/>\
Este ejemplo ilustra la idea general: un usuario con Rol <i>Administrador de Propiedades</i> de la empresa <i>"Constructora Z"</i> puede editar todas\
las <i>Propiedades</i> (DataSet) que pertenecen a la <i>"Constructora Z"</i>. <br/>\ 
 

