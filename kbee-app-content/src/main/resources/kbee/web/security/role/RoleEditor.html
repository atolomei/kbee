<wicket:panel>
	<form wicket:id="form" class="form-container standard-canvas" role="form">
		<div class="row">
				<div class="col-md-2 col-lg-2 col-xs-12  button-container" wicket:id="buttons"/>
				<h2 class=" col-md-10 col-lg-10 col-xs-10"><wicket:message key="info" /></h2>
				<div class="col-lg-10 col-md-10 col-xs-12" style="padding:0;">
					<div class="col-lg-6 col-md-12 col-xs-12 form-group" wicket:id="name"/>
					<div class="col-lg-6 col-md-12 col-xs-12 form-group" wicket:id="roleclass"/>
					<div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="alias"/>
					<div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="administrator"/>
					<div class="col-lg-12 col-md-12 col-xs-12 form-group">
						<div style="margin-bottom:15px; float:left; width:100%;" wicket:id="classifier" />
						<a class="btn-link" wicket:id="members" href="#"> <wicket:message key="open-datasetmembers" /></a>
					</div>
					<div class="col-lg-12 col-md-12 col-xs-12 form-group rule-condition" wicket:id="condition-editor"/>
					<div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="apiEnabled"/>
					<div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="isDefault"/>
 					<div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="description"/>
 					<div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="principalNameTemplate"/>
				</div>
		</div>
	</form>
</wicket:panel>
