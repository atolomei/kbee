<wicket:panel>
	<form wicket:id="form"  style="padding-top:30px; padding-bottom:30px;" class="col-md-12 col-lg-12 col-xs-12 side-form form-container" role="form">
		<div class="row">
			<div class="col-xs-12 col-md-6 col-lg-2 form-group" wicket:id="firstName"/>
			<div class="col-xs-12 col-md-6 col-lg-2 form-group" wicket:id="lastName"/>
			<div class="col-xs-12 col-md-6 col-lg-3 form-group" wicket:id="userName"/>
			<div class="col-xs-12 col-md-6 col-lg-2 form-group" wicket:id="email"/>
			<!-- 
			<div class="col-xs-12 col-md-6 col-lg-1 form-group" wicket:id="userId"/>
			-->
			<div class="col-xs-12 col-md-6 col-lg-1 form-group" wicket:id="buttons"/>
			<a wicket:id="clear-all" href="#" class="btn btn-link" style="border-color:transparent; font-size: 13px; float:right;" > <wicket:message key="clear-all"/></a>
		</div>
	</form>
</wicket:panel>
