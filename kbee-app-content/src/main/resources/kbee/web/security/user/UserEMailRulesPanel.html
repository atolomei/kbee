<wicket:panel>
		<div class="standard-canvas">
			<div class="row">
				<h2  class="col-md-12 col-lg-12 col-xs-12"><wicket:message key="my-email-alerts"/></h2>
			</div>

		<form wicket:id="form" class="form-container" role="form" style="margin:0; float:left;">
			<div class="panel panel-bordered" style="width:100%; float:left;">
				<div class="row">
					<h3  class="col-md-10 col-lg-10 col-xs-12"><wicket:message key="my-alerts-settings"/> </h3>
					<div class="button-container col-md-4 col-lg-2 col-xs-12" style="margin-top:0;" wicket:id="buttons"/>
				</div>

				<div class="row">
					<div class="col-lg-12 col-md-12 col-xs 12">
						<div class="row">
								<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="emailNotifications"/>
								<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="emailPendingNotifications"/>
								<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="emailRuleNotifications"/>
								<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="alertRuleNotification" style="margin-top:-20px;"/>
								<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="emailProgressNoteNotification"/>
								<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="alertProgressNoteNotification" style="margin-top:-20px;"/>
						</div>
					</div>
				</div>
			
				<div class="row">
					<div class="col-lg-12 col-md-12 col-xs 12">
						<div class="alsssert alesssrt-info" style="margin:10px 0px;">
							<h3><wicket:message key="channels" /></h3>
						</div>
					</div>
					<div class="col-lg-12 col-md-12 col-xs 12">
						<div class="row">
							<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="whatsAppEnabled"/>
						</div>
					</div>
				</div>
			</div>
		</form>

			<div class="panel panel-bordered" style="width:100%; float:left;">
				<div class="row">
						<h3  class="col-md-8 col-lg-10 col-xs-12"><wicket:message key="email-rules"/> </h3>
					
						<div class="button-container col-lg-2 col-xs-12 col-md-4" style="margin-top:0;">
							<a wicket:id="add-button" type="submit" class="btn btn-default btn-sm"><wicket:message key="add-label"/></a>
						</div>
				</div>

				<div class="row">
					<div class="col-lg-12 col-md-12 col-xs 12">
						<div class="alsssert alesssrt-info" style="margin:20px 0px;">
							<wicket:message key="alert-note" />
						</div>
					</div>
					<div class="col-lg-12 col-md-12 col-xs 12">
						<ul  class="list-group" style="width:100%;"  wicket:id="rules-container">
							<li class="list-group-item" wicket:id="rules">
								<a wicket:id="rule-link"><span class="list-group-item-heading" wicket:id="rule-label">[]</span></a>
								<a><i class="far fa-times" style="float:right; top: 6px; cursor:pointer;" title="remove" alt="remove" wicket:id="remove-link"></i></a>
							</li>
						</ul>
					</div>
				</div>
			</div>
			
			<div class="panel panel-bordered" style="width:100%; float:left;">
					<div class="row">
						<h3  class="col-md-12 col-lg-12 col-xs-12"><wicket:message key="my-subscriptions"/> </h3>
					</div>
					<div class="row">
						<div class="col-lg-12 col-md-12 cwwol-xs 12 mb20">
								<wicket:message key="subscriptions-message" />
						</div>
					</div>
					<div class="row">
						<div class="col-lg-12 col-md-12 col-xs 12" wicket:id="subscriptions"/>
					</div>
					 
			</div>
	</div>
	
	<div wicket:id="remove-dialog" class="modal" tabindex="-1" role="dialog"/>
	
</wicket:panel>
