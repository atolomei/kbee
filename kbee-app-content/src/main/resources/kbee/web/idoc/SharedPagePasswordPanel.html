<wicket:panel>

	
	<form wicket:id="form" class="form-container"   style="width:100%;  float: left;" role="form">
				<div style="margin-bottom:15px; margin-top: 15px; float:left; width:100%; padding:0 15px;" wicket:id="alert-text" />
				<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="password"/>
				
				<div class="col-xs-12 col-lg-12 col-md-12 form-group">
					
					<a class="btn btn-md btn-default" wicket:id="apply">
						<wicket:message key="apply" />
					</a>
					
					<span style="width:100%; float:left; margin-top:5px; clear:left;" class="danger" wicket:id="error" />
					
				</div>
	</form>
				

</wicket:panel>
