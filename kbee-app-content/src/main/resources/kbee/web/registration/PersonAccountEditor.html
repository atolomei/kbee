<wicket:panel>
	<div class="row standard-canvas">
		<form wicket:id="form" class="form-container col-md-9 col-lg-9 col-xs-12" role="form">
			<div class="row panel">
				<div class="col-lg-12 col-xs-12 col-md-12 panel">
					<div class="row">
						<h2 class="col-lg-12 col-xs-12 col-md-12"><wicket:message key="account.label" /></h2>
						<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="name"/>
						<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="surname"/>
						<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="email"/>
						<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="organization"/>
						<h2 class="col-lg-12 col-xs-12 col-md-12"><wicket:message key="auth.label" /></h2>
						<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="googleAuth"/>
						<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="facebookAuth"/>
						<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="password1"/>
						<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="password2"/>
					</div>	
				</div>
			</div>						
		</form>
		<div style="text-align: center;" class="col-xs-12 form-group">
			<button wicket:id="submit" type="submit" class="btn btn-primary btn-lg">
				<wicket:message key="button.submit " />
			</button>
		</div>	
	</div>
</wicket:panel>
