<wicket:panel>

	<div class="row">
		<div class="col-lg-12 col-md-12 col-xs-12 form-group">
		<h2> <wicket:message key="workflow-roles" /></h2>
		<table style="width:100%;" class="table">
			<tbody>
				<tr class="row" wicket:id="roles">
					<td class="col-lg-3 col-md-5 col-xs-5">
						<span class="label" wicket:id="role">[Role]</span>
					</td>
					<td class="col-lg-9 col-md-7 col-xs-7">
						<ul>
							<li wicket:id="user">
								<span wicket:id="name">[name]</span>
							</li>	
							<li wicket:id="provided-user">
								<span wicket:id="name">[name]</span>
								<span class="ago" wicket:id="legend">[]</span>
							</li>
							<li wicket:id="provided-group">
								<a wicket:id="link" target="_blank"><span wicket:id="name">[name]</span></a>
								<span class="ago" wicket:id="legend">[]</span>
							</li>
						</ul>
					</td>
				</tr>
			</tbody>
		</table>
		</div>
	</div>

</wicket:panel>
