<wicket:panel>

<div class="infopanel" style="width:auto; float:left; margin-left:32px; margin-top: 1.5em; max-height: 600px;">

	<ul style="width:90%; float:left; margin-bottom:32px; padding:0; margin-top: 0; font-size: 1em;">

		<li style="width:100%; float:left; margin-bottom:6px;" wicket:id="info">			
				<span class="label" style="float:left;"  wicket:id="label"></span>
				<span class="value" style="margin-left:4px;" wicket:id="value"></span>
		</li>	
	</ul>
	
 </div>
	
</wicket:panel>
