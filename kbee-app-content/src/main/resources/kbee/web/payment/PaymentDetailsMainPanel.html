<wicket:panel>
    <div class="detail">
        <div class="row" style="padding-left: 15px">
            <div class="col-lg-5" >
                <div class="section ">
                    <div class="section-header">
                        <h2>
                            <wicket:message key="paymentDetails"/>
                        </h2>
                    </div>

                    <table style="border-radius: 0 0 4px 4px;  width:100%; border: 1px solid #d8dcdf; border-top:none;" class="section-body">
                        <tbody>
                        <tr style="line-height: 25px; width:100%;" class="row" wicket:id="paymentAttributes">
                            <wicket:container wicket:id="row"/>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</wicket:panel>
