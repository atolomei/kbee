<wicket:panel>
	
<div class="standard-canvas">
	<div class="row">
		<h2 class="col-md-9 col-lg-9 col-xs-12">Info</h2>
		<div class="button-container col-md-3 col-lg-2 col-xs-12" wicket:id="buttons"/>
	</div>
	
	<div class="row">
		<div class="col-lg-9 col-md-9 col-xs-12">
			
			<form wicket:id="form" class="form-container" role="form">
	
				<div wicket:id="iscanonical" class="form-group alert alert-info" role="alert"> <wicket:message key="iscanonical" /></div>
			
				<div class="row">
					<div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="displayName"/>
					<div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="key"/>
				</div>
				
				<div class="row">
					<div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="description"/>
				</div>
				
				<div class="row">
					<div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="statement"/>
				</div>
				
				<div class="row">
					<div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="readOnly"/>
					<div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="listOrder"/>
					<div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="page"/>
					</div>
				
				<div class="row">
					<div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="id"/>
				</div>
				
				<div class="row">
					<div class="col-lg-12 col-md-12 col-xs-12 form-group">
						<a  wicket:id="portal" target="_blank" href="#" class="btn-link"> <wicket:message key="open-portal"/></a>
					</div>
				</div>
			 
			
				
				
			</form>
		</div>
	</div>
</div>

<div wicket:id="help-modal" class="modal window" z-index=999999 tabindex="-6" role="dialog"/>

</wicket:panel>
