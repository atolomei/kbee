
<wicket:panel>

		<div class="canvas" style="max-width:1024px;">
			<div wicket:id="work-note-header-panel"></div>
			<form wicket:id="form" class="form-editor-container col-lg-12 col-md-12 col-xs-12" style="margin-bottom:42px;">
				<div class="row">	
					<div style="tabindex: 10;" class="form-group col-lg-12 col-md-12 col-xs-12"  wicket:id="title" />
					<div style="tabindex: 15;" class="form-group col-lg-12 col-md-12 col-xs-12"  wicket:id="text" />
					<div style="tabindex: 25;" class="form-group col-lg-12 col-md-12 col-xs-12"  wicket:id="receivers" />
				</div>
				<div class="form-group alert alert-info"> <wicket:message key="tenminutes" /></div>
				<div style="tabindex: 20;" class="form-group col-lg-12 col-md-12 col-xs-12"    wicket:id="buttons"/>
			</form>
		</div>
		
		

</wicket:panel>
