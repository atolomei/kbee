<wicket:panel>

	
	

		<div class="row">
			<h2 class="col-md-8 col-lg-8 col-xs-12">
				<wicket:message key="editor.rule" />
			</h2>
			<div class="button-container col-md-4 col-lg-4 col-xs-12" wicket:id="buttons" />
		</div>
			  
		<div style="float:left; width:100%; margin:15px 0;"  wicket:id="email" />
				
			<div class="row">				
				<form wicket:id="form" role="form" class= "form-container col-xs-12 col-lg-12 col-md-12" style="padding:0;" >
					
					<div class="col-xs-12 col-lg-12 col-md-12 form-group"	wicket:id="name" />
					
					<div class="col-lg-12 col-xs-12 col-md-12 panel">
						<div class="row">
							<h2 class="col-lg-12 col-xs-12 col-md-12"><wicket:message key="condition-label"/></h2>
							<div class="col-xs-12 col-lg-12 col-md-12 form-group rule-condition" wicket:id="condition-editor" />
						</div>
					</div>		
					
					<div class="col-lg-12 col-xs-12 col-md-12 panel">
						<div class="row">
							<h2 class="col-lg-12 col-xs-12 col-md-12"><wicket:message key="events"/></h2>
							
							<div class="panel panel-bordered" style="width:100%; float:left;">
							<span class="col-xs-12 col-lg-12 col-md-12" style="margin-bottom:1em;">
								<wicket:message key="events.help"/>
							</span>
							<div class="col-xs-12 col-lg-12 col-md-12" style="margin-bottom:1em;"	wicket:id="publishEvent" />
							<div class="col-xs-12 col-lg-12 col-md-12" style="margin-bottom:1em;" wicket:id="progressNoteEvent" />
							<div class="col-xs-12 col-lg-12 col-md-12" wicket:id="taskStartEvent" />
							</div>
							
							
								
						</div>
					</div>

					<!-- div class="col-lg-12 col-xs-12 col-md-12 panel">
						<div class="row">
							<h2 class="col-lg-12 col-xs-12 col-md-12">ACUSE DE RECIBO</h2>
							<div class="panel panel-bordered" style="width:100%; float:left;">
								<div class="col-xs-12 col-lg-12 col-md-12" style="margin-bottom:1em;"	wicket:id="requireConfirm" />
							</div>
						</div>
					</div -->


					
					<div class="col-lg-12 col-xs-12 col-md-12 panel"  wicket:id="receivers-containers">
						<div class="row">
							<h2 class="col-lg-12 col-xs-12 col-md-12"><wicket:message key="receivers"/></h2>
							<div class="col-xs-12 col-lg-12 col-md-12" wicket:id="receivers" style="margin-bottom: 30px;"/>
							<div class="col-xs-12 col-lg-12 col-md-12" wicket:id="roleReceivers" />
						</div>
					</div>
					
					<div class="col-lg-12 col-xs-12 col-md-12 panel"  wicket:id="type-containers">
						<div class="row">
							<h2 class="col-lg-12 col-xs-12 col-md-12"><wicket:message key="rule-type"/></h2>
							<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="isemail" style="margin-bottom:15px;"/>
							<div class="col-xs-12 col-lg-12 col-md-12 form-group">
								<a href="#" class="btn-link" wicket:id="send-test-email"><wicket:message key="send-test-email" /></a>
							</div>
							<div class="col-xs-12 col-lg-12 col-md-12 form-group"	wicket:id="isalert" />
						</div>	
					</div>
				</form>
			
	</div>
				
					
					
	
	
	

</wicket:panel>
