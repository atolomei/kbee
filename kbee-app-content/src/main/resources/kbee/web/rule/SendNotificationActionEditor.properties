
type = Send Alert

property.type = Action
type.help=What to do when a File meet the Condition


property.role = Role
#role.help = <b>General Roles</b>. all users that have the Role will receive the alert. <b>Dynamic Roles</b>. Users that have the Role with the dynamic value equal to the File's tag will receive the alert. Example: If the selected Role is <i>Property Manager</i>, when the condition evaluates true on a File that has tag <i>Property = River Creek</i>, then an alert will be sent to Users with Role <i>Property Manager(River Creek)</i>
action.help=Alert includes email and internal notification
 
