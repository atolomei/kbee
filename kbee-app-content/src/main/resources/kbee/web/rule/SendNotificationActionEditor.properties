subject.help = Subtitle in the email

#subject.help = Email and internal alerts (on the bell) will be generated using the Email Template: <a target="_blank" class="btn-link" href="/emailtemplates/{0}/{1}">Time Dependent Rule Template</a> with this subtitle. 

property.text = Text in the alert
text.help = Body of the Alert
#text.help = Email and internal alerts (on the bell) will be generated using the Email Template: <a target="_blank" class="btn-link" href="/emailtemplates/{0}/{1}">Time Dependent Rule Template</a> with this text included.  

