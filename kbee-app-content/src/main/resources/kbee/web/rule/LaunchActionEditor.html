<wicket:panel>
	<div class="panel panel-bordered">
		<h3 style="padding-bottom: 10px;"> <wicket:message key="type" /></h3>
		
		<div class="row">
			<!-- div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="type"/-->
			<div class="col-lg-12 col-md-12 col-xs-12 form-group">
				<div style="width:100%; float:left;" wicket:id="launcher" />
				<div class="help-container" style="width:100%; float:left; margin-top:10px;">
					<span><wicket:message key="triggers-msg"/><a class="btn-link" wicket:id="launcher-link"  target="_blank"><wicket:message key="launcher-link.message"/></a></span>
				</div>
			</div>
			<div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="note"/>
			
			
			<div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="set-attributes"/>
			
			
		</div>
		<div class="row">
			<div class="col-lg-12 col-md-12 col-xs-12">	
				<div class="help-container" style="float:left; width:100%;">
					<a class="btn-link" wicket:id="test-link"><wicket:message key="test-link.message"/></a>
					<span style="width:100%; float:left; margin-top:15px;" wicket:id="feedback">[]</span>
				</div>
			</div>
		</div>
	</div>
</wicket:panel>
