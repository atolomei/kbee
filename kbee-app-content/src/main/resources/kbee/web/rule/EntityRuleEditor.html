<wicket:panel>
	<div class="row">
		<form wicket:id="form" class="form-container col-lg-8 col-md-9 col-xs-12" role="form">
			<div class="row">
				<h2 class="col-lg-12 col-md-12 col-xs-12"><span><wicket:message key="recurrent-rule" /></span></h2>
			</div>

			<div style=" float:left;  width:100%; margin-bottom:15px;" wicket:id ="alert-info"  />
				
			<!-- div class="row">
				<div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="entity"/>
			</div--> 
			
			<div class="row">
				<div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="name"/>
				<div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="condition"/>
				<div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="calendar"/>
			</div>
			
			<div class="row">
				<h2 class="col-lg-12 col-xs-12 col-md-12"><wicket:message key="actions" /></h2>
				<div class="col-lg-12 col-xs-12 col-md-12" style="margin-bottom:15px" wicket:id="new-action"/>
			</div>
			
			<div wicket:id="actions">
				<div wicket:id="action" style="padding-bottom: 10px;">
					<div class="dropdown" style="float: right; padding-right: 10px;">
						<a class="btn btn-mini" id="dmenu" data-toggle="dropdown" wicket:id="menulink"><i class="far fa-ellipsis-h" aria-hidden="true"></i></a>
						<ul wicket:id="menu" class="dropdown-menu dropdown-menu-right" aria-labelledby="dmenu" />
					</div>
					<div wicket:id="editor"/>
				</div>
				<div wicket:id="alert"/>
			</div>
		</form>
		<div class="button-container col-md-3 col-lg-3 col-xs-12" wicket:id="buttons"/>
	</div>
</wicket:panel>
