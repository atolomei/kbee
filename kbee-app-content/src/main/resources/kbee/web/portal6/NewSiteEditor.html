<wicket:panel>

			<div class="console-page-header internal-page-header page-header">
				
				<h1> <wicket:message key="newsite"/></h1>
				
				<div wicket:id="breadcrumb" />
				
				<!-- div class="breadcrumb" >
        			<div style="float:left; clear:left;">
                		<a href="/sites"><span>Sites</span></a>
            			<span class ="separator"> / </span>
            			<span><strong><span>External Site</span></strong></span>
            		</div>
        		</div -->
        		
        		
			</div>

			
		<section class="browser">
			<div class="container" style="margin:auto;">
					<div class="col-xs-12 col-md-12 col-lg-12" style="margin-top:72px; margin-bottom: 92px;">
						<div class="row">
							<form wicket:id="form" class="col-md-12 col-lg-12 col-xs-12 " role="form">
								<fieldset style="margin-bottom:12px;">
									<div class="row">
										<div class="col-xs-12 col-md-12 col-lg-12 form-group" wicket:id="title"/>
										<!-- div class="col-xs-12 col-lg-6 col-md-6 form-group" wicket:id="sitetype" /-->
										<div class="col-xs-12 col-md-12 col-lg-12 form-group" wicket:id="url"/>
										
									</div>
									<div class="row">
										<div class="col-xs-12 col-md-12 col-lg-12 form-group" wicket:id="subtitle"/>
									</div>
									<div class="row">
										<div class="col-xs-12 col-md-12 col-lg-12 form-group" wicket:id="description"/>
									</div>
								</fieldset>
							</form>
						</div>
						
						<div class="row">
							<div class="col-md-12 col-lg-12 col-xs-12" wicket:id="buttons"/>
						</div>
													
						<div class="row">											
							<div class="col-md-12 col-lg-12 col-xs-12" wicket:id="feedback-container">
								<div class="alert alert-success" role="alert">
								  <wicket:message key="newsite.message.sucess"/>
								</div>
								<div class="row">
									<div class="col-lg-12 col-xs-12 col-md-12">
										<div class="row">
											<h2 class="col-lg-12 col-xs-12 col-md-12" style="margin-top:24px; margin-bottom: 18px;"><wicket:message key="newsite.action.label"/></h2>
										</div>
										<div class="row">
											<div class="col-lg-12 col-xs-12 col-md-12" style="margin-bottom: 120px;">
												<div style="width: auto;"><a class="btn btn-default btn-lg" style="margin-left:0px;" wicket:id="create-link"><wicket:message key="newsite.action.create"/></a></div>
												<div  style="width: auto;"><a class="btn btn-link" style="margin: 18px 0; padding-left:0;" target="_blank" wicket:id="open-link"><wicket:message key="newsite.action.open"/></a></div>
											</div>
										</div>
									</div>
									
								</div>
							</div>
						</div>
					</div>
			</div>
		</section>
		
			

</wicket:panel>
