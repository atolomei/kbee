
<wicket:panel>
			<div class="toolbar" style="width:100%; float:left;">


					<a wicket:id="title-link" class="btn-link">
						<h2 wicket:id="title" style="float:left; margin:0;"></h2>
					</a>


		
			<select wicket:id="library" style="
									float: left;
								    font-size: 15px;
								    margin-top: 0px;
								    border-color: transparent;
								    border-radius: 0px;
								    padding: 5px 5px 0px 0;
								    margin-bottom: 0px;
								    margin-left: 0px;
								    text-transform: uppercase;
								    font-weight: bold;
								    color: #0d5072;
								    background: transparent;
								    max-width:100%;"></select>
				<div style="float:right;">

					
				<ul class="list-group" style="float:right;">
					
					
					
					<li wicket:id="menu-container" class="list-group-item">				
						<a class="btn-mini" id="dmenu" data-toggle="dropdown">
							<i class="far fa-cog" aria-hidden="true" />
						</a>
						<ul wicket:id="menu" class="dropdown-menu dropdown-menu-right" aria-labelledby="dmenu" />
					</li>
					
					
					<!-- li class="list-group-item">				
						<a class="btn-mini" wicket:id="view" title="view" href="#">
							<i class="fa-duotone fa-diagram-cells"></i>
						</a>
					</li-->
					
					
					<li class="list-group-item">				
						<a class="btn-mini" wicket:id="edit" title="edit" href="#">
							<i class="far fa-edit"></i>
						</a>
					</li>
					<li class="list-group-item">
						<a class="btn-mini" wicket:id="help" title="help" href="#">
							<i class="fal fa-info-circle"></i>
						</a>
					</li>
					<li class="list-group-item">
						<a class="btn-mini" wicket:id="refresh" title="Refresh" href="#">
							<i class="far fa-sync "></i>
						</a>
					</li>
					<li class="list-group-item">
						<a class="btn-mini" wicket:id="collapse" title="Collapse" href="#">
							<span class="expand" wicket:id="expand-label"></span>
							<i wicket:id="collapse-icon" class="far fa-angle-up"></i>
						</a>
					</li>
				</ul>
					
				</div>
				
				
				</div>
					
</wicket:panel>
