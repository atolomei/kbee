

<wicket:panel>

	<div class="dashboard-widget" style="width:100%; float:left;">

		<div class="header" style="float:left;" wicket:id="header"></div>
		
		<div class="widget-body-container">
		
			<div  wicket:id="main-container" style="width:100%; float:left;" >
				
				<div wicket:id="filters"></div>
				
				<ul wicket:id="list-container" class="list-group-items" style="overflow-y: auto;min-height: 400px;max-height: 400px;width:100%;">
				
					<li class="list-item" wicket:id="notification" style=" margin-bottom: 20px; float:left; width:100%;">
						
						<div style="float:left; padding-right: 15px; width:55px;">
							<div class="dropdown" wicket:id="menu-container">
								<a id="dmenu" style="width:32px; height:30px; margin-top:-4px; position:relative; float:left;" data-toggle="dropdown">
									<i class="far fa-ellipsis-h panel-centered" aria-hidden="true" style="float: left; position:absolute;"></i>
								</a>
								<ul wicket:id="menu" class="dropdown-menu dropdown-menu-right" aria-labelledby="dmenu" />
							</div>
							
							<div wicket:id="unread" style="position:relative;display:inline-block; height:24px; width:32px;">
								<i class="fa fa-square panel-centered" title="unread" style="margin-left:0px;"></i>
							</div>
						</div>
						
						<div style="float:left; width:calc( 100% - 55px);">
							
							<div>
								<!-- i wicket:id="glyphicon" style="padding-right:5px;"/-->
								<span wicket:id="type" class="highlight" style="font-size: 12px;   text-transform: uppercase;"></span>
							</div>
							
							
							<div style="width:100%; float:left;">
								<a wicket:id="link">
									<span wicket:id="title">[title]</span>
								</a> 
							</div>
							<div style="float:left; width:100%; padding-right:15px;">
								<div wicket:id="text" ></div>
							</div>
							<div style="float:left; width:100%;">
								<span wicket:id="user"></span>
								<span style="padding:0;">.</span>
								<span wicket:id="date" />
							</div>
						</div>
					</li>
				</ul>
				<div wicket:id="navigation" style="float: left;width: 100%;padding-top: 5px;"></div>
				<div style="width:100%; float:left;" wicket:id="help" />
			</div>
			<div wicket:id="base-bottom" style="width:100%; float:left;"/>
			<div wicket:id="base-alert" style="width:100%; float:left;"/>
		</div>
	</div> 
</wicket:panel>


<wicket:fragment wicket:id="base-header-fragment">
		
			<div class="toolbar" style="width:100%; float:left;">
				
					<a wicket:id="title-link" class="btn-link">
						<h2 wicket:id="title" style="float:left;padding-top:7px;  margin:0;"></h2>
					</a>
				
				<ul class="list-group" style="float:right;">
					
					<li wicket:id="menu-container" class="list-group-item">				
						<a class="btn-mini" id="dmenu" data-toggle="dropdown">
							<i class="far fa-cog" aria-hidden="true" />
						</a>
						<ul wicket:id="menu" class="dropdown-menu dropdown-menu-right" aria-labelledby="dmenu" />
					</li>
					
					
					<!-- li class="list-group-item">				
						<a class="btn-mini" wicket:id="view" title="view" href="#">
							<i class="fa-duotone fa-diagram-cells"></i>
						</a>
					</li-->
					
					<li class="list-group-item">				
						<a class="btn-mini" wicket:id="edit" title="edit" href="#">
							<i class="far fa-edit"></i>
						</a>
					</li>
					<li class="list-group-item">
						<a class="btn-mini" wicket:id="help" title="help" href="#">
							<i class="fal fa-info-circle"></i>
						</a>
					</li>
					<li class="list-group-item">
						<a class="btn-mini" wicket:id="refresh" title="Refresh" href="#">
							<i class="far fa-sync "></i>
						</a>
					</li>
					<li class="list-group-item">
						
						<a class="btn-mini" wicket:id="collapse" title="Collapse" href="#">
							<span class="expand" wicket:id="expand-label"></span>
							<i wicket:id="collapse-icon" class="far fa-angle-up"></i>
						</a>
					</li>
				</ul>
			</div>			
</wicket:fragment>			


 



					
<wicket:fragment wicket:id="filters-fragment">
	
	<div class="toolbar" style="float:left;padding-bottom: 10px; width:100%;">
		<a class="btn-mini" wicket:id="all">
			<span><wicket:message key="all-filter"/></span>
		</a>
		<a class="btn-mini" wicket:id="workflow">
			<span><wicket:message key="workflow-filter"/></span>
		</a>
		<a class="btn-mini" wicket:id="publications">
			<span><wicket:message key="publications-filter"/></span>
		</a>
		<a style="float:right" class="btn-mini" wicket:id="unreads">
			<span><wicket:message key="unreads-filter"/></span>
		</a>
	</div>	
</wicket:fragment>

<wicket:fragment wicket:id="navigation-fragment">
	<div style="float:left;">
		<a class="btn-mini" wicket:id="previous-page-link">
			<i style="font-size: 15px;" class="far fa-chevron-left"></i>
		</a>
		<a class="btn-mini" wicket:id="next-page-link">
			<i style="font-size: 15px;" class="far fa-chevron-right"></i>
		</a>
	</div>
	<div style="float:right; padding-top:10px; padding-right:5px;">
		<span>Total</span>
		<b><span wicket:id="total">[]</span></b>
	</div>
</wicket:fragment>
