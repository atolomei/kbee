
<wicket:panel>
			<div style="width:100%; float:left;">
				<h2 wicket:id="title" style="float:left; margin:0;"></h2>
			</div>
			
			<select wicket:id="item" style="max-width: 12em; background:none; float: left;font-size:15px;margin-top: 0px;
			border-color: transparent;border-radius: 0px;padding: 0px 5px 0px 0;margin-bottom: 0px;margin-left: 0px;text-transform: uppercase;font-weight: bold;
			color: #0d5072;  "></select>
			
			<div>
				
				<div style="float:right;">
					<a class="btn-mini" wicket:id="edit" title="edit" href="#">
						<i class="far fa-edit"></i>
					</a>
					<a class="btn-mini" wicket:id="help" title="help" href="#">
						<i class="fal fa-info-circle"></i>
					</a>
					<a class="btn-mini" wicket:id="refresh" title="Refresh" href="#">
						<i class="far fa-sync "></i>
					</a>
				</div>
			</div>			
</wicket:panel>
