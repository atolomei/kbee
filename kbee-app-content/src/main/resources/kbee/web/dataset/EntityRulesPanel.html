<wicket:head>
	<style>
		.dropdown-custom {transform: translate(-30px, 15px) !important;	}
	</style>
</wicket:head>

<wicket:panel>

<div class="standard-canvas">
		
	<div class="row">
		<h2 class="col-md-12 col-lg-10 col-xs-12"> <wicket:message key="rules"/></h2>
		<div class="col-lg-2" style="margin-top: 0px; margin-bottom: 15px;">
			<div id="navbar" class="col-lg-12 col-xs-12 col-md-12 toleft toright" style="padding:0;">
				<a class="btn btn-primary btn-sm" wicket:id="new-button" style="margin-left: 0px;  padding:0; float:right;">
					<span><wicket:message key="newrule.button"/></span>
				</a>
			</div>
		</div>
	</div>
	
	
		<div class="row" style="margin:0;">
			
			<div class="tablsse">	
			<table class="table-responsive table table-bordered table-header-bck  table-hover" id="tasks" style="line-height: 1.5em;">
				<thead>
					<tr class="headers">
						<th class="col-xs-2 col-md-3 col-lg-3"><span> <wicket:message key="rule.label" /></span></th>
						<th class="col-xs-2 col-md-2 col-lg-2"><span style="text-align: center;width: 100%; display:inline-block "><wicket:message key="lastexecution.label" /></span></th>
						<th class="col-xs-2 col-md-2 col-lg-2"><span style="text-align: center;width: 100%; display:inline-block"><wicket:message key="nextexecution.label" /></span></th>
						<th class="col-xs-1 col-md-1 col-lg-1"><span> <wicket:message key="status.label" /></span></th>
						<th class="col-xs-1 col-md-2 col-lg-2"><span> <wicket:message key="modified.label" /></span></th>
						<th class="col-xs-1 col-md-1 col-lg-1"><span></span></th>
					</tr>
				</thead>
				<tbody>
					<tr wicket:id="rule">
						<td class="col-xs-2 col-md-3 col-lg-3">
							<div>
								<a wicket:id="rule-link"><span wicket:id="label"></span></a>
							</div>
						</td>
						<td class="col-xs-2 col-md-2 col-lg-2"><div wicket:id="lastexecution" style="text-align: center;width: 100%;"></div></td>
						<td class="col-xs-2 col-md-2 col-lg-2"><div wicket:id="nextexecution" style="text-align: center;width: 100%;"></div></td>
						<td class="col-xs-1 col-md-1 col-lg-1 "><div wicket:id="status"></div></td>
						<td class="col-xs-1 col-md-2 col-lg-2"><div wicket:id="modified"></div></td>
						<td class="col-xs-1 col-md-1 col-lg-1">
							<div class="dropdown" style="text-align: center;width: 100%;">
								<a id="dmenu" data-toggle="dropdown" class="dropdown-toggle"> <i class="far fa-ellipsis-h" aria-hidden="true"></i></a>
								<ul wicket:id="menu" class="dropdown-menu dropdown-custom" aria-labelledby="dmenu"/>
							</div>
						</td>
					</tr>
				</tbody>
			</table>
			</div>
		</div>
	
	<div wicket:id="confirmation-dialog" class="modal window" tabindex="-20" role="dialog"/>
</div>
	
</wicket:panel>
