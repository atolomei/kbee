<wicket:panel>

	<div class="standard-canvas">
		
		<div class="row">	
			<div class="col-lg-12 col-md-12 col-xs-12">	
				<h2><span wicket:id="dataset">[]</span></h2>
			</div>
		</div>
			
		
		<div class="row">
			<div class="col-lg-10 col-md-10 col-xs-12">
			
				<div class="alert alert-info">
					<span> <wicket:message key="contacts" /> </span>
				</div>	
				
				
				<div class="eform" style="width:100%; float:left;" wicket:id="viewer"/>
					
				<div class="row" style="margin:0;">	
					<a class="btn-link" style="text-decoration: underline;" wicket:id="addlink"><span wicket:id="label">[]</span></a>
					<a class="btn-link" style="text-decoration: underline;" wicket:id="gotolink"><span wicket:id="label">[]</span></a>
				</div>
			</div>
		</div>
		
	</div>	
	

</wicket:panel>
