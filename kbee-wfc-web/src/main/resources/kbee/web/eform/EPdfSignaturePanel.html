
<wicket:panel>
	<div class="kbee-eform-viewer" style="float: left; width: 100%; margin-top: 120px;">
		<div class="signature-block">
			<div class="signed-data-container" style=" float:left; width:100%;">                     
				<div class="signed-data" style=" float:left; width:100%;" >
					<div class="signed-data-user">

						<!-- div wicket:id="icon-container" class="signature-icon-contaniner">
							<i class="fa-duotone fa-signature-lock"></i>
						</div-->
						
						<div wicket:id="image-container" class="signature-image-contaniner" style="height:auto; padding-top:5px;">
							<img wicket:id="image" style="margin:0 auto; max-height:100px !important; max-width:100% !important; "/>
						</div>
						
						<div class="signed-data-user-text" wicket:id="data-container">
							<wicket:message key="signed-by"/>: <span wicket:id="person-name"></span> <br/>
							<wicket:message key="date"/>: <span wicket:id="date"></span><br/>
							<span wicket:id="person-identityType"></span> <span wicket:id="person-identityDocument"></span>
				         </div>
					</div>
				</div>
			</div> 
    	</div>
	</div>
</wicket:panel>
