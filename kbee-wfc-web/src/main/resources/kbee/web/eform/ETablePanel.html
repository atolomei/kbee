<wicket:panel>
	<div class="row" wicket:id="container">
		<div class="col-xs-12 col-lg-12 col-md-12 form-group">
			<div class="control-label">
				<label for="label" wicket:id="label"></label>
			</div>
			<div class="control">
				<table class="table table-striped table-bordered table-hover col-xs-12 col-lg-12 col-md-12">
					<thead>
						<tr class="headers">
							<th wicket:id="column" class="col-xs-6 col-lg-6 col-md-6">
								<span wicket:id="title">[]</span>
							</th>
							<th style="width:100px;"/>
						</tr>
					</thead>
					<tbody>
						<tr wicket:id="row" >
							<wicket:container wicket:id="panel"/>
						</tr>
					</tbody>
				</table>
				<div style="padding-top: 5px;display: block;float: left;padding-left: 5px;">
					<a wicket:id="plus-link"> <i class="far fa-plus" aria-hidden="true"></i></a>
				</div>	
			</div>
		</div>
	</div>
</wicket:panel>

<wicket:fragment wicket:id="row-fragment">
	<td wicket:id="cell" class="col-xs-6 col-lg-6 col-md-6" >
		<div wicket:id="panel" style="width:100%"></div>
	</td>
	<td style="width:100px;">
		<div class="dropdown" wicket:id="menu-container" style="float: right;padding-right: 10px;">
			<a id="dmenu" data-toggle="dropdown"> <i class="far fa-ellipsis-h" aria-hidden="true"></i></a>
			<ul wicket:id="menu" class="dropdown-menu dropdown-menu-right" aria-labelledby="dmenu" />
		</div>
	</td>
</wicket:fragment>

<wicket:fragment wicket:id="string-cell-fragment">
	<div wicket:id="value">[]</div>
	<div wicket:id="field">[]</div>
</wicket:fragment>
