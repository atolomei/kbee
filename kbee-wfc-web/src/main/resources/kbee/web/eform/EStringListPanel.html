<wicket:panel>
	<div wicket:id="container" class="col-xs-12 col-lg-12 col-md-12 form-group">
		<div>
			<div class="control-label">
				<label for="label" wicket:id="label"></label>
			</div>
			<div class="control" wicket:id="horizontal-layout" style="padding: 0px 10px; border: 1px solid  #d8dcdf; border-radius: 4px; display:inline-block; width:100%; min-height:40px;">
				<wicket:container wicket:id="control"/>
			</div>
			<wicket:container wicket:id="control"/>
			<div wicket:id="feedback-panel">
				<span wicket:id="message"></span>
			</div>
		</div>
	</div>
</wicket:panel>

<wicket:fragment wicket:id="control-fragment">
	<ul style="padding-top: 10px; min-height:40px; width:100%; float:left;">
		<li wicket:id="value" style="height: 30px; padding: 0 10px; font-size: 14px;">
			<div style="float:left; width:100%;">
				<a wicket:id="remove-link">
					<i class="close far fa-times" id="id3fc" style="cursor: pointer;   font-size: 12px;   color: #0d5072;   border: 1px solid #0d5072;   border-radius: 4px;   padding: 3px 6px;   float: left;   margin-top: 0px;   margin-right: 10px;   font-weight: normal;   text-shadow: none;   filter: none;   opacity: 1;">
					</i>
				</a>
				<span wicket:id="label"></span>
			</div>
		</li>
	</ul>
	<div class="col-xs-12 col-lg-12 col-md-12" style="float:left; width:100%; margin-top:5px; margin-bottom:15px; padding: 0 10px;" wicket:id="field"/>
</wicket:fragment>
