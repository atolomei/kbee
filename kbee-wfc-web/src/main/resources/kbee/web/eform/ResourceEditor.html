<wicket:panel>
	<form wicket:id="form">
		<div class="col-xs-12 col-lg-12 form-group" wicket:id="title"/>
		<div class="col-xs-12 col-lg-12 form-group" wicket:id="description"/>
		<div class="col-xs-12 col-lg-12 form-group" wicket:id="url"/>
		<div class="col-xs-12 col-lg-12">
			<a class="btn btn-xs btn-default" wicket:id="cancel-link"><wicket:message key="cancel" /></a>
			<a class="btn btn-xs btn-primary" wicket:id="save-link"><wicket:message key="save" /></a>
		</div>
	</form>
</wicket:panel>
