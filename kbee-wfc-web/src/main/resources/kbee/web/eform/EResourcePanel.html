<wicket:head>
	<style>
		.kbee .eform-editor .eform .resource-panel {display: block; width: 100%; height:auto;  padding: 15px; float:left; position:relative; min-height:0px; border:1px solid  #d8dcdf;  border-radius:4px;}
	</style>
</wicket:head>

<wicket:panel>
	<div wicket:id="container" class="col-xs-12 col-lg-12 col-md-12 form-group">
		<div class="efield">
			<div class="form-group">
				<div class="control-label">
					<label for="label" wicket:id="label"></label>
				</div>
				<div class="control" wicket:id="horizontal-layout">
					<div wicket:id="control"/>
				</div>
				<div wicket:id="control"/>
				<div wicket:id="versions"></div>
			</div>
				
		</div>
		<div wicket:id="confirmation-dialog" class="modal window" tabindex="-20" role="dialog"/>
	</div>
</wicket:panel>

<wicket:fragment wicket:id="control-fragment">

	<div id="resource-panel">
		<div class="dropdown" wicket:id="menu-container" style="float: right;padding-right: 10px; margin-top:-20px;">
			<a id="dmenu" data-toggle="dropdown"> <i class="far fa-ellipsis-h" aria-hidden="true"></i></a>
			<ul wicket:id="menu" class="dropdown-menu dropdown-menu-right" aria-labelledby="dmenu" />
		</div>
		<span wicket:id="subtitle"></span>
		<div class="resource-panel" style="display: block; width: 100%; height:auto;  padding: 15px; float:left; position:relative; min-height:0px; border:1px solid  #d8dcdf;  border-radius:4px;">
				<div style="width:100%; float:left; padding:15px;" wicket:id="resource-view">
					<div  style="width:100%; float:left;" wicket:id="view"/>
				</div>
				<a wicket:id="pickfiles" style="position: initial; width: 100%;    height: 100%;   position: initial;    float: left;    min-height: 160px;    z-index: 1;  background:#fbfbfb;">
					<div style="width:100%; text-align: center; position:absolute; transform:translateY(-50%); font-size:14px;  float: left;  line-height: 1.45em; color: #0d5072; font-weight: 300; top:50%;">
						<figure class="fad fa-cloud-upload-alt" style="opacity: 0.50; font-size: 50px; color: #0d5072; width: 100%; text-align: center; padding: 0px 0 10px 0;"></figure>
						<span><wicket:message key="dragdrophere" /></span>
					</div>
				</a>
		</div>
		
		<div wicket:id="upload-link" style="float:right;" ></div>
		
		<a wicket:id="help-link" class="btn-link" style="font-size: 12px;  float: right;  padding: 5px 5px 5px 10px;   margin-right: 3px;" >
			<span><wicket:message key="help" /></span>
		</a>
		<small wicket:id="help" class="help-block" style="float:left; clear:left; max-width: calc(100% - 60px);">[TEXTO]</small>
	</div>
	
</wicket:fragment>

<wicket:fragment wicket:id="image-view-fragment">
	<img wicket:id="image" style="width:100%;   max-height: 220px;  margin: 0;    display: block;    position: absolute;    width: auto; height: initial;  transform: translate(-50%, -50%);   left: 50%;    top: 50%;"/>
</wicket:fragment>
