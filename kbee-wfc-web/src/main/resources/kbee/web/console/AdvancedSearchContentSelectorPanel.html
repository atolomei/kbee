<wicket:panel>
	<div class="eform mt20 mb20" style="float:left; width:100%;">	
		<form wicket:id="form" class="col-md-12 col-lg-12 col-xs-12 side-form form-container" role="form" style="margin-bottom:0;">

				<div class="row">				
					<div class="col-xs-12 col-md-12 col-lg-11">
								<div class="row">
									
									<div class="col-xs-12 col-md-12 col-lg-4 form-group" wicket:id="title" style="margin:5px 0;"/>
									<div class="col-xs-12 col-md-12 col-lg-4 form-group" wicket:id="oid" style="margin:5px 0;"/>
									
									<!-- div class="col-xs-12 col-md-12 col-lg-4 form-group" wicket:id="externalid" style="margin:5px 0;"/-->
								</div>
					</div>
				</div>
				
				<div class="col-xs-12 col-md-12 col-lg-12">
					<ul class="col-xs-12 col-md-12 col-lg-11">
						<li wicket:id="element" class="col-lg-2 col-md-12 col-xs-12" style="margin:5px 0;">
							<div class="form-group" wicket:id="field"/>
						</li>
					</ul>
					<div class="col-xs-12 col-md-12 col-lg-1">
						<div class="form-group mt25" style="width:100%; float:left;">
							<div style="float:left;  width:100%;" wicket:id="buttons"/>
						</div>
					</div>
				</div>
		</form>
	</div>
</wicket:panel>
