<wicket:panel>

<div wicket:id="main" style="width:100%; float:left;">
	 
	 <div class="row">
		<div class="col-lg-12 col-xs-12 col-md-12" style="margin: 50px 0; float: left;">
			<div class="alert alert-danger" wicket:id="alert-too-big"></div>
			<div class="alert alert-danger" wicket:id="email-disabled"></div>
			<div class="alert alert-info" wicket:id="alert-executing"></div>

			<a style="margin-top: 12px;" wicket:id="close" href="#"
				class="btn btn-sm btn-default"><wicket:message key="close" />
			</a>
		</div>
	</div>

	 <div wicket:id="link-container" class="row">
			<div class="col-lg-12 col-xs-12 col-md-12" style="margin: 15px 0 50px 0; float: left;">
				<h2>EXPORT</h2>	
				<a style="margin: 15px 0;" wicket:id="link" href="#" class="btn-link">
						<span wicket:id="name"></span>
				</a>
			</div>
	 </div>

						
	<div class="row">
			<div  class ="col-lg-12 col-md-12 col-xs-12 form-command-status" wicket:id="command-status" />			
	</div>
	
	
	
	
	
	
</div>
		
</wicket:panel>
