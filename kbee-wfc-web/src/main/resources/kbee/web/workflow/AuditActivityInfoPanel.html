
<wicket:panel>

	<div class="row">
		<div class="col-lg-12 col-md-12 col-xs-12">
	
				<div class="panel" style="float:left; width:100%; padding: 0 15px; margin-top:15px;">
				
					<!-- h2  style="margin-bottom:15px;" >Audit</h2-->
					
					<div wicket:id="photo" />
					<div style="margin: 0 0 0 66px;">
							<span wicket:id="user" style="line-height:1.7em; width:100%; float:left; font-weight:bold;"></span>
							<span wicket:id="btitle" style="line-height:1.7em; width:100%; float:left;"></span>
					</div>
				</div>
			
				<div class="panel" style="float:left; width:100%;  padding: 0 15px; line-height:1.75em;">			

					 <div style="width:100%; float:left;"><span class="label"><b><wicket:message key="file" /></b>. </span><span wicket:id="file-name"  ></span></div>
					 <div style="width:100%; float:left;"><span class="label"><b><wicket:message key="template" /></b>. </span><span wicket:id="file-template"  ></span></div>
					 <div style="width:100%; float:left;"><span class="label"><b><wicket:message key="id" /></b>. </span><span wicket:id="file-id"  ></span></div>
					 <div style="width:100%; float:left;"><span class="label"><b><wicket:message key="version" /></b>. </span><span wicket:id="file-version"  ></span></div>					 

					 
					 <div style="margin-top:15px; width:100%; float:left;"> <span class="label"><b> <wicket:message key="task" /></b>. </span><span title="task name" wicket:id="task-taskname" ></span></div>  
					 <div style="width:100%; float:left;" ><span class="label"><b><wicket:message key="start" /></b>. </span><span wicket:id="task-start" ></span></div>
					 <div style="width:100%; float:left;"><span class="label"><b><wicket:message key="end" /></b>. </span><span wicket:id="task-end"  ></span></div>
					 <div style="width:100%; float:left;"><span class="label"><b><wicket:message key="action" /></b>. </span><span wicket:id="task-action"  ></span></div>
					 <div style="width:100%; float:left;"> <span class="label"><b> <wicket:message key="procedure" /></b>. </span><span title="procedure" wicket:id="task-procedure" ></span></div>
					 
					 
					 					 
				 </div>
			
		</div>
	</div>





 </wicket:panel>
