<wicket:panel>
	<div style="width:100%; float:left; margin-top:15px;">
		<h3 style="font-size: 0.9em;"><wicket:message key="notes" /></h3>
		<ul   class="list-group" style="width:100%; float:left; border-top: 1px solid #dedeef;">
			<li class="list-group-item" wicket:id="note" style="width:100%; float:left; background: inherit;">
				<div wicket:id="view" style="float:left;"></div>
			</li>
		</ul>
	</div>
</wicket:panel>

<wicket:fragment wicket:id="note-view-fragment">
	<div class="col-lg-12 col-xs-12 col-md-12">
		<div style="width:100%; float:left;">
			<span wicket:id="user"></span><span style="padding:0 5px;">·</span><span wicket:id="date"></span><span style="float:right;" wicket:id="state"></span>
		</div>
		<div style="width:100%; float:left;" wicket:id="text"></div>
		
	</div>
</wicket:fragment>
