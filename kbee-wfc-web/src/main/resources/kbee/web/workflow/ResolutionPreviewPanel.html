<wicket:panel>

		<div style="position: relative; margin-top:-55px; margin-right:-9%; float:right;">	
			
			<a cursor="pointer"  title="Printer friendly Letter" class="  btn-mini" target="_blank"  wicket:id="print-page">
				<i class="fal fa-file-alt" aria-hidden="true" style="font-size:20px;"></i>
			</a>
				
			<a cursor="pointer" class=" btn-mini" wicket:id="print-button">
				<i class="fal fa-print" aria-hidden="true" style="font-size:20px;"></i>
			</a>
		</div>
			


	<div class="response-container">
		
		<div wicket:id="text" id="response" class="response"  />
		
	</div>
</wicket:panel>
