<!-- eform for Audit  -->
<wicket:panel>
	<div class="response-container">
		<a cursor="pointer"  title="Printer friendly Letter" class="print-button btn-mini" target="_blank"  wicket:id="print-page">
			<i class="fal fa-file-alt" aria-hidden="true" style="font-size:20px;"></i>
		</a>
		<a cursor="pointer" class="print-button btn-mini" wicket:id="print-button" style="margin-right: -26px;">
			<i class="fal fa-print" aria-hidden="true" style="font-size:20px;"></i>
		</a>
		<div wicket:id="eform-container" class="eform-audit">
			<div class="eform" wicket:id="eform"/>
		</div>
	</div>
</wicket:panel>
