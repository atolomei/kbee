<wicket:panel>
	<div wicket:id="comment"class="row">
		<div class="col-lg-12 col-xs-12 col-md-12">
			
			<!-- div class="blockseparator"></div-->
			
			<h2> <wicket:message key="note" /></h2>
			<div class="task-comment" style="margin-bottom:30px; margin-top:0px; float: left;">	
				<div class="task-metadata" style="margin:0;">
						<div style="width:100%; margin-bottom: 12px; float:left;">
							<div wicket:id ="photo" />
							<div style="margin-left:5px; float:left;">	
								<div style="float:left;">
									<span class="reassign" style="    float: left;    clear: left;    font-size: 12px;    padding: 2px 5px;    margin-left: -3px;    margin-top: 0px;    line-height: 1em;" wicket:id="reassigned-label"/>
									<span style="font-weight:bold; margin-right:3px;   clear:left; float:left;" wicket:id="comment-user"></span>
									<span style="clear:left; margin-right:3px; float:left;" wicket:id="comment-user-title"></span>
								</div>
							</div>
						</div>
						<div style="padding: 15px;">
							<div wicket:id="comment-text" class="note" style="float:left; width:100%;  padding-right: 15px; margin-top:3px;"></div>
							<div class="metadata" wicket:id="comment-time"  style="float:left;  margin-top:3px;"></div>
						</div>
				</div>
			</div>
		</div>
	</div>
</wicket:panel>
