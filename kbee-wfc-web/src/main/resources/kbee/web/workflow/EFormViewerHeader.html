<wicket:panel>

	<div icket:id="eader-container" class="console-page-header page-header">
	
		<div style="float:left; width:100%; position:relative;" wicket:id="breadcrumb" />
		
		<div style="float:left; width:100%; position:relative;">
		
			<div icket:id="eader-internal-container" class="page-header-content" style="width:100%;">
				<div style="float:left; padding: 0px 0px 0px 0px; width:100%;">
					<div icket:id="avatar" style="float:left; margin-right:10px; margin-top:-2px;"></div>
					<i icket:id="icon" class="far fa-coffee icon-flipped"   style="font-size:27px; color:#007cba; float:left; margin-right:8px; margin-top:0px;"></i>
					<div style="float:left; margin-top:-2px; min-width:50%;" icket:id="titlepanel"/>
				</div>
			</div>
		
			<div class="page-header-left-tools">
				<div style="position: relative; bottom:0;">
					<div style="position:relative; display: block;  float:left;" icket:id="search" />
					<div style="position:relative; display: block;  float:left;" icket:id="navigation" />
					<div style="position:relative; display: block;" icket:id="menu-panel" />
				</div>
			</div>
		</div>
	</div>
</wicket:panel>
