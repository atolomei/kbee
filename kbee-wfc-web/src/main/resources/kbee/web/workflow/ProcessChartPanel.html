

<wicket:panel>

	<div wicket:id="panel">

	<h2> <wicket:message key="process-charter" /></h2>
	
		
	<div style="width:100%; float:left;  padding: 0; margin:10px 0px;   position:relative;  border: 1px solid #dee4e6;  border-radius: 4px;">
	


	<a href="#" wicket:id="hide" class="btn-link hidden-xs" style="z-index: 1;
    position: absolute;
    right: 15px;
    padding: 0;
    top: 10px;"> <i style="font-size:16px;" class="fal fa-times"></i></a>

		<div  class="col-lg-12 col-md-12  col-xs-12"  style="background: #fbfbfb;    padding: 15px 15px;        padding-right:30px; margin:0px;    border: none;   border-right:none;  border-left:none;   border-radius: 0px;">
	    	<div class="row">
					<ul  style="float:left; width:100%; position:relative; left:50%; transform:translateX(-50%);">
						
						<li wicket:id="items"    style="float:left;">
							
							<span wicket:id="sep" class="hidden-xs hidden-md" style=" width:10px; margin-left: -28px; float:left; padding: 18px 0px 18px 0px;">

							</span>
							
							<div wicket:id="pill" class="square">
									<div style="transform:translate(-50%, -50%); width:100%;  position: absolute;    top: 50%;    left: 50%;">
										<div style="clear:left; float:left; width:100%;">
											<span style="clear:left; text-transform:capitalize;" wicket:id="phase-label"></span>
										</div>
										<div style="clear:left; float:left; width:100%;">
											<span style="clear:left;   font-size:1em;" wicket:id="task-label"></span>
										</div>
									</div>
							</div>
						</li>
					</ul>
			</div>
		</div>
