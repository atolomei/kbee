

<wicket:extend>
	<div class="eform-audit container-fluid">

		<div wicket:id="left-panel" class="col-lg-8 col-md-6 col-xs-12"
			style="padding: 0; background: #fbfbfb; min-height: 100vh;">
			<form class="form-container">
				
				
				<div class="row">
					<div class="col-lg-12 col-md-12 col-xs-12">

						<div class="content-container-internal"	style="padding: 40px 7%; width: 100%; float: left;">
							
							
							
							<h2 style="width:100%;"> <span wicket:id="title"></span></h2>
				
							
							
							<div style="margin:auto; max-with:1400px;">
								<div style="background: white;    padding: 80px 9% 80px 9%;    float: left;    widthh: 100%;    border-radius: 4px;    border: 1px solid #dde6e8;    min-height: calc( 100vh - 80px);" wicket:id="letter" />
								</div>
						</div>
					</div>
				</div>
			</form>
		</div>
		<div wicket:id="right-panel" class="col-lg-4 col-md-6 col-xs-12"
			style="height: 100vh; padding: 0; background: white;">
			
			<div style="padding:40px 15px;">
				<h2 class="col-lg-12 col-md-12 col-xs-12">Audit</h2>	
				<div wicket:id="activity-panel" />
			</div>
			
		</div>
	</div>
</wicket:extend>
