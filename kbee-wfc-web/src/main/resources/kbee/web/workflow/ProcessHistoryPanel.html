
<wicket:panel>
	
	<div class="section-header">
		<h2> 
			<wicket:message key="history" />
		</h2>
	</div>
		
	<div class="row">
		<div class="col-lg-12 col-md-12  col-xs-12">
				<div class="row" wicket:id="audit-container">
					<div class="col-lg-12 col-md-12  col-xs-12">
						<div style="float:right">
							<a wicket:id="audit" title="Audit Trail" class="btn-mini" id="audit" style="float:left; padding:0 6px; cursor: pointer;">
								<i class="fal fa-history" aria-hidden="true"></i>
							</a>
						</div>
					</div>
				</div>
			
	  			<ul wicket:id="history-container" class="process-history col-lg-12">
					<li wicket:id="history" class="row">
						<div class="col-lg-12 col-md-12  col-xs-12">
							<div wicket:id="photo" />
							<div style="margin: 0 0 0 70px;">
								<span wicket:id="user" style="line-height:1.7em; width:100%; float:left; font-weight:bold;"></span>
								<span wicket:id="btitle" style="line-height:1.7em; width:100%; float:left;"></span>
								<span class="note" wicket:id="notes" 			style="margin-top: 15px; width:100%; float:left; max-width:980px;"></span>
								<span class="ago" wicket:id="not-allowed" 		style="width:initial; float:left; max-width:980px;"></span>
								
								<div style="width:100%; float:left; margin-top: 15px;">
									<div> 
										 <div style="width:100%; float:left;"><span> <wicket:message key="task" /> . </span><span title="task name" wicket:id="task-taskname" ></span></div>  
	 										 <div style="width:100%; float:left;" ><span><wicket:message key="start" /> . </span><span wicket:id="task-start" ></span></div>
											 <div style="width:100%; float:left;"><span><wicket:message key="end" /> . </span><span wicket:id="task-end"  ></span></div>
											 <div wicket:id="duedate-container" style="width:100%; float:left;"><span><wicket:message key="due" />. </span><span wicket:id="task-due"  ></span></div>
		 									 <div style="width:100%; float:left;"><span><wicket:message key="task-action" /> . </span><span wicket:id="task-action"  ></span></div>
											<div wicket:id="reassigned-container" class="metadata" style="width:100%; float:left; clear:left;">
													<span class="reassign" wicket:id="reassigned"></span>
											</div>
	 								</div>
	

	 								<div wicket:id="resolution" class="metadata" style="width:100%; float:left; margin-top:10px;">
										<i style="color:#a90000;" class="fas fa-envelope-open-text"></i>
										<a class="btn-link" wicket:id="resolution-page-link" target="_blank"> 
											<span wicket:id="r-title"></span>
										</a>
									</div>
									
									
									<div wicket:id="resources-uploaded-container" style="width:100%; float:left;">
										<ul style="width:100%; float:left;" class="resources-list">
											<li wicket:id="resources-uploaded" class="resource" style="width:100%; float:left;">
												<a class="btn-link" wicket:id="resource-link">
													<i class="icon" wicket:id="glyphicon" />
													<span class="media-heading" wicket:id="resource-title"></span>
													<span wicket:id="resource-uploaded"   	 style="float: none;" class="metadata"></span>
												</a>
												<!-- div wicket:id="resource-description" style="white-space: initial; float:left;line-height: 1.7em; width:96%;max-width:1200px;"></div-->										
											</li>
										</ul>
									</div>
									
									<div wicket:id="eforms-container" style="width:100%; float:left;">
										<ul style="width:100%; float:left;" class="resources-list">
											<li wicket:id="eform" class="resource" style="width:100%; float:left;">
												<a title="eForm" class="btn-link" wicket:id="eform-link" target="_blank">
													<i  style="color: darkorange;" class="far fa-table"></i>
								 					<span wicket:id="eform-title"></span>
												</a>
											</li>
										</ul>
									</div>
									

									<div wicket:id="progress-notes-container" style="width:100%; float:left;">
										<div wicket:id="progress-notes"/>
									</div>
									
								</div>
							</div>
						</div>
					</li>
				</ul>
	
			 	<div wicket:id="notasks" />
					 	 	
	
				<!--  div class="row">
			 			<div class="col-lg-12 col-md-12  col-xs-12">
					 	 	<div wicket:id="process-info" />
	 				 	 </div>
			  	</div -->

	</div>
 	
	<div wicket:id="resolution-modal" class="modal window" data-dismiss="modal" data-toggle="modal" tabindex="-6" role="dialog"/>
	<div wicket:id="eform-modal" class="modal window" data-dismiss="modal" data-toggle="modal" tabindex="-7" role="dialog"/>
</div>

</wicket:panel>
