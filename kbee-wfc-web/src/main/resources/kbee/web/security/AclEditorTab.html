<wicket:head>
	<style>
		.not-set { border-radius: 5px; border: 1px solid  #d8dcdf; width: 48px; float: left;  }
		.permission { text-align:center;vertical-align: middle; text-align: center; }
		.kbee .table-bordered > tbody > tr > td.permission { vertical-align: middle; }
		.kbee .table-bordered > tbody > tr > td.permission > div{ width: 100%; }
		.kbee span.btn-link em {font-style: normal;}
		.ancho { width: 60px; }
	</style>
</wicket:head>

<wicket:panel>
	<div class="table-responsive col-lg-12 col-md-12 col-xs-12" style="padding:0;">
		<table wicket:id="rows" class="table table-striped table-bordered table-hover"  />
	</div>
	<!-- 
	<div class="dropdown" wicket:id="menu-container" style="float: right;padding-right: 0px;padding-bottom:5px;padding-top:5px;">
		<a id="dmenu" data-toggle="dropdown"> <i class="far fa-ellipsis-h" aria-hidden="true"></i></a>
		<ul wicket:id="menu" class="dropdown-menu dropdown-menu-right" aria-labelledby="dmenu" />
	</div>
	-->
	<div class="form-group col-lg-12 col-md-12 col-xs-12" style="margin-top:0px; margin-bottom:0px; padding:15px; background-color: #fcfcfc; border:1px solid #d8dcdf;" wicket:id="group"/>
	<div class="dropdown" wicket:id="selector-button" style="float: right;padding-right: 0px;padding-bottom:5px;padding-top:10px;">
		<a wicket:id="button"><wicket:message key="label.add-principal"/></a>
	</div>
	<div wicket:id="selector"></div>
	
</wicket:panel>

<wicket:fragment wicket:id="principalFragment">
	<a wicket:id="principal-link" class="btn-link"><span wicket:id="principal"></span></a>
	<div wicket:id="group-window" class="modal window" tabindex="-4" role="dialog"/>
</wicket:fragment>


<wicket:fragment wicket:id="permissionFragment">
	<span style="text-align:center;">
		<a wicket:id="permission-link">
			<span wicket:id="value"></span>
		</a>
	</span>
</wicket:fragment>

<wicket:fragment wicket:id="deletelinkFragment">
	<a wicket:id="delete-link">
		<span class="far fa-times"></span>
	</a>
</wicket:fragment>
