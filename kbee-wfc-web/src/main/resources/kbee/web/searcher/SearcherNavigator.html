<wicket:panel>

		<nav style="float: left;">
			<ul class="list-group">
				<li class="list-group-item">
					<div id="sort" wicket:id="sort" />
				</li> 
			</ul>
		</nav>
		
		
		<nav style="float: right;">	
			<ul class="list-group">
				<li class="list-group-item" wicket:id="pages" style="float:left;">
					<a class="btn-mini" wicket:id="page-link"><span wicket:id="number"/></a>
				</li> 
			</ul>
			<ul class="list-group">
				<li class="list-group-item">
					<a class="btn-mini" wicket:id="viewmode"><i class="fal fa-image"></i></a>
				</li>
			</ul>
		</nav>
	
</wicket:panel>
