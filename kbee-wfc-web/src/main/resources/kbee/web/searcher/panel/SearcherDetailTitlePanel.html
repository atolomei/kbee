
<wicket:panel>
	<div wicket:id="title-container" class="title-container">

		<i wicket:id="deleted" title="deleted" class="version-icon fal fa-trash-can-check"
			style="font-size: 25px; float: left; color: #e55932; padding: 10px 15px 0px 0;"> </i> <i wicket:id="lock"
			title="checkout" style="float: left; padding: 10px 15px 0px 0; font-size: 25px; color: #e55932;"
			class="checkout-icon cell-icon fal fa-lock"></i>

		<h1 style="float: none; width: initial; margin: 2px 0; line-height: 1.4em;" wicket:id="title"></h1>
		<!-- i wicket:id="previous-version" title="previous version"  class="version-icon fas fa-box" style="float: left; margin-top:5px;"></i -->

		<div
			style="float: left; width: 100%; clear: left; padding: 5px 0; font-size: 1.15em; line-height: 1.5em; margin-top: 15px;"
			wicket:id="subtitle"></div>
	</div>
</wicket:panel>
