
<wicket:panel>
		<ul class="classification detail-area">
			<li wicket:id="section">
					<wicket:container wicket:id="section-panel" />
			</li>
		</ul>
</wicket:panel>

<wicket:fragment wicket:id="section-fragment">
	<section class="section">
		
		<div class="section-header">
			<h2 wicket:id="section-title"></h2>
		</div>
		
			<ul class="section-classification" style="width:100%; float:left; border-top:1px solid #d8dcdf;">
				
				<li wicket:id="attributes" class="col-lg-12" style="padding-left:0; padding-right:0; padding-top:0;">
							
							<div style="width:100%; float:left; padding:0px; border:1px solid #d8dcdf; border-top:none;">
								<div class="attribute-name col-lg-3 col-md-5 col-xs-12"><label wicket:id="attribute"></label></div>
								<div class="attribute-value col-lg-9 col-md-7 col-xs-12">
								 		<ul>
								 			<li wicket:id="values">
									   			<span wicket:id="value"></span>
									   		</li>
								   		</ul>						
								</div>
							</div>
						
				</li>
			</ul>
	</section>
	
</wicket:fragment>
