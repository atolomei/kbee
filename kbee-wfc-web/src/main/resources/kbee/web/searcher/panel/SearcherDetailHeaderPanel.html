
<wicket:panel>

<div wicket:id="main-area-container" class="container-fluid">
			<ul wicket:id="main-area" class="main-area header-container" style="width:100%;">
				<li wicket:id="criteria-relationship"	 class="row" style="margin:0;"/>
				<li wicket:id="breadcrumb" 				 class="row" style="margin:0;" />
				<li class="row">
					<div class="col-lg-12 col-md-12 col-xs-12">
						<div style="float:left; width:100%;">
							
							<div wicket:id="title" class="title" float="left "/>
							<div wicket:id="metadata" style="width:100%; float:left; font-size:18px; padding:6px 0;"/>
							<div wicket:id="tags" style="float:left; margin-top:10px;" />
							
							<div wicket:id="version" style="float:left; margin-top:7px; width:100%">
									<span style="padding:5px 10px; background:#e55932; color:white; border-radius: 0px;" wicket:id="version-number"></span>
							</div>
						</div>
						<div wicket:id="tools" style="float:right" />	
					</div>
				</li>
				<li wicket:id="toolbar" class="toolbar" />
			</ul>
	</div>
</wicket:panel>
