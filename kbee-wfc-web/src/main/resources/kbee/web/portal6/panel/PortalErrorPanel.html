<wicket:panel>
		<div wicket:id="container">

	
		
			<div class="row">
				<div class="col-lg-12 col-md-12 col-xs-12">
					
						<a wicket:id="close" href="#" style="position:absolute; right:0; padding:4px; top:0;top: -4px;    float: right">
							<i style="color:#d01a1f; font-size:14px; padding: 0 10px;" class="fal fa-times"></i></a>					
						
						
						<span style="font-weight:bold; width:100%; float:left; clear:left;" class="title" wicket:id="title"></span>
						
						<span style="width:100%; float:left; clear:left; margin-top:15px;" class="text" wicket:id="modelinfo"></span>
						<span style="width:100%; float:left; clear:left;" class="text" wicket:id="text"></span>
						<a class="btn-link" wicket:id="stacktrace-link">
							<span style="width:100%; float:left; clear:left;" class="text" wicket:id="stacktrace"></span>
						</a>
				</div>
			</div>
		</div>
</wicket:panel>
