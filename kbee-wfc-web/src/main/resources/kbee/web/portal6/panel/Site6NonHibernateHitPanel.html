
<wicket:panel>


	<div style="width:100%; float:left;">
			<div style="float:left;">	
				<a style="float:left;" href="#" class="dropdown-toggle imenu" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="false">
					<i class="far fa-ellipsis-h" aria-hidden="true"></i>			
				</a>
				<ul style="top: 30px;" class="dropdown-menu" wicket:id="menu"/>
			</div>
			
			<div style="float:left;">
					<div style="float:left; width:100%;">
						<a style="float:left;"  wicket:id="link" class="title">
							<span wicket:id="title"></span>
						</a>
					</div>
					<div wicket:id="abstract-container" style="float:left; clear:left;  width:100%;">
							<span wicket:id="subtitle"></span>
							<span wicket:id="abstract"></span>
					</div>
			</div>
	</div>
	<div style="width:100%; float:left;" wicket:id="editor" />


</wicket:panel>
