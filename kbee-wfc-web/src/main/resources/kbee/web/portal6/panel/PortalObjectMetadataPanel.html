<wicket:panel>
		
			<div class="col-lg-12 col-md-12 col-xs-12" style="padding:5px 15px;">
			 
				<div class="row">				
					<ul class="list-group col-lg-12 col-md-12 col-xs-12 compressed-list">
						<li class="list-group-item" wicket:id="info" style="width:100%; float:left; border:none; background-color:transparent;">
								<div style="width:100%; float:left;">
										<span class="label" wicket:id="key"></span>
										<span class="title" wicket:id="value"></span>
								</div>
						</li>
					</ul>
				</div>
			</div>
		
</wicket:panel>
