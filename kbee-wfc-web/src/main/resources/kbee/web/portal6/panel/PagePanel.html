						<div wicket:id="main-left-ps" class="ps-main-left">
							<ul wicket:id="main-left-list-ps" class="ps-list-left">
								<li wicket:id="left-ps" class="ps-left"></li>
							</ul>
						</div>
						<div wicket:id="main-right-ps" class="ps-main-right">
							<div wicket:id="right-ps" class="ps-right"></div>
						</div>
					</div>
					<div wicket:id="bottom-ps" class="ps-right"></div>
				</div>
				
</wicket:extend>
