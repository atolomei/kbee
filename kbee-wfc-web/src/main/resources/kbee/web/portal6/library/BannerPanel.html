

<wicket:head>


<style type="text/css">

.kbee .lbanner 						{float:left; display: block; position: inherit;    top: initial;    right: initial;    z-index: 999999;    color: inherit;    padding: 0;}
.kbee .lbanner .image-link 			{float:left; margin-bottom:30px; width:100%; position:relative;}
.kbee .lbanner .image-container 		{float:left; width:100%; position:relative; height: 400px; overflow:hidden;}
.kbee .lbanner .image-container img 	{max-width:180%;}



.kbee .lbanner .title-link 				{float:left; margin-bottom:30px; width:100%;  width:100%; text-align:center; text-decoration:none;}
.kbee .lbanner .title 					{font-size: 2em;    color: #0c0c0c;    font-weight:bold; }


.kbee .lbanner .text 					{    float: left;    width: 100%;    text-align: center;    color: #0c0c0c;  font-size: 1.75em;    padding: 0 10%;  font-weight: 800;}
.kbee .lbanner .text 	 a{text-decoration:none;  color: #0c0c0c; }      
      
</style>

</wicket:head>


<wicket:panel>


	<div wicket:id="banner-container">
	
		<div class="lbanner" style="float:left; width:100%;   margin: 4em 0;">

			<a class="image-link image-container" wicket:id="link-image" href="#">				
				<img wicket:id="image" class="panel-centered">
			</a>
			
			<a class="title-link" wicket:id="link-title" href="#">
				<span class="title" wicket:id="title"></span>
			</a>
			<div class="text" wicket:id="text"> </div>
		</div>
	</div>
</wicket:panel>
