<wicket:panel>
		<div class="standard-canvas">
			
		
			<div class="col-md-12 col-lg-12 col-xs-12">
				<div class="row">
						<div class="col-md-8 col-lg-9 col-xs-12">
							<h2 style="float:left;"><span wicket:id="title"/></h2>
							<div style="float:right;">
								<a wicket:id="close" style="float:right;" href="#" class="btn-link"><wicket:message key="close"/></a>
							</div>
						</div>
						<div class="col-md-4 col-lg-3 col-xs-12">
							<div class="button-container" style="float: right;" wicket:id="buttons"/>
						</div>
				</div>
				
				
				
				
				
				<div class="row">
					<form wicket:id="form" style="margin-bottom:0;" class="form-container col-lg-9 col-md-8 col-xs-12" role="form">
						<div class="row">
							<div style="width:100%; float:left;">
								<div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="title"/>
							</div>
						</div>
					</form>
				</div>
				
				<div class="row">
					<div class="col-md-8 col-lg-9 col-xs-12">
						<h4 style="margin:4px 0;"> <wicket:message key="items"/></h4>
						<div wicket:id="menu-items-list" />
					</div>
				</div>
				<div style="margin-top:15px;" class="col-lg-3 col-md-4 col-xs-12" wicket:id="error-panel" />
			</div>
			
		</div>
</wicket:panel>
