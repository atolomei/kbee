<wicket:panel>
		<div class="standard-canvas">
				<div class="row">
						<h2 class=" col-md-8 col-lg-9 col-xs-12"><wicket:message key="site-editor"/></h2>
						<div class="button-container col-md-4 col-lg-3 col-xs-12" wicket:id="buttons"/>
				</div>
				<div class="row">
					<form wicket:id="form" style="margin-bottom:0;" class="form-container col-lg-9 col-md-8 col-xs-12" role="form">
						<div class="row">
							<div class="panel" style="width:100%; float:left;">
						 
								<div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="title"/>
								<div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="url"/>
								<div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="key"/>
								<div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="description"/>
								<div class="col-lg-12 col-md-12 col-xs-12 form-group" wicket:id="id"/>
							</div>
						</div>
					</form>
				</div>
		</div>
</wicket:panel>
