
<wicket:panel>
	
	<div style="float:left; margin-bottom:10px;">	
		<form wicket:id="searchform" style="float:left;" class="search suggester-container">
				<div class="input-group">
					<div  wicket:id="text" class="searcher"/>
					<div class="input-group-btn">
						<button wicket:id="search" type="button"  class="btn btn-default dropdown-toggle"><i class="far fa-search"></i></button>
					</div>
				</div>
		</form>
	
		<div wicket:id="navigator" />
		
		<a wicket:id="clear-all" href="#" class="btn-link" style="float: left; border-color:transparent; text-decoration:none; margin: 0; padding:7px 15px;">

		<!-- wicket:message key="clear-all"/ --> </a>
		
		<wicket:container wicket:id="advancedsearch" />
	
	</div>
	
</wicket:panel>
