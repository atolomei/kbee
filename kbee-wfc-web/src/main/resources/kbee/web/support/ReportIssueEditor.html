

<wicket:panel>
	<div class="container">
		
		<div class="col-lg-12 col-md-12 col-xs-12" style="margin-top: 64px;">
			
			<div class="row">
				<form wicket:id="form" class="form-container col-md-12 col-lg-12 col-xs-12" role="form">
					
					<h2> <wicket:message key="report-issue" /></h2>
					<div class="row">
						<div class="col-md-12 col-lg-12 col-xs-12">
								<p><wicket:message key="report-issue-info" /></p>
						</div>
					</div>					
		
					<div class="row">
			 			<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="subject"/>
						<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="text"/>
						<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="KBFile"/>
						
					</div>
					<div style="margin-top:10px;" class="button-container col-md-12 col-lg-12 col-xs-12" wicket:id="buttons"/>
				</form>
			</div> 
			
			<div class="row" wicket:id="control-info">
							<div class="col-xs-12 col-lg-12 col-md-12"><h3 style="float:left;">Control</h3><span  style="float:left; margin-left:0.5em;" class="only-root">(root | support)</span></div>	
							<div class="col-xs-12 col-lg-12 col-md-12"><span class="label" style="font-weight:bold;">Mode.</span> 		<span class="value"  wicket:id="mode"/></div>
							<div class="col-xs-12 col-lg-12 col-md-12"><span class="label" style="font-weight:bold;">Endpoint.</span> 	<span class="value" wicket:id="endpoint"/></div>
			</div>
			
		</div>
	</div>
</wicket:panel>
