<wicket:panel>
	<div wicket:id="container" class="canvas">
		<div class="row panel" wicket:id="executing_status" />
		<div class="row panel" wicket:id="results" />
	</div>
</wicket:panel>




<wicket:fragment wicket:id="executing-status-fragment">
	<div class="col-lg-12 col-xs-12 col-md-12">
		<div class="row">
			<div class="col-lg-12 col-xs-12 col-md-12">
				<h2 style="margin-bottom: 12px;">Status</h2>
			</div>
		</div>
		<div class="row">
			<table class="col-lg-12 col-xs-12 col-md-12" style="padding-left:15px; padding-right:15px;">
				<tbody>
				<tr class="row" wicket:id="result">
					<wicket:container wicket:id="command_item" />
				</tr>
				</tbody>
			</table>
		</div>
		<!-- div class="row" wicket:id="actions" style="margin-top:30px;">
			<div class="col-lg-12 col-xs-12 col-md-12">
				<a class="btn btn-sm btn-default" wicket:id="stop"><wicket:message key="stop" /></a>
			</div>
		</div-->
	</div>
</wicket:fragment>





<wicket:fragment wicket:id="results-fragment">
    <div class="col-lg-12 col-xs-12 col-md-12">
        <div class="row">
            <div class="col-lg-12 col-xs-12 col-md-12">
                <h2 style="margin-bottom: 12px;" wicket:id="results"></h2>
            </div>
        </div>
        <div class="row">
            <table class="col-lg-12 col-xs-12 col-md-12" style="padding-left:15px; padding-right:15px;">
                <tbody>
                <tr class="row" wicket:id="result">
                    <wicket:container wicket:id="command_item"/>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</wicket:fragment>
