<wicket:panel>
	
	<div class="content-header">
		<div style ="float: left; width: 82px;height: 82px; border-radius: 50%;overflow: visible; -webkit-border-radius: 150px;	background: none;     position: relative;">
				<div wicket:id="avatar-status-container" class="user-avatar-status-container">
		    		<img class="avatar-status" wicket:id="avatar-status"> 
				</div>
				<div class="user-photo-container">
					<img class="avatar" wicket:id="photo"/>
				</div>
		</div>
		
		<div style="padding-left: 100px;">
			<i wicket:id="archived" class="fal fa-user-times danger" title="Account Archived"  aria-hidden="true" style="float: left;    margin-top: 5px;    margin-right: 10px; "></i>
			<h1 wicket:id="name" style="float:left;"/>
			<!-- div wicket:id="breadcrumb" style="float:left;width:100%;"></div-->
			<div style="float:left;width:100%;"><span wicket:id="jobprofile">Software Developer</span></div>
		</div>
	</div>	
</wicket:panel>
