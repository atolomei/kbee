<wicket:panel>

	<div class="col-lg-12 col-xs-12 col-md-12">
		<div class="row">
			<div class="col-lg-12 col-xs-12 col-md-12">
				<h2 style="margin-bottom: 12px;" wicket:id="title"></h2>
			</div>
		</div>
		
		<div class="table-responsive">
			<table class="table table-bordered">
				<tbody>
				<tr class="row" wicket:id="result">
					<wicket:container wicket:id="command_item" />
				</tr>
				</tbody>
			</table>
		</div>
		
		<div class="row" wicket:id="actions" style="margin-top:30px;">
			<div class="col-lg-12 col-xs-12 col-md-12">
				<a class="btn btn-lg btn-default" wicket:id="stop" style="float:right;"><wicket:message key="stop" /></a>
			</div>
		</div>
		
	</div>
	
</wicket:panel>
