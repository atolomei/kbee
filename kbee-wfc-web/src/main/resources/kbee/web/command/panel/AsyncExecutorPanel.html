<wicket:panel>
	<div wicket:id="confirmation"></div>
	<div wicket:id="execution"></div>
	<div wicket:id="progressbar" class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" >
		<span wicket:id="progresslabel" class="sr-only" style="position: unset;"></span>
	</div>
	<div wicket:id="timeleft" style="width:100%;display:block;float:left;">100</div>
	<div wicket:id="report"></div>
</wicket:panel>
