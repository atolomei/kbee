<wicket:panel>

	<div wicket:id="image-container" class="media-left" style="min-width:40px;">
		<a class="resource" wicket:id="image-link" data-toggle="tooltip" data-placement="right">
			<img wicket:id="image" class="media-object" />
			<img class="player" style="position: absolute;"  wicket:id="player" />
			 <i wicket:id="glyphicon" />
		</a>
	</div>
	
	<div class="media-body" wicket:id="body">
		<a class="btn-link" style="text-decoration:none; color: #131414;" wicket:id="title-link">
			<h4 class="media-heading" wicket:id="resource-title"></h4>
		</a>
		<div style="float:left; width:100%;">
			<div wicket:id="resource-description" style="white-space: initial; float:left;line-height: 1.7em; max-width:1200px;"></div>
			<div wicket:id="url"  style="white-space:initial; float:left; width:100%; line-height:1.7em;"></div>
		</div>
		<div style="float:left; width:100%;">									
			<div style="float:left; width:100%;" wicket:id="resource-lastmodified-by" class="metadata"></div>
			<div style="float:left; width:100%;" wicket:id="resource-uploaded" class="metadata"></div>
			<div style="float:left; width:100%;" wicket:id="resource-folder" class="metadata"></div>
		</div>
		<div style="float:left; width:100%;">									
		<div wicket:id="resource-signature" class="metadata" style="float:left; width:100%;"></div>
		</div>
	</div>
		
</wicket:panel>
