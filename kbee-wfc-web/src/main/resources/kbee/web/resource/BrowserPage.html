<wicket:head>
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">

	<script type="text/javascript">
	
		var FileBrowserDialogue = {
			init : function () {
				 alert("init called");
			},
			mySubmit : function (URL) {
		        top.cb(URL, { title: 'file' });
				top.tiny.windowManager.close();
			}
		}
		
		function returnvalue(value) {
			FileBrowserDialogue.mySubmit(value);
		}
		 
	</script>
	
</wicket:head>
	<wicket:extend>
	

		<div class="content">	
			<div class="browser">		
				<div wicket:id="browser"/>
			</div>
		</div>
	
	</wicket:extend>
