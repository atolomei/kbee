<wicket:panel>

	<div class="snippets">
		<div class="resources-panel">
			<ul wicket:id="snippets-list" class="media-list col-lg-12 col-md-12 cool-xs-12">
				<li wicket:id="snippet" class="media" style="width:100%;">
					<div class="icon">
						<div class="media-left">
							<a class="resource" wicket:id="resource-link" data-toggle="tooltip" data-placement="right" style="float:left">
								<span  wicket:id="glyphicon" />
							</a>
						</div>
					</div>
					<div class="media-body">
						<a wicket:id="title-link" class="btn-link"  style="text-decoration:none; float: left; color: #191a1b;">
							<h4 class="media-heading" wicket:id="resource-title"></h4>
						</a>
						<span style="width:100%;clear:left;inline-size: 750px;" wicket:id="snippet" class="metadata"></span>
					</div>
				</li>
			</ul>
		</div>
	</div>
</wicket:panel>
