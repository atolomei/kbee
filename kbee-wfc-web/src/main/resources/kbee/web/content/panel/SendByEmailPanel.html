				<div style="margin-top:15px; margin-bottom:15px; float:left; width:100%;" wicket:id="alert-text" />
				<form wicket:id="form"  class="form-container"     style=" width:100%;  float: left;" role="form">
					<div>
						<div wicket:id="eform"/>
					</div>
				</form>
				<div wicket:id="feedback">
					[]

			</div>
		</div>
</wicket:panel>

	<ul>
		<li  wicket:id="message"><span wicket:id="text">[]</span></li>
	</ul>
</wicket:fragment>
