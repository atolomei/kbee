<wicket:panel>
	<div class="standard-canvas" style="height:60vh;">
		<div class="row">
			<div style="margin-bottom:15px; margin-top: 15px; float:left; width:100%; padding:0 15px;" wicket:id="alert-text" />
			
			
			<form id="form" wicket:id="form" class="form-container"   style="width:100%;  float: left;" role="form">
				<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="password"/>
				<div class="col-xs-12 col-lg-12 col-md-12 form-group">
					<a href="#" wicket:id="generate"> <wicket:message key="generate-link" /></a>
				</div>
				<div class="col-xs-12 col-lg-12 col-md-12 form-group" wicket:id="link"/>
				
				<div id="copy-container" wicket:id="copy-container" class="col-xs-12 col-lg-12 col-md-12 form-group">
					<a id="copy-link" onClick="copyToClipboard();"><wicket:message key="copy-message"/></a>
					<div id="copy-feedback"></div>
				</div>
			</form>
		</div>
	</div>	
</wicket:panel>
