<wicket:panel>

	
	<div class="media-body" wicket:id="body">
		<a class="btn-link" style="text-decoration:none; color: #131414;" wicket:id="title-link">
			<h4 class="media-heading" wicket:id="title"></h4>
		</a>
		<div style="float:left; width:100%;">
			<div wicket:id="subtitle" style="width:100%; text-align:center; white-space: initial; float:left;line-height: 1.7em; max-width:1200px;"></div>
		</div>
		<div style="float:left; width:100%;">									
			<div style="float:left; width:100%;" wicket:id="lastmodified-by" class="metadata"></div>
			<div style="float:left; width:100%;" wicket:id="lastmodified" class="metadata"></div>
		</div>
	</div>
	
		
</wicket:panel>
