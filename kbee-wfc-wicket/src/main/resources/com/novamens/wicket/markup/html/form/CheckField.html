<wicket:panel>

		
<div class="field check-field">
	
	 <div style="float:left; width:100%;">
		<wicket:container wicket:id="control"/>
		<div style="margin-left:30px;  width: calc( 100% - 40px); clear: right; ">
			<span wicket:id="label" for="label" style="text-transform:none; margin:3px 0 0 0px; font-size: 1em; font-weight:normal;"></span>
			<span class="highlight atright" wicket:id="readonly" >(<wicket:message key="readonly" />)</span>
		</div>
	</div>
	
	<div class="control" wicket:id="horizontal-layout">
		<wicket:container wicket:id="control"/>
	</div>
</div>
	
	
</wicket:panel>

<wicket:fragment wicket:id="control-fragment">
	

	<div wicket:id="subtitle-container" style="float:left; width:100%; padding:15px;">
			<span wicket:id="subtitle" />	
	</div>
		
	<div style="float:left; width:40px;" class="checkbox">
			<input wicket:id="input" class="styled" type="checkbox" />
			<label for="" wicket:id="text">[]</label>
		<small wicket:id="help" class="help-block"></small>

		<wicket:container wicket:id="feedback">

		<span wicket:id="icon" class=" far fa-times form-control-feedback"></span>
			<small wicket:id="error" class="error-block">[]</small>
		</wicket:container>
	</div>
	
</wicket:fragment>
