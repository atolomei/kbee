<wicket:panel>
	
	<div class="field text-field">
		<div class="control-label" wicket:id="label-container">
			<label for="label" wicket:id="label"></label>
			
			<i wicket:id="mandatory" class="mandatory fas fa-asterisk" title="field is required"></i>
			<span class="highlight atright" wicket:id="readonly" >(<wicket:message key="readonly" />)</span>
			
			<a wicket:id="help-info-circle"><i class="fal fa-info-circle" style="float:right;"></i></a>
		</div>
		
		<div class="control" wicket:id="horizontal-layout">
			<wicket:container wicket:id="control"/>
		</div>
		<div  wicket:id="control" class="container-panel"/>
	</div>
</wicket:panel>


<wicket:fragment wicket:id="control-fragment">

		<div wicket:id="subtitle-container" style="float:left; width:100%; padding:15px;">
				<span wicket:id="subtitle" />	
		</div>
		
		
		<input type="text" class="form-control" wicket:id="input" />
		
		 <a wicket:id="help-link" href="#" class="btn-link" style="font-size: 12px;  float: right;  padding: 11px 20px 11px 10px;  margin-right: 3px;  margin-top: -40px; position:relative;">
		 	<span wicket:id="helpstr" />
		 </a>
		
		 <small wicket:id="help" class="help-block" style="float:left; width: calc(100% - 30px);"></small>
		 
		<div wicket:id="feedback" class="feedback-block" style="display: block;">
			<span wicket:id="icon" class=" far fa-times form-control-feedback" style="top:25px;"></span>
			<small wicket:id="error" class="error-block" style="float:left;"></small>
		</div>

		<wicket:container wicket:id="info-panel">
			<div wicket:id="panel"></div>
		</wicket:container>
	
</wicket:fragment>
