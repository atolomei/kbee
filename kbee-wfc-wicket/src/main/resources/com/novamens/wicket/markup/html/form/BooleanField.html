<wicket:panel>

	<div  class="field boolean-field control-label">	
		<label class="col-lg-2 " wicket:id="label" for="label">[label]</label>
		<span class="highlight atright" wicket:id="readonly" >(<wicket:message key="readonly" />)</span>
		
		<a wicket:id="help-info"><i class="fal fa-info-circle" style="float:right;"></i></a>
		
		<div class="col-lg-2" wicket:id="horizontal-layout">
				<wicket:container wicket:id="control"/>
		</div>
		
		<wicket:container wicket:id="control"/>
	</div>
</wicket:panel>

<wicket:fragment wicket:id="control-fragment">
	
	
		<div wicket:id="subtitle-container" style="float:left; width:100%; padding:15px;">
				<span wicket:id="subtitle" />	
		</div>
	
	
	<select class="form-control" wicket:id="input">
		<option>[Yes]</option>
		<option>[No]</option>	
	</select>
	
	<!-- small wicket:id="help" class="help-block"></small-->
	
	
	 <a href="#" class="btn-link" 	style="font-size: 12px;    float: right;    padding: 11px 20px 11px 10px;    margin-right: 12px;    margin-top: -40px;" wicket:id="help-link">
	  		<span wicket:id="helpstr" />
	 </a>
	 <small wicket:id="help" class="help-block" style="float:left;width: calc(100% - 30px);"></small>
	 
	
	<wicket:container wicket:id="feedback">
		<span wicket:id="icon" class=" far fa-times form-control-feedback"></span>
		<small wicket:id="error" class="error-block"></small>
	</wicket:container>
</wicket:fragment>
