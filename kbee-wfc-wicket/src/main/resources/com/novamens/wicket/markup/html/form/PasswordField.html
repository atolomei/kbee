<wicket:panel>
	
	<div class="field text-field">
		<div class="control-label" wicket:id="label-container">
			<label for="label" wicket:id="label"></label>
			<i wicket:id="mandatory" class="mandatory fas fa-asterisk" title="field is required" ></i>
			<span class="highlight atright" wicket:id="readonly" >(<wicket:message key="readonly" />)</span>
			<a wicket:id="help-info-circle"><i class="fal fa-info-circle" style="float:right;"></i></a>
		</div>
		
		<div class="col-lg-10" wicket:id="horizontal-layout">
			<wicket:container wicket:id="control" class="container-panel"/>
		</div>
		<div  wicket:id="control" class="container-panel"/>
	</div>
</wicket:panel>



  

<wicket:fragment wicket:id="control-fragment">
			
			<div class="input-container">
				<input type="text" class="form-control" style="border-radius:0;" wicket:id="input"></input>
				
				 <div class="tools-container">
					 <a herf="#" wicket:id="help-link" class="btn-link help" >
					 		<span wicket:id="helpstr" />
					 </a>
					 <a href="#" title="view/hide password" wicket:id="preview" class="btn-link preview">    
			    	 	<i wicket:id="preview-icon"></i>
					 </a>
				 </div>
				 
			</div>
			
			 <div wicket:id="show-password-container"  class="show-password-container">
			 	 <a href="#" wicket:id="show-password-link">    
			   	 	<span wicket:id="show-password-label">show/hide password</span>
				 </a>
			 </div>
			
			
		 	<small wicket:id="help" class="help-block" style="float:left;width: calc(100% - 30px);"></small>
			
			<div wicket:id="feedback" class="feedback-block" style="display: block;">
				<span wicket:id="icon" class=" far fa-times form-control-feedback"></span>
				<small wicket:id="error" class="error-block"></small>
			</div>
			
			<wicket:container wicket:id="info-panel">
				<div wicket:id="panel"></div>
			</wicket:container>
</wicket:fragment>
