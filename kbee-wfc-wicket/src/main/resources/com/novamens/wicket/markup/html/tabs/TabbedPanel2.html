<html xmlns="http://www.w3.org/1999/xhtml" xmlns:wicket="http://wicket.apache.org/" xml:lang="es" lang="es">
<wicket:head>
<style>
	.hidden {display:none;}
</style>
<script>
	function show(divId) {
		document.getElementById(divId).className='tab-pane fade in active';
	}
	function hide(divId) {
		document.getElementById(divId).className='tab-pane fade';
	}
	function selected(tabId) {
		document.getElementById(tabId).className='active';
	}
	function unSelected(tabId) {
		document.getElementById(tabId).className='';
	}
	function lastSelected(tabId) {
		document.getElementById(tabId).className='active';
	}
	function lastUnSelected(tabId) {
		document.getElementById(tabId).className='';
	}
</script>
</wicket:head>
<wicket:panel>
	
	<ul wicket:id="container" class="nav nav-pills">
		<li wicket:id="tab">
			<a wicket:id="trigger" style="cursor:pointer;">[]</a>
		</li>
	</ul>
	
	<div class="tab-content">
		<div wicket:id="xpanel" class="tab-pane fade">
			<div wicket:id="internal-panel" class="internal-panel" />
		</div>
	</div>
	
</wicket:panel>
<wicket:fragment wicket:id="ajaxTab">
	<a wicket:id="trigger"/>
</wicket:fragment>
</html>
