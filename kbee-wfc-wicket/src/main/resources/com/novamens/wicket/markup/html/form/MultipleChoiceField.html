<wicket:panel>
	<div class="field choice-field">
		<div class="control-label" wicket:id="label-container">
			<label for="label" wicket:id="label"></label>
			<i wicket:id="mandatory" class="mandatory fas fa-asterisk" title="field is required"></i>
			<span class="highlight atright" wicket:id="readonly" >(<wicket:message key="readonly" />)</span>
			<a wicket:id="help-info"><i class="fal fa-info-circle" style="float:right;"></i></a>
		</div>
		<div class="col-lg-10" wicket:id="horizontal-layout">
			<wicket:container wicket:id="control"/>
		</div>
		<wicket:container wicket:id="control"/>
	</div>
</wicket:panel>

<wicket:fragment wicket:id="control-fragment">

	<div wicket:id="subtitle-container" style="float:left; width:100%; padding:15px;">
				<span wicket:id="subtitle" />	
		</div>
		
		
	<div class="col-lg-12 col-md-11 col-xs-12  checkbox" wicket:id="option" style="padding-top: 10px;padding-left: 25px;">
		<input class="styled" type="checkbox" wicket:id="input" />
		<label class="control-label" wicket:id="label" for="">[]</label>
	</div>	
	
	<small wicket:id="help" class="help-block"></small>
	
	<wicket:container wicket:id="feedback">
		<span wicket:id="icon" class=" far fa-times form-control-feedback" style="right: 28px;"></span>
		<small wicket:id="error" class="error-block"></small>
	</wicket:container>
</wicket:fragment>
